<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No maximum-scale: pinch-zoom has to stay available to inspect a generated
     image in detail. iOS instead zooms on its own when a focused field is
     smaller than 16px, which is why form controls get an explicit 16px. -->
<meta name="theme-color" content="#12131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>手机界面</title>
<style>
:root {
    color-scheme: dark;
    --bg: #12131a;
    --surface: #1b1d26;
    --surface-2: #23252f;
    --line: #303342;
    --text: #eceef6;
    --muted: #9aa0b4;
    --accent: #4d7cfe;
    --accent-press: #3f68d8;
    --danger: #e5484d;
    --ok: #30a46c;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    /* A stack that resolves on both phones: iOS gets SF + PingFang, Android
       uses HarmonyOS Sans / MiSans where the vendor ships one, then the Noto
       family, then whatever the system calls its Chinese face. Without the
       CJK names first, Android falls back to a serif-ish default far more
       often than it should. */
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI Variable Text", "Segoe UI",
          "PingFang SC", "HarmonyOS Sans SC", "MiSans",
          "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC",
          "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
}
/* Fixed viewport height so the scroll area below is bounded: with
   min-height the form would stretch the page instead of scrolling inside it. */
html { height: 100%; }
body {
    display: flex; flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

/* ---------- header ---------- */
header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + var(--safe-top)) 12px 8px;
    background: rgba(18, 19, 26, .92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
}
header h1 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
    /* 44px is the minimum comfortable touch target; 36px was easy to miss. */
    flex: none; width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); color: var(--text);
    cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- scroll area ---------- */
main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* Room for the fixed footer (progress + status + chip + buttons), so the
       last field always scrolls clear of it. The value is measured from the
       footer itself: a fixed 130px was short whenever a status line or the
       "查看结果" chip was visible, and the last field sat behind it. */
    padding: 12px 14px calc(var(--footer-h, 130px) + var(--safe-bottom) + 8px);
}

/* ---------- per-subgraph sections ---------- */
.section-head {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
}
.section-head + .field { margin-top: 0; }
.section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    letter-spacing: .01em;
}
.section-head::before {
    content: ""; flex: none;
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--accent);
}

/* A QQ-多值输入 node's heading: the same flat row as a section head, one size
   up, with a chevron on the right that folds its fields away. */
.multi-fold { margin: 8px 0 10px; }
.multi-fold > .multi-head {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    list-style: none;
    user-select: none;
}
.multi-fold > .multi-head::-webkit-details-marker { display: none; }
.multi-fold > .multi-head::before {
    content: ""; flex: none;
    width: 3px; height: 17px; border-radius: 2px;
    background: var(--accent);
}
.multi-fold .multi-title {
    flex: 1; min-width: 0;
    font-size: 17px; font-weight: 700; letter-spacing: .01em;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.multi-fold .count {
    flex: none;
    min-width: 20px; padding: 1px 6px;
    font-size: 11px; font-weight: 600; text-align: center;
    color: var(--muted); background: var(--surface-2);
    border-radius: 999px;
}
.multi-fold .multi-chevron {
    flex: none; display: grid; place-items: center;
    color: var(--muted);
    transition: transform .18s ease;
}
.multi-fold[open] .multi-chevron { transform: rotate(180deg); }
.multi-fold .multi-body { padding-top: 12px; }
.multi-fold:not([open]) > .multi-body { display: none; }
.multi-fold:not([open]) { margin-bottom: 14px; }

/* ---------- pipeline picker ---------- */
/* Folder headings mirror the editor's workflow sidebar. */
.folder-head {
    margin: 18px 0 8px;
    padding-left: 2px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
    color: var(--muted);
    text-transform: none;
}
.pipeline-list:first-child .folder-head { margin-top: 0; }
.pipeline-list { display: flex; flex-direction: column; gap: 10px; }
/* A workflow that exists but has no template yet: listed, but not runnable. */
.pipeline-row.is-pending { opacity: .55; }
.pipeline-row.is-pending .pipeline-arrow { opacity: .35; }
.pipeline-row.is-preparing { opacity: .9; }
.pipeline-row.is-preparing .pipeline-meta { color: var(--accent); }
.pipeline-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 16px 14px;
    text-align: left;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
}
.pipeline-row:active { background: var(--surface-2); }
.pipeline-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pipeline-name {
    font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pipeline-meta { font-size: 12px; color: var(--muted); }
.pipeline-arrow { flex: none; display: grid; place-items: center; color: var(--muted); }
/* the picker's own search stays reachable while the list scrolls */
.pipeline-search {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding-bottom: 10px;
}
.folder-head.recent { color: var(--accent); }

/* ---------- media picker ---------- */
.media { display: flex; flex-direction: column; gap: 10px; }
.media-thumbs {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    min-height: 96px;
    -webkit-overflow-scrolling: touch;
}
.media-item span {
    display: block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-empty {
    flex: 1; display: grid; place-items: center;
    color: var(--muted); font-size: 13px;
}
.media-item {
    position: relative; flex: none;
    width: 96px;
    display: flex; flex-direction: column; gap: 4px;
}
.media-item img,
.media-item .media-audio {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
    display: block;
}
.media-item video {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
}
.media-item .media-audio {
    display: grid; place-items: center;
    font-size: 32px; color: var(--muted);
}
.media-item span {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-remove {
    position: absolute; top: -6px; right: -6px;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: var(--danger); color: #fff;
    font-size: 15px; line-height: 1;
    cursor: pointer;
}
.media-actions { display: flex; gap: 10px; }
.media-btn {
    flex: 1; min-height: 44px;
    font: 600 14px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px;
    cursor: pointer;
}
.media-btn:active { background: var(--surface-2); }
.media-btn.primary { color: #fff; background: var(--accent); border-color: transparent; }
.media-btn:disabled { opacity: .5; }

/* modal list */
.picker {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: flex-end;
    background: rgba(0, 0, 0, .55);
}
.picker-sheet {
    width: 100%; max-height: 80dvh;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding-bottom: var(--safe-bottom);
    animation: sheetIn .2s ease-out;
}
@keyframes sheetIn {
    from { transform: translateY(24px); opacity: .6; }
    to { transform: translateY(0); opacity: 1; }
}
.picker-head {
    display: flex; align-items: center;
    padding: 14px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
}
.picker-close {
    margin-left: auto;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--muted);
    line-height: 1; cursor: pointer;
}
.picker-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.picker-row {
    display: block; width: 100%;
    padding: 13px 16px;
    text-align: left;
    font: inherit; font-size: 14px;
    color: var(--text); background: transparent;
    border: 0; border-bottom: 1px solid rgba(255,255,255,.04);
    cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.on { background: rgba(77, 124, 254, .16); color: #b9cbff; }
.picker-foot { padding: 12px 16px; border-top: 1px solid var(--line); }

/* combo choices: the native <select> popup is a light, browser-drawn box that
   ignores the page, wraps long model paths and cannot be filtered. */
.picker-row.combo {
    display: flex; align-items: center; gap: 10px;
    white-space: normal;
    padding: 12px 16px;
}
.picker-row.combo .row-main { min-width: 0; flex: 1; }
.picker-row.combo .row-name {
    display: block; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.combo .row-dir {
    display: block; margin-top: 2px; font-size: 11px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.combo .tick { flex: none; display: grid; place-items: center; color: var(--accent); }
.picker-row.combo.previewing {
    background: rgba(255, 255, 255, .05);
    box-shadow: inset 0 0 0 1px var(--accent);
}

/* the preview strip: one tap looks, a second tap picks */
.picker-preview {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
}
.picker-preview[hidden] { display: none; }
.picker-preview .thumb {
    flex: none;
    width: 92px; height: 92px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
    display: grid; place-items: center;
}
.picker-preview .thumb img,
.picker-preview .thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
}
.picker-preview .thumb .none {
    font-size: 11px; line-height: 1.3; color: var(--muted);
    text-align: center; padding: 0 6px;
}
.picker-preview .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.picker-preview .pname {
    font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-preview .pdir {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-preview .pdir[hidden] { display: none; }
.picker-preview .phint { font-size: 11px; color: var(--accent); margin-top: 2px; }
.picker-search { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.picker-search input {
    width: 100%; box-sizing: border-box;
    padding: 10px 12px;
    font: inherit; font-size: 15px;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px;
}
.picker-search input:focus { outline: 0; border-color: var(--accent); }
.picker-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- paint mask editor ---------- */
.media-item { position: relative; }
.media-item.has-mask { outline: 2px solid var(--accent); outline-offset: -2px; }
.media-mask {
    position: absolute; left: 3px; bottom: 20px;
    width: 22px; height: 22px; padding: 0;
    display: grid; place-items: center;
    font: 700 11px/1 inherit;
    color: #fff; background: rgba(62, 72, 80, .9);
    border: 1px solid rgba(0, 0, 0, .35); border-radius: 50%;
    cursor: pointer;
}
.media-item.has-mask .media-mask { background: var(--accent); border-color: transparent; }

.mask-overlay {
    position: fixed; inset: 0; z-index: 130;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    background: rgba(0, 0, 0, .7);
}
.mask-panel {
    display: flex; flex-direction: column;
    width: 100%; max-width: 560px; max-height: 100%;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
}
.mask-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
}
.mask-head span {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mask-stage {
    position: relative; align-self: center;
    margin: 12px;
    line-height: 0;
    border-radius: 10px;
    overflow: hidden;
    background: repeating-conic-gradient(#23252f 0% 25%, #1b1d26 0% 50%) 0 0 / 16px 16px;
}
.mask-picture, .mask-paint { display: block; }
.mask-paint { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
.mask-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 0 14px 12px;
}
.mask-tools button {
    padding: 7px 12px;
    font: 600 13px/1 inherit;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer;
}
.mask-tools button.on { color: #fff; background: var(--accent); border-color: transparent; }
.mask-brush { flex: 1; min-width: 90px; }
.mask-foot {
    display: flex; gap: 10px;
    padding: 12px 14px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line);
}
.mask-foot button {
    flex: 1; min-height: 44px;
    font: 600 14px/1 inherit;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer;
}
.mask-foot button.primary { color: #fff; background: var(--accent); border-color: transparent; }
.mask-foot button:disabled { opacity: .6; }

/* ---------- media picker sheet ---------- */
.media-sheet .media-strip {
    display: flex; gap: 8px;
    align-items: flex-start;
    /* Fixed content in a column flex sheet: without this the list's flex:1
       squeezes the strip to a sliver. */
    flex: none;
    padding: 10px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch;
}
.media-sheet .media-strip[hidden] { display: none; }
.media-chip {
    flex: none; width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    /* Fixed height: before the image decodes the chip would otherwise collapse
       and squash the whole strip. */
    height: 82px;
}
.media-chip img,
.media-chip video {
    flex: none;
    width: 64px; height: 64px; min-height: 64px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2);
}
.media-chip .media-audio {
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--muted); font-size: 20px;
}
.media-chip span {
    width: 100%; font-size: 10px; color: var(--muted);
    text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Rows: thumbnail on the left, name next to it, tick on the right. */
.media-grid { padding: 8px 0; }
.media-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, .04);
}
.media-row img,
.media-row video {
    flex: none;
    width: 52px; height: 52px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2);
}
.media-row .media-audio {
    flex: none;
    width: 52px; height: 52px;
    display: grid; place-items: center;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--muted); font-size: 18px;
}
.media-row .media-row-name {
    flex: 1; min-width: 0;
    font-size: 14px; text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-row .tick {
    flex: none; display: grid; place-items: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    color: var(--muted);
}
/* A file that cannot be previewed: a flat tile, not a broken-image icon. */
.media-row img:not([src]),
.media-row img.broken,
.media-item img:not([src]),
.media-item img.broken,
.history-item img.broken,
.media-chip img:not([src]),
.media-chip img.broken {
    background: var(--surface-2);
    object-fit: cover;
}
.media-row.on {
    background: rgba(77, 124, 254, .14);
}
.media-row.on .tick { color: var(--accent); }
/* Footer: cancel + confirm side by side. */
.media-sheet .picker-foot { display: flex; gap: 10px; }
.media-sheet .picker-foot .media-btn { flex: 1; }

/* input / output switch and the time-order toggle */
.media-tabs {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
}
.media-tab {
    flex: none;
    padding: 6px 14px;
    font: 600 13px/1 inherit;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer;
}
.media-tab.on {
    color: #fff; background: var(--accent); border-color: transparent;
}
.media-sort {
    margin-left: auto;
    padding: 6px 12px;
    font: 600 12px/1 inherit;
    color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer;
}
.media-sort:active { color: var(--text); }

/* name + timestamp, with the prompt button before the tick */
.media-row-main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
}
.media-row-time { font-size: 11px; color: var(--muted); }
.media-row-prompt {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    cursor: pointer;
}
.media-row-prompt:active { color: var(--accent); }
.media-row-prompt.busy { opacity: .5; }

/* the field that opens it */
.select-field {
    display: flex; align-items: center; gap: 8px;
    width: 100%; box-sizing: border-box;
    padding: 9px 12px;
    font: inherit; font-size: 14px; text-align: left;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
}
.select-field:active { background: var(--surface-2); }
.select-field .value {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 1px;
}
.select-field .vname {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.select-field .vdir {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.select-field .chev { flex: none; display: grid; place-items: center; color: var(--muted); }

/* ---------- fullscreen text editor ---------- */
.editor {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: var(--bg);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    /* Slide in from the bottom so it reads as an in-place expansion. */
    animation: editorIn .18s ease-out;
}
.editor[hidden] { display: none; }
@keyframes editorIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
.editor-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
}
.editor-head h2 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editor-head button {
    flex: none; min-height: 38px; padding: 0 15px;
    font: 600 15px/1 inherit;
    border-radius: 10px; cursor: pointer;
}
.editor-head .done {
    color: #fff; background: var(--accent); border: 0;
}
.editor-head .clear {
    color: var(--muted); background: transparent;
    border: 1px solid var(--line);
}
.editor-body {
    flex: 1; min-height: 0;
    display: flex;
    padding: 12px;
}
.editor-body textarea {
    flex: 1; width: 100%;
    resize: none;
    padding: 14px;
    font: inherit; line-height: 1.6;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    outline: none;
}
.editor-body textarea:focus { border-color: var(--accent); }
.editor-foot {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 12px;
    font-size: 12px; color: var(--muted);
}
.editor-foot .grow { flex: 1; }
/* Long-press affordance on text fields. */
.longpressable { position: relative; -webkit-touch-callout: none; }
.longpressable.pressing { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- fields ---------- */
.field { margin-bottom: 12px; }
.field > label {
    display: block; margin-bottom: 5px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    letter-spacing: .01em;
}
.field textarea,
.field input[type="text"],
.field input[type="number"],
.field select {
    width: 100%;
    padding: 9px 12px;
    /* 16px, not the inherited 15px: iOS Safari zooms the whole page when a
       focused control is smaller than that, which feels like a broken layout.
       Written as longhands because `font: 16px/1.5 inherit` is invalid CSS and
       would be dropped, leaving the browser default. */
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    outline: none;
    appearance: none;
}
.field textarea {
    min-height: 84px; resize: none; line-height: 1.5;
}
.text-wrap > textarea { padding-bottom: 12px; }
/* Room for the 清空 button pinned in the corner, so the last line never runs
   underneath it. Only reserved while that button is actually shown: an empty
   prompt box should not carry the extra 28px. */
.text-wrap.has-clear > textarea { padding-bottom: 40px; }
/* Text fields get a tap target for the fullscreen editor, since a long press
   is not something anyone discovers on their own. */
.text-wrap { position: relative; display: flex; }
.text-wrap > textarea,
.text-wrap > input { flex: 1; padding-right: 44px; }
.expand-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
}
.expand-btn:active { color: var(--text); background: var(--line); }
/* Sits under 全屏编辑, same size and border, so the right edge stays a column. */
.clear-btn {
    position: absolute; bottom: 8px; right: 8px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    line-height: 1; cursor: pointer;
}
.clear-btn:active { color: var(--danger); background: var(--line); }
.clear-btn[hidden] { display: none; }
.field textarea:focus,
.field input:focus,
.field select:focus { border-color: var(--accent); }

.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper button {
    flex: none; width: 42px;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 500;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
.stepper button:active { background: var(--surface-2); }
.stepper input { text-align: center; min-width: 0; font-variant-numeric: tabular-nums; }
.stepper .dice-btn { color: var(--muted); }
.stepper .dice-btn:active { color: var(--text); }

.group summary .group-where {
    margin-left: 8px;
    font-size: 11px; font-weight: 400;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* While a job runs the button breathes very slightly, so the screen never
   looks stuck between two polls. */
#generate.busy { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(77, 124, 254, 0); }
    50% { box-shadow: 0 0 0 4px rgba(77, 124, 254, .18); }
}

/* Reset the whole form back to the values baked into the workflow. */
.reset-btn {
    display: block;
    margin: 14px auto 0;
    padding: 8px 16px;
    font: 600 13px/1 inherit;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer;
}
.reset-btn:active { color: var(--text); background: var(--surface-2); }

/* ---------- batch count ---------- */
.batch-btn {
    flex: none; min-width: 52px; padding: 0 10px;
    font: 600 13px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
}
.batch-btn:active { background: var(--surface-2); }
.batch-btn.on { color: #fff; background: var(--accent); border-color: transparent; }

/* ---------- recent results ---------- */.history {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 0 0 4px;
    -webkit-overflow-scrolling: touch;
}
.history[hidden] { display: none; }
.history-item {
    flex: none; width: 76px;
    padding: 0; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--surface);
    cursor: pointer;
}
.history-item img { display: block; width: 100%; height: 76px; object-fit: cover; }
.history-item .stamp {
    display: block; padding: 3px 0 4px;
    font-size: 10px; color: var(--muted); text-align: center;
}

/* ---------- fullscreen image viewer ---------- */
.viewer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: #0b0c11;
}
.viewer[hidden] { display: none; }
.viewer-bar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    font-size: 12px; color: var(--muted);
}
.viewer-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-close {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--text); cursor: pointer;
}
.viewer-stage {
    flex: 1; min-height: 0;
    display: grid; place-items: center;
    padding: 4px;
}
.viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer-actions {
    display: flex; gap: 10px;
    padding: 12px 14px calc(14px + var(--safe-bottom));
}
.viewer-actions button,
.viewer-actions a {
    flex: 1;
    display: grid; place-items: center;
    min-height: 46px;
    font: 600 14px/1 inherit;
    border-radius: 12px; text-decoration: none;
    border: 1px solid var(--line);
    color: var(--text); background: var(--surface);
    cursor: pointer;
}
.viewer-actions button {
    color: #fff; background: var(--accent); border-color: transparent;
}
.viewer-actions button:active { background: var(--accent-press); }

/* Boolean row: a real switch instead of the browser's grey checkbox.
   The native control carries a UA margin (its right edge stopped 3px short of
   the fields above it) and renders as a flat square when off, so it is drawn
   here as a track with a knob, aligned to the same right edge as the inputs. */
.switch {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    /* Pulled up by half the difference between the switch and a label line, so
       the label still sits on the same baseline as the labels above it. */
    margin-top: -5px;
    margin-bottom: 12px;
}
.switch > label { margin: 0; flex: 1; min-width: 0; }
.switch input {
    appearance: none; -webkit-appearance: none;
    margin: 0; flex: none;
    position: relative;
    width: 46px; height: 28px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
}
.switch input::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; opacity: .7;
    transition: transform .18s ease, opacity .18s ease;
}
.switch input:checked {
    background: var(--accent);
    border-color: transparent;
}
.switch input:checked::after {
    transform: translateX(18px);
    opacity: 1;
}
.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

select { background-image: none; }

/* ---------- collapsible group ---------- */
/* A collapsible section, deliberately quieter than a form field: it groups
 * secondary settings, so it reads as a divider rather than an input box. */
details.group {
    margin: 20px 0 16px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    background: transparent;
}
details.group > summary {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 2px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .02em;
    cursor: pointer; list-style: none;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after {
    content: "▾"; margin-left: auto; color: var(--muted);
    font-size: 12px;
    transition: transform .18s ease;
}
details.group[open] > summary::after { transform: rotate(180deg); }
details.group > summary .count {
    padding: 1px 6px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 500;
}
details.group > .body { padding: 4px 0 6px; }
details.group .field:last-child { margin-bottom: 0; }

/* ---------- results ---------- */
main > .section-label {
    margin: 22px 0 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
}
main > .section-label[hidden] { display: none; }
.results { display: flex; flex-direction: column; gap: 12px; }
.result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
}
.result-card img,
.result-card video {
    display: block; width: 100%; height: auto; background: #0b0c11;
}
.result-card pre {
    margin: 0; padding: 12px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 13px; color: var(--muted);
}
.result-meta {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line);
}
.result-meta a { color: var(--accent); text-decoration: none; margin-left: auto; }

/* ---------- status ---------- */
.status { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; min-height: 20px; }
.status[hidden] { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.done { background: var(--ok); }
.dot.error { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.status-text { font-size: 13px; color: var(--muted); }

.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-bottom: 14px; }
.progress[hidden] { display: none; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
/* No step reported yet: a sweep instead of an empty bar, so a starting job
   never looks like a frozen screen. */
.progress.indeterminate > div {
    width: 34%;
    animation: sweep 1.15s ease-in-out infinite;
}
@keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(295%); }
}

/* ---------- footer ---------- */
footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    /* Column so the status line can live here instead of above the form: a
       row that appears and disappears there would shift the whole page. */
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px 14px calc(12px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(18,19,26,.75), var(--bg) 45%);
    backdrop-filter: blur(12px);
}
footer[hidden] { display: none; }
.footer-row { display: flex; gap: 10px; }
footer .progress { margin: 0; }
footer .status { margin: 0; min-height: 18px; }
footer button.primary {
    flex: 1; min-height: 50px;
    font: 600 16px/1 inherit;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
footer button.primary:active { background: var(--accent-press); }
footer button.primary:disabled { opacity: .55; }
footer button.ghost {
    flex: none; min-width: 92px; padding: 0 16px;
    font: 600 15px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
footer button.ghost:active { background: var(--surface-2); }

/* Chip that jumps back to a finished result. It lives inside the footer so it
   can never cover a form control. */
.result-chip {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 38px;
    font: 600 13px/1 inherit;
    color: var(--accent);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    animation: chipIn .18s ease-out;
}
.result-chip[hidden] { display: none; }
@keyframes chipIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.spinner {
    width: 16px; height: 16px; flex: none;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
    padding: 40px 20px; text-align: center;
    color: var(--muted); font-size: 14px; line-height: 1.7;
}
.empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 15px; }
.toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(84px + var(--safe-bottom));
    z-index: 40; padding: 11px 14px;
    background: #2b2330; border: 1px solid #4a3550;
    border-radius: 12px; font-size: 13px; color: #f3d9ff;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<header>
    <button class="icon-btn" id="back" aria-label="返回 ComfyUI" title="返回 ComfyUI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>
    <h1 id="title">手机界面</h1>
    <button class="icon-btn" id="switch" aria-label="切换流水线" title="切换流水线" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h13"></path>
            <path d="M14 4l3 3-3 3"></path>
            <path d="M20 17H7"></path>
            <path d="M10 14l-3 3 3 3"></path>
        </svg>
    </button>
    <button class="icon-btn" id="reload" aria-label="刷新参数" title="刷新参数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
            <path d="M21 3v6h-6"></path>
        </svg>
    </button>
</header>

<main id="main">
    <form id="form" autocomplete="off"></form>
    <div class="section-label" id="resultsLabel" hidden>结果</div>
    <div class="results" id="results"></div>
    <div class="section-label" id="historyLabel" hidden>最近生成</div>
    <div class="history" id="history"></div>
</main>

<div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
        <span id="viewerMeta"></span>
        <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 6l12 12"></path><path d="M18 6L6 18"></path>
            </svg>
        </button>
    </div>
    <div class="viewer-stage"><img id="viewerImage" alt=""></div>
    <div class="viewer-actions">
        <button id="viewerReuse" type="button">用这组参数再跑</button>
        <a id="viewerOpen" target="_blank" rel="noopener">原图</a>
    </div>
</div>

<footer id="footer">
    <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
    <div class="status" id="status" hidden>
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText"></span>
    </div>
    <button class="result-chip" id="resultChip" type="button" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path>
        </svg>
        <span>查看结果</span>
    </button>
    <div class="footer-row">
        <button class="batch-btn" id="batch" type="button" title="连续生成张数" aria-label="连续生成张数">×1</button>
        <button class="primary" id="generate" type="button"><span>生成</span></button>
        <button class="ghost" id="cancel" type="button" hidden>取消</button>
    </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Fullscreen editor opened by long-pressing a text field. -->
<section class="editor" id="editor" hidden aria-hidden="true">
    <div class="editor-head">
        <h2 id="editorTitle">编辑</h2>
        <button type="button" class="clear" id="editorWipe" title="清空内容" aria-label="清空内容">清空</button>
        <button type="button" class="clear" id="editorRevert">还原</button>
        <button type="button" class="done" id="editorDone">完成</button>
    </div>
    <div class="editor-body">
        <textarea id="editorText" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="editor-foot">
        <span class="grow" id="editorCount">0 字</span>
        <span>完成即生效</span>
    </div>
</section>

<script>
"use strict";

const TOAST_MS = 3200;
const POLL_MS = 1200;
const STORAGE_KEY = "qq-mobile-values";

const el = (id) => document.getElementById(id);
const state = {
    workflow: new URLSearchParams(location.search).get("workflow") || "",
    parameters: [],
    values: {},
    promptId: "",
    // Every id of the current run: a batch queues several at once.
    promptIds: [],
    media: [],
    failedError: "",
    batch: 1,
    polling: false,
    timer: null,
};

function toast(message) {
    const node = el("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove("show"), TOAST_MS);
}

function setStatus(kind, text) {
    const wrap = el("status");
    if (!kind) { wrap.hidden = true; return; }
    wrap.hidden = false;
    el("statusDot").className = `dot ${kind}`;
    el("statusText").textContent = text;
}

/** The footer holds the action button, so it only belongs on a pipeline. */
function setFooterVisible(visible) {
    el("footer").hidden = !visible;
    el("reload").hidden = !visible;
    if (!visible) {
        el("resultChip").hidden = true;
    }
}

/**
 * Progress bar.
 *
 * ``ratio`` undefined hides it. ``null`` shows the indeterminate sweep used
 * while the server has not reported a step yet: the old bar simply vanished,
 * so a queued or starting job looked like a frozen screen.
 */
function setProgress(ratio) {
    const bar = el("progress");
    const fill = el("progressBar");
    if (ratio === undefined) {
        bar.hidden = true;
        bar.classList.remove("indeterminate");
        return;
    }
    bar.hidden = false;
    if (ratio === null) {
        bar.classList.add("indeterminate");
        fill.style.width = "";
        return;
    }
    bar.classList.remove("indeterminate");
    fill.style.width = `${Math.max(0, Math.min(1, ratio)) * 100}%`;
}

/* ---------------- value persistence ---------------- */
function loadStoredValues() {
    try {
        const raw = localStorage.getItem(`${STORAGE_KEY}:${state.workflow}`);
        return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
}
function storeValues() {
    try {
        localStorage.setItem(
            `${STORAGE_KEY}:${state.workflow}`, JSON.stringify(state.values));
    } catch { /* storage full or blocked: not fatal */ }
}

/* ---------------- form rendering ---------------- */
function coerce(parameter, raw) {
    const type = String(parameter.type || "").toUpperCase();
    if (type === "INT") {
        const n = Number.parseInt(raw, 10);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "FLOAT") {
        const n = Number.parseFloat(raw);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "BOOLEAN") return Boolean(raw);
    return raw;
}

function isCombo(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    return Array.isArray(parameter.options) && parameter.options.length > 0
        || type === "COMBO";
}

/**
 * Readable name for a field.
 *
 * Workflows label most inputs in Chinese, but a promoted ComfyUI input often
 * arrives as its raw socket name — "seed", "sampler_name", "clip" sitting next
 * to "随机种" and "采样器" from the same form. Only the well-known internals are
 * translated; a name the user chose themselves is left exactly as written.
 */
const LABEL_ALIASES = {
    seed: "随机种",
    noise_seed: "随机种",
    sampler_name: "采样器",
    sampler: "采样器",
    scheduler: "调度器",
    steps: "步数",
    cfg: "CFG",
    denoise: "重绘幅度",
    batch_size: "批量张数",
    filename_prefix: "保存前缀",
    width: "宽度",
    height: "高度",
    vae: "VAE",
    clip: "CLIP",
    model: "模型",
    image: "图像",
    text: "文本",
    prompt: "提示词",
    negative_prompt: "反向提示词",
    unet_name: "主模型",
    ckpt_name: "检查点",
    lora_name: "LoRA",
};

function prettyLabel(text) {
    const raw = String(text ?? "").trim();
    if (!raw) return raw;
    return LABEL_ALIASES[raw.toLowerCase()] || raw;
}

/** A hint inside an empty field, so a blank row still says what goes in it. */
function placeholderFor(parameter) {
    const text = String(parameter.label || parameter.name || "");
    if (/提示词|prompt|文本|text/i.test(text)) return "输入提示词…";
    if (/前缀|prefix/i.test(text)) return "文件名前缀";
    if (/图像|图片|image/i.test(text)) return "图片文件名…";
    return "";
}

function fieldFor(parameter) {
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = prettyLabel(parameter.label || parameter.name);
    label.setAttribute("for", `f-${parameter.key}`);
    wrap.appendChild(label);

    const type = String(parameter.type || "STRING").toUpperCase();
    const value = state.values[parameter.key] ?? parameter.value;
    const commit = (next) => {
        state.values[parameter.key] = next;
        storeValues();
    };

    // Media inputs (LoadImage, QQ-多媒体加载, ...) get a picker with upload.
    if (parameter.media) {
        wrap.appendChild(mediaField(parameter, value, commit));
        return wrap;
    }

    if (type === "BOOLEAN") {
        wrap.classList.add("switch");
        wrap.removeChild(label);
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.id = `f-${parameter.key}`;
        toggle.checked = Boolean(value);
        toggle.addEventListener("change", () => commit(toggle.checked));
        wrap.append(label, toggle);
        label.style.marginBottom = "0";
        return wrap;
    }

    if (isCombo(parameter) && (parameter.options || []).length) {
        const options = [...parameter.options];
        // A value that is no longer offered (a LoRA that was deleted) stays
        // selectable, so opening the field cannot silently change the value.
        if (value != null && !options.includes(value)) options.unshift(value);

        const field = document.createElement("button");
        field.type = "button";
        field.className = "select-field";
        field.id = `f-${parameter.key}`;

        const valueBox = document.createElement("span");
        valueBox.className = "value";
        const nameEl = document.createElement("span");
        nameEl.className = "vname";
        const dirEl = document.createElement("span");
        dirEl.className = "vdir";
        valueBox.append(nameEl, dirEl);

        const chev = document.createElement("span");
        chev.className = "chev";
        chev.innerHTML = iconSvg("down", 15);

        const paint = (next) => {
            const { dir, name } = splitOptionPath(next);
            nameEl.textContent = name || "（空）";
            dirEl.textContent = dir;
            dirEl.hidden = !dir;
            field.title = String(next ?? "");
        };
        paint(value ?? options[0] ?? "");

        field.append(valueBox, chev);
        field.addEventListener("click", () => {
            // Model lists are long and folder-organised; the list is reordered
            // so the folder that matches this pipeline comes first.
            const ordered = rankModelOptions(
                options,
                parameter.options,
                el("title")?.textContent || "",
            );
            chooseOption(parameter.label || parameter.name, ordered, state.values[parameter.key], (next) => {
                commit(next);
                paint(next);
            });
        });
        wrap.appendChild(field);
        return wrap;
    }

    if (type === "INT" || type === "FLOAT") {
        const stepper = document.createElement("div");
        stepper.className = "stepper";
        // INT steps by whole numbers, FLOAT by 0.1. A fractional step on an INT
        // field is what made the buttons do nothing: 2 + 0.1 rounded straight
        // back to 2, so the value never moved.
        const step = type === "INT"
            ? Math.max(1, Math.round(Number(parameter.step) || 1))
            : 0.1;
        // How many decimals the value may keep, so repeated stepping cannot
        // drift into 0.44999999999999996.
        const decimals = type === "INT" ? 0 : 1;
        const clean = (n) => {
            const rounded = Number(n.toFixed(decimals));
            return type === "INT" ? Math.round(rounded) : rounded;
        };
        const input = document.createElement("input");
        input.type = "number";
        input.inputMode = type === "INT" ? "numeric" : "decimal";
        input.id = `f-${parameter.key}`;
        input.value = value ?? 0;
        if (parameter.min != null) input.min = parameter.min;
        if (parameter.max != null) input.max = parameter.max;
        input.step = step;

        const clamp = (n) => {
            let next = n;
            if (parameter.min != null) next = Math.max(parameter.min, next);
            if (parameter.max != null) next = Math.min(parameter.max, next);
            return clean(next);
        };
        /** Move one step; returns false when the value could not change. */
        const bump = (delta) => {
            const current = Number.parseFloat(input.value);
            const base = Number.isFinite(current) ? current : 0;
            const next = clamp(base + delta * step);
            if (next === clean(base)) return false;
            input.value = next;
            commit(next);
            return true;
        };

        const minus = document.createElement("button");
        minus.type = "button";
        minus.innerHTML = iconSvg("minus");
        minus.title = "减";
        minus.setAttribute("aria-label", "减");
        const plus = document.createElement("button");
        plus.type = "button";
        plus.innerHTML = iconSvg("plus");
        plus.title = "加";
        plus.setAttribute("aria-label", "加");

        // At a bound the button greys out, so "nothing happens" reads as "this
        // is the limit" instead of "the control is broken".
        const syncBounds = () => {
            const current = Number.parseFloat(input.value);
            if (!Number.isFinite(current)) return;
            minus.disabled = parameter.min != null && clean(current) <= Number(parameter.min);
            plus.disabled = parameter.max != null && clean(current) >= Number(parameter.max);
        };

        minus.addEventListener("click", () => {
            bump(-1);
            syncBounds();
        });
        plus.addEventListener("click", () => {
            bump(1);
            syncBounds();
        });

        input.addEventListener("input", () => {
            const parsed = Number.parseFloat(input.value);
            if (Number.isFinite(parsed)) commit(coerce(parameter, parsed));
            syncBounds();
        });
        syncBounds();

        if (isSeedParameter(parameter)) {
            // A seed is a 15 digit number: stepping it by one is meaningless,
            // and the extra buttons squeeze the value out of the field on a
            // narrow phone. One dice button replaces both.
            const dice = document.createElement("button");
            dice.type = "button";
            dice.className = "dice-btn";
            dice.innerHTML = iconSvg("dice");
            dice.title = "随机种子";
            dice.setAttribute("aria-label", "随机种子");
            dice.addEventListener("click", () => {
                const next = randomSeed(parameter);
                input.value = next;
                commit(next);
            });
            stepper.append(input, dice);
        } else {
            stepper.append(minus, input, plus);
        }

        wrap.appendChild(stepper);
        return wrap;
    }

    // A prompt is a paragraph no matter how long the current value happens to
    // be: sizing the control by the value alone turned an empty prompt into a
    // one-line box, which then grew into a textarea only after a re-render.
    const looksLikePrompt = /提示词|prompt|文本|text/i.test(
        String(parameter.label || parameter.name || ""),
    );
    const multiline = parameter.multiline || looksLikePrompt || String(value ?? "").length > 60;
    const input = document.createElement(multiline ? "textarea" : "input");
    if (multiline) {
        // Four lines is the resting size; the box then follows the text, so a
        // long prompt is not read through a five-line window and a short one
        // does not leave a tall empty block on screen.
        input.rows = 3;
    } else {
        input.type = "text";
    }
    input.id = `f-${parameter.key}`;
    input.value = value ?? "";
    const hint = placeholderFor(parameter);
    if (hint) input.placeholder = hint;
    input.addEventListener("input", () => {
        commit(input.value);
        if (multiline) autoGrow(input);
    });
    if (multiline) {
        // Runs after the value is in place and the element has a width.
        requestAnimationFrame(() => autoGrow(input));
    }
    // Hold for 2s to edit this text full screen; the corner button is the
    // discoverable way to do the same thing.
    attachLongPress(input, parameter);
    wrap.appendChild(textWrapWithExpand(input, parameter));
    return wrap;
}

/**
 * Size a textarea to its content, within limits.
 *
 * Fixed rows forced a long prompt to be read through a scroll window while a
 * short one left a tall empty box. Height follows the text between the resting
 * size and a cap, so a big prompt still scrolls instead of pushing the form
 * off the screen.
 */
function autoGrow(textarea) {
    const MIN = 84;
    const MAX = 320;
    textarea.style.height = "auto";
    const next = Math.min(MAX, Math.max(MIN, textarea.scrollHeight + 2));
    textarea.style.height = `${next}px`;
    textarea.style.overflowY = textarea.scrollHeight > MAX ? "auto" : "hidden";
}

/** Does this parameter hold a generation seed? */
function isSeedParameter(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    if (type !== "INT") return false;
    const name = String(parameter.name || "");
    const label = String(parameter.label || "");
    return /^(seed|noise_seed)$/i.test(name) || /种子/.test(label);
}

/** A fresh seed, honouring the field's declared range when it has one. */
function randomSeed(parameter) {
    // ComfyUI declares seeds up to 2^64-1, but a JS number only stays exact up
    // to 2^53 and its default range is 2^50. Staying in that band keeps the
    // value exact through JSON.
    const CEILING = 1125899906842624;
    const lo = Number.isFinite(parameter.min) ? Math.ceil(parameter.min) : 0;
    let hi = Number.isFinite(parameter.max) ? Math.floor(parameter.max) : CEILING;
    hi = Math.min(hi, Math.max(lo + 1, CEILING));
    return lo + Math.floor(Math.random() * (hi - lo));
}

/**
 * Wrap a text control with its corner buttons.
 *
 * Every field gets 全屏编辑 (top right). A long prompt gets 清空 (bottom right)
 * as well: rewriting a 200 character prompt on a phone is the one operation
 * where deleting the whole thing at once is what you actually want, and
 * select-all-then-delete is fiddly with the on-screen keyboard. The button
 * only shows while the field has content, so an empty box keeps its clean
 * single-button look.
 */
function textWrapWithExpand(input, parameter) {
    const wrap = document.createElement("div");
    wrap.className = "text-wrap";

    const expand = document.createElement("button");
    expand.type = "button";
    expand.className = "expand-btn";
    expand.innerHTML = iconSvg("expand", 17);
    expand.title = "全屏编辑";
    expand.setAttribute("aria-label", "全屏编辑");
    expand.addEventListener("click", () => openEditor(parameter, input));

    wrap.append(input, expand);

    // Multi-line controls are the long ones; a one-line name is easier to
    // retype than to hunt for a button.
    if (input.tagName === "TEXTAREA") {
        const clear = document.createElement("button");
        clear.type = "button";
        clear.className = "clear-btn";
        clear.innerHTML = iconSvg("erase", 17);
        clear.title = "清空";
        clear.setAttribute("aria-label", "清空内容");
        const sync = () => {
            clear.hidden = !input.value;
            // The reserved corner only exists while the button does, so an
            // empty box stays compact and a filled one keeps its last line
            // clear of the button.
            wrap.classList.toggle("has-clear", Boolean(input.value));
            autoGrow(input);
        };
        clear.addEventListener("click", () => {
            input.value = "";
            input.dispatchEvent(new Event("input", { bubbles: true }));
            sync();
            input.focus();
        });
        input.addEventListener("input", sync);
        sync();
        wrap.appendChild(clear);
    }
    return wrap;
}

/* ---------------- recent results ---------------- */
/**
 * The last few results, kept on the phone.
 *
 * The page is re-opened constantly, and before this the previous image was
 * gone the moment it was closed. Each entry also keeps the parameter values
 * that produced it, so "use these settings again" can bring back the same
 * seed instead of asking the user to remember it.
 */
const HISTORY_KEY = "qq-mobile-history";
const HISTORY_LIMIT = 24;

function loadHistory() {
    try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

function saveHistory(entries) {
    try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(entries.slice(0, HISTORY_LIMIT)));
    } catch {
        /* storage full or blocked: history is a convenience */
    }
}

/** Record the media of a finished run, newest first. */
function pushHistory(media) {
    const seen = new Set();
    const fresh = [];
    for (const item of media) {
        if (!item?.filename) continue;
        if (item.kind === "text" || item.kind === "audio") continue;
        const key = `${item.subfolder || ""}/${item.filename}`;
        if (seen.has(key)) continue;
        seen.add(key);
        fresh.push({
            f: item.filename,
            s: item.subfolder || "",
            t: item.type || "output",
            w: item.metadata?.width || null,
            h: item.metadata?.height || null,
            at: Date.now(),
            title: el("title").textContent,
            values: { ...state.values },
            workflow: state.workflow,
        });
    }
    if (!fresh.length) return;
    // Keep one entry per file: regenerating the same seed must not duplicate.
    const previous = loadHistory().filter((entry) => !seen.has(`${entry.s || ""}/${entry.f}`));
    const entries = [...fresh, ...previous].slice(0, HISTORY_LIMIT);
    saveHistory(entries);
    renderHistory();
}

function renderHistory() {
    const host = el("history");
    const label = el("historyLabel");
    if (!host) return;
    const entries = loadHistory();
    host.replaceChildren();
    host.hidden = !entries.length;
    label.hidden = !entries.length;
    for (const entry of entries) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = entry.f;
        // A strip of 76px tiles: the full-size original would be pure waste.
        img.src = thumbUrl(
            entry.s ? `${entry.s}/${entry.f}` : entry.f,
            entry.t === "output" ? "output" : "input",
            entry.at || 0,
        );
        img.addEventListener("error", () => img.classList.add("broken"));
        const stamp = document.createElement("span");
        stamp.className = "stamp";
        stamp.textContent = relativeTime(Math.round((entry.at || 0) / 1000));
        button.append(img, stamp);
        button.addEventListener("click", () => openViewer(entry));
        host.appendChild(button);
    }
}

/** Full-screen view of one past result, with a way back to its settings. */
let viewerEntry = null;

function openViewer(entry) {
    viewerEntry = entry;
    const viewer = el("viewer");
    el("viewerImage").src = viewUrl({ filename: entry.f, subfolder: entry.s, type: entry.t });
    el("viewerOpen").href = el("viewerImage").src;
    const size = entry.w && entry.h ? `${entry.w} × ${entry.h} · ` : "";
    el("viewerMeta").textContent = `${size}${entry.title || ""} · ${relativeTime(Math.round((entry.at || 0) / 1000))}`;
    // Only offer a re-run when the values are still meaningful for this form.
    const sameWorkflow = !entry.workflow || entry.workflow === state.workflow;
    el("viewerReuse").hidden = !sameWorkflow;
    viewer.hidden = false;
}

function closeViewer() {
    el("viewer").hidden = true;
    viewerEntry = null;
}

/** Put a past run's values back into the form and run it again. */
function reuseEntry() {
    if (!viewerEntry) return;
    const values = viewerEntry.values || {};
    let touched = 0;
    for (const [key, value] of Object.entries(values)) {
        if (key in state.values) {
            state.values[key] = value;
            touched += 1;
        }
    }
    if (!touched) {
        toast("这条记录的参数已经不在表单里了");
        return;
    }
    storeValues();
    render(state.parameters);
    closeViewer();
    toast(`已填入 ${touched} 个参数，开始生成`);
    generate();
}

/* ---------------- paint masks ---------------- */
/** Does this picture already have a painted layer? */
async function maskExists(name) {
    try {
        const response = await fetch(
            `${basePath()}/qq_mobile/mask?filename=${encodeURIComponent(name)}`,
        );
        return response.ok;
    } catch {
        return false;
    }
}

/**
 * Paint a mask for one image, on the phone.
 *
 * Same store as the desktop editor (`input/__qq_masks__`), so a layer painted
 * here is what `QQ-多媒体加载` outputs and what a LoadImage copy carries. The
 * canvas is laid out to fit the screen; strokes are converted back to the
 * picture's own pixels on save.
 */
function openMaskEditor(name, onDone) {
    const overlay = document.createElement("div");
    overlay.className = "mask-overlay";
    const panel = document.createElement("div");
    panel.className = "mask-panel";

    const head = document.createElement("div");
    head.className = "mask-head";
    const title = document.createElement("span");
    title.textContent = `遮罩 · ${baseName(name)}`;
    const close = document.createElement("button");
    close.type = "button";
    close.className = "icon-btn";
    close.innerHTML = iconSvg("close", 18);
    close.setAttribute("aria-label", "关闭");
    head.append(title, close);

    const stage = document.createElement("div");
    stage.className = "mask-stage";
    const picture = document.createElement("canvas");
    picture.className = "mask-picture";
    const paint = document.createElement("canvas");
    paint.className = "mask-paint";
    stage.append(picture, paint);

    const tools = document.createElement("div");
    tools.className = "mask-tools";
    const brush = document.createElement("button");
    brush.type = "button";
    brush.textContent = "画笔";
    const erase = document.createElement("button");
    erase.type = "button";
    erase.textContent = "橡皮";
    const undo = document.createElement("button");
    undo.type = "button";
    undo.textContent = "撤销";
    const wipe = document.createElement("button");
    wipe.type = "button";
    wipe.textContent = "清除";
    const size = document.createElement("input");
    size.type = "range";
    size.min = "6";
    size.max = "140";
    size.value = "34";
    size.className = "mask-brush";
    size.setAttribute("aria-label", "笔刷大小");
    tools.append(brush, erase, undo, wipe, size);

    const foot = document.createElement("div");
    foot.className = "mask-foot";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "删除遮罩";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "取消";
    const save = document.createElement("button");
    save.type = "button";
    save.className = "primary";
    save.textContent = "保存";
    foot.append(remove, cancel, save);

    panel.append(head, stage, tools, foot);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    const pictureCtx = picture.getContext("2d");
    const paintCtx = paint.getContext("2d", { willReadFrequently: true });
    const state = {
        image: null,
        mask: null,
        width: 0,
        height: 0,
        drawing: false,
        erasing: false,
        last: null,
        history: [],
    };

    const setMode = (erasing) => {
        state.erasing = erasing;
        brush.classList.toggle("on", !erasing);
        erase.classList.toggle("on", erasing);
    };

    const pushHistory = () => {
        try {
            state.history.push(paintCtx.getImageData(0, 0, paint.width, paint.height));
            if (state.history.length > 15) state.history.shift();
        } catch {
            /* ignore */
        }
    };

    const layout = () => {
        const maxWidth = Math.max(200, window.innerWidth - 28);
        const maxHeight = Math.max(200, window.innerHeight - 300);
        const scale = Math.min(maxWidth / state.width, maxHeight / state.height, 1);
        const width = Math.max(1, Math.round(state.width * scale));
        const height = Math.max(1, Math.round(state.height * scale));
        for (const canvas of [picture, paint]) {
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }
        pictureCtx.drawImage(state.image, 0, 0, width, height);
        paintCtx.clearRect(0, 0, width, height);
        if (state.mask) paintCtx.drawImage(state.mask, 0, 0, width, height);
        state.history.length = 0;
    };

    const pointOf = (event) => {
        const rect = paint.getBoundingClientRect();
        const touch = event.touches?.[0] || event.changedTouches?.[0] || event;
        return {
            x: (touch.clientX - rect.left) * (paint.width / rect.width),
            y: (touch.clientY - rect.top) * (paint.height / rect.height),
        };
    };

    const strokeTo = (point) => {
        paintCtx.globalCompositeOperation = state.erasing ? "destination-out" : "source-over";
        paintCtx.strokeStyle = "rgba(77, 124, 254, .6)";
        paintCtx.fillStyle = "rgba(77, 124, 254, .6)";
        paintCtx.lineWidth = Number(size.value);
        paintCtx.lineCap = "round";
        paintCtx.lineJoin = "round";
        if (state.last) {
            paintCtx.beginPath();
            paintCtx.moveTo(state.last.x, state.last.y);
            paintCtx.lineTo(point.x, point.y);
            paintCtx.stroke();
        }
        paintCtx.beginPath();
        paintCtx.arc(point.x, point.y, Number(size.value) / 2, 0, Math.PI * 2);
        paintCtx.fill();
        state.last = point;
    };

    paint.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        pushHistory();
        state.drawing = true;
        state.last = null;
        strokeTo(pointOf(event));
    });
    paint.addEventListener("pointermove", (event) => {
        if (!state.drawing) return;
        event.preventDefault();
        strokeTo(pointOf(event));
    });
    const end = () => {
        state.drawing = false;
        state.last = null;
    };
    paint.addEventListener("pointerup", end);
    paint.addEventListener("pointerleave", end);
    paint.addEventListener("pointercancel", end);
    paint.style.touchAction = "none";

    brush.addEventListener("click", () => setMode(false));
    erase.addEventListener("click", () => setMode(true));
    undo.addEventListener("click", () => {
        const previous = state.history.pop();
        if (previous) paintCtx.putImageData(previous, 0, 0);
    });
    wipe.addEventListener("click", () => {
        pushHistory();
        paintCtx.clearRect(0, 0, paint.width, paint.height);
    });
    close.addEventListener("click", () => overlay.remove());
    cancel.addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });

    remove.addEventListener("click", async () => {
        try {
            await fetchJson(`/qq_mobile/mask?filename=${encodeURIComponent(name)}`, {
                method: "DELETE",
            });
            overlay.remove();
            onDone?.();
            toast("遮罩已删除");
        } catch (error) {
            toast(`删除失败：${error.message}`);
        }
    });

    save.addEventListener("click", async () => {
        save.disabled = true;
        try {
            // White keeps, black drops: the paint layer's alpha is the keep area.
            const out = document.createElement("canvas");
            out.width = state.width;
            out.height = state.height;
            const outCtx = out.getContext("2d");
            outCtx.fillStyle = "#fff";
            outCtx.fillRect(0, 0, out.width, out.height);
            const layer = paintCtx.getImageData(0, 0, paint.width, paint.height).data;
            const image = outCtx.getImageData(0, 0, out.width, out.height);
            for (let y = 0; y < out.height; y += 1) {
                const sy = Math.min(paint.height - 1, Math.floor((y * paint.height) / out.height));
                for (let x = 0; x < out.width; x += 1) {
                    const sx = Math.min(paint.width - 1, Math.floor((x * paint.width) / out.width));
                    const alpha = layer[(sy * paint.width + sx) * 4 + 3];
                    const value = 255 - alpha;
                    const index = (y * out.width + x) * 4;
                    image.data[index] = value;
                    image.data[index + 1] = value;
                    image.data[index + 2] = value;
                    image.data[index + 3] = 255;
                }
            }
            outCtx.putImageData(image, 0, 0);
            await fetchJson("/qq_mobile/mask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filename: name, png: out.toDataURL("image/png") }),
            });
            overlay.remove();
            onDone?.();
            toast("遮罩已保存");
        } catch (error) {
            toast(`保存失败：${error.message}`);
            save.disabled = false;
        }
    });

    setMode(false);

    (async () => {
        state.image = await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = mediaSrc(name);
        });
        if (!state.image) {
            title.textContent = "图片加载失败";
            return;
        }
        state.width = state.image.naturalWidth || 512;
        state.height = state.image.naturalHeight || 512;
        state.mask = await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = `${basePath()}/qq_mobile/mask?filename=${encodeURIComponent(name)}`;
        });
        layout();
    })();
}

/* ---------------- media picker ---------------- */
/**
 * Picker for a media input: choose from files already in ComfyUI's input
 * directory, or upload a new one from the phone.
 *
 * The value written back is the file name (ComfyUI loaders accept nothing
 * else). For QQ-多媒体加载 the list is sent and the backend encodes it into
 * that node's JSON state.
 */
const MEDIA_LABELS = { image: "图片", video: "视频", audio: "音频" };
const MEDIA_ACCEPT = {
    image: "image/*",
    video: "video/*",
    audio: "audio/*",
};

function mediaField(parameter, value, commit) {
    const kind = parameter.media;
    const multiple = Boolean(parameter.multiple);
    const box = document.createElement("div");
    box.className = "media";

    const current = multiple
        ? (Array.isArray(value) ? value : [])
        : (value ? [value] : []);

    const thumbs = document.createElement("div");
    thumbs.className = "media-thumbs";
    const actions = document.createElement("div");
    actions.className = "media-actions";

    const render = (names) => {
        thumbs.replaceChildren();
        if (!names.length) {
            const empty = document.createElement("div");
            empty.className = "media-empty";
            empty.textContent = `未选择${MEDIA_LABELS[kind] || "媒体"}`;
            thumbs.appendChild(empty);
            return;
        }
        for (const name of names) {
            const item = document.createElement("div");
            item.className = "media-item";
            if (kind === "image") {
                const img = document.createElement("img");
                // The chosen value is a name in the input directory, so its
                // thumb is keyed there too.
                img.src = thumbUrl(name, "input");
                img.loading = "lazy";
                img.alt = name;
                img.addEventListener("error", () => img.classList.add("broken"));
                item.appendChild(img);
            } else if (kind === "video") {
                const video = document.createElement("video");
                video.src = mediaSrc(name);
                video.muted = true;
                video.playsInline = true;
                video.preload = "metadata";
                item.appendChild(video);
            } else {
                const icon = document.createElement("div");
                icon.className = "media-audio";
                icon.textContent = "♪";
                item.appendChild(icon);
            }
            const caption = document.createElement("span");
            caption.textContent = baseName(name);
            item.appendChild(caption);
            // Every picture can carry a painted layer; the mask output of
            // QQ-多媒体加载 follows this order, and LoadImage gets it through
            // an alpha copy. Both live behind the same per-image store.
            if (kind === "image") {
                const paint = document.createElement("button");
                paint.type = "button";
                paint.className = "media-mask";
                paint.textContent = "✎";
                paint.title = "画遮罩";
                paint.setAttribute("aria-label", `给 ${baseName(name)} 画遮罩`);
                paint.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    openMaskEditor(name, () => render(current));
                });
                item.appendChild(paint);
                maskExists(name).then((has) => {
                    item.classList.toggle("has-mask", has);
                });
            }
            if (multiple) {
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "media-remove";
                remove.innerHTML = iconSvg("close", 16);
                remove.setAttribute("aria-label", `移除 ${baseName(name)}`);
                remove.addEventListener("click", () => {
                    const next = current.filter((entry) => entry !== name);
                    current.length = 0;
                    current.push(...next);
                    commit(multiple ? [...current] : (current[0] ?? ""));
                    render(current);
                });
                item.appendChild(remove);
            }
            thumbs.appendChild(item);
        }
    };

    const pickExisting = async () => {
        chooseFromList(
            (source) => fetchJson(`/qq_mobile/media?kind=${encodeURIComponent(kind)}&source=${source}`),
            multiple,
            (chosen) => {
                if (multiple) {
                    current.length = 0;
                    current.push(...chosen);
                    commit([...current]);
                } else {
                    current.length = 0;
                    current.push(chosen[0]);
                    commit(chosen[0]);
                }
                render(current);
            },
            { kind },
        );
    };

    const upload = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = MEDIA_ACCEPT[kind] || "*/*";
        input.multiple = multiple;
        input.style.display = "none";
        input.addEventListener("change", async () => {
            const files = [...(input.files || [])];
            if (!files.length) return;
            for (const file of files) {
                try {
                    const name = await uploadMedia(file);
                    if (!name) continue;
                    if (multiple) {
                        if (!current.includes(name)) current.push(name);
                    } else {
                        current.length = 0;
                        current.push(name);
                    }
                } catch (error) {
                    toast(`上传失败 ${file.name}：${error.message}`);
                }
            }
            commit(multiple ? [...current] : (current[0] ?? ""));
            render(current);
        });
        document.body.appendChild(input);
        input.click();
        setTimeout(() => input.remove(), 60000);
    };

    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "media-btn";
    pick.textContent = multiple ? "选择已有" : "选择文件";
    pick.addEventListener("click", pickExisting);

    const up = document.createElement("button");
    up.type = "button";
    up.className = "media-btn primary";
    up.textContent = "上传";
    up.addEventListener("click", upload);

    actions.append(pick, up);
    render(current);
    box.append(thumbs, actions);
    return box;
}

function baseName(name) {
    const text = String(name || "");
    const index = text.lastIndexOf("/");
    return index === -1 ? text : text.slice(index + 1);
}

/**
 * URL that serves one media file for preview.
 *
 * `/view` takes the folder separately: passing "pasted/image (14).png" as the
 * filename asks for a file of that literal name in the root and 404s, which is
 * why files inside a subfolder showed a broken thumbnail.
 */
function mediaSrc(name, source = "input") {
    const text = String(name ?? "");
    const cut = text.lastIndexOf("/");
    const params = new URLSearchParams({
        filename: cut === -1 ? text : text.slice(cut + 1),
        subfolder: cut === -1 ? "" : text.slice(0, cut),
        type: source === "output" ? "output" : "input",
    });
    return `${basePath()}/view?${params.toString()}`;
}

/**
 * URL of the small preview for one media file.
 *
 * `/qq_mobile/thumb` renders a 320px webp once and then answers with an
 * immutable cache header, keyed by the file's mtime — so a list of hundreds of
 * pictures costs a handful of tiny requests, and reopening it costs nothing.
 */
function thumbUrl(name, source = "input", version = 0) {
    const text = String(name ?? "");
    const cut = text.lastIndexOf("/");
    const params = new URLSearchParams({
        filename: cut === -1 ? text : text.slice(cut + 1),
        subfolder: cut === -1 ? "" : text.slice(0, cut),
        source: source === "output" ? "output" : "input",
    });
    if (version) params.set("v", String(version));
