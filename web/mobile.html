<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No maximum-scale: pinch-zoom has to stay available to inspect a generated
     image in detail. iOS instead zooms on its own when a focused field is
     smaller than 16px, which is why form controls get an explicit 16px. -->
<meta name="theme-color" content="#12131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>手机界面</title>
<style>
:root {
    color-scheme: dark;
    --bg: #12131a;
    --surface: #1b1d26;
    --surface-2: #23252f;
    --line: #303342;
    --text: #eceef6;
    --muted: #9aa0b4;
    --accent: #4d7cfe;
    --accent-press: #3f68d8;
    --danger: #e5484d;
    --ok: #30a46c;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overscroll-behavior-y: none;
}
/* Fixed viewport height so the scroll area below is bounded: with
   min-height the form would stretch the page instead of scrolling inside it. */
html { height: 100%; }
body {
    display: flex; flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

/* ---------- header ---------- */
header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + var(--safe-top)) 12px 8px;
    background: rgba(18, 19, 26, .92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
}
header h1 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
    /* 44px is the minimum comfortable touch target; 36px was easy to miss. */
    flex: none; width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); color: var(--text);
    cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- scroll area ---------- */
main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* Leave room for the fixed footer (status line + button) so the last
       field stays reachable. */
    padding: 14px 14px calc(130px + var(--safe-bottom));
}

/* ---------- per-subgraph sections ---------- */
.section-head {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 12px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
}
.section-head + .field { margin-top: 0; }
.section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    letter-spacing: .01em;
}
.section-head::before {
    content: ""; flex: none;
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--accent);
}

/* ---------- pipeline picker ---------- */
/* Folder headings mirror the editor's workflow sidebar. */
.folder-head {
    margin: 18px 0 8px;
    padding-left: 2px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
    color: var(--muted);
    text-transform: none;
}
.pipeline-list:first-child .folder-head { margin-top: 0; }
.pipeline-list { display: flex; flex-direction: column; gap: 10px; }
/* A workflow that exists but has no template yet: listed, but not runnable. */
.pipeline-row.is-pending { opacity: .55; }
.pipeline-row.is-pending .pipeline-arrow { opacity: .35; }
.pipeline-row.is-preparing { opacity: .9; }
.pipeline-row.is-preparing .pipeline-meta { color: var(--accent); }
.pipeline-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 16px 14px;
    text-align: left;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
}
.pipeline-row:active { background: var(--surface-2); }
.pipeline-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pipeline-name {
    font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pipeline-meta { font-size: 12px; color: var(--muted); }
.pipeline-arrow { flex: none; display: grid; place-items: center; color: var(--muted); }
/* the picker's own search stays reachable while the list scrolls */
.pipeline-search {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding-bottom: 10px;
}
.folder-head.recent { color: var(--accent); }

/* ---------- media picker ---------- */
.media { display: flex; flex-direction: column; gap: 10px; }
.media-thumbs {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    min-height: 96px;
    -webkit-overflow-scrolling: touch;
}
.media-empty {
    flex: 1; display: grid; place-items: center;
    color: var(--muted); font-size: 13px;
}
.media-item {
    position: relative; flex: none;
    width: 96px;
    display: flex; flex-direction: column; gap: 4px;
}
.media-item img,
.media-item .media-audio {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
    display: block;
}
.media-item video {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
}
.media-item .media-audio {
    display: grid; place-items: center;
    font-size: 32px; color: var(--muted);
}
.media-item span {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-remove {
    position: absolute; top: -6px; right: -6px;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: var(--danger); color: #fff;
    font-size: 15px; line-height: 1;
    cursor: pointer;
}
.media-actions { display: flex; gap: 10px; }
.media-btn {
    flex: 1; min-height: 44px;
    font: 600 14px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px;
    cursor: pointer;
}
.media-btn:active { background: var(--surface-2); }
.media-btn.primary { color: #fff; background: var(--accent); border-color: transparent; }
.media-btn:disabled { opacity: .5; }

/* modal list */
.picker {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: flex-end;
    background: rgba(0, 0, 0, .55);
}
.picker-sheet {
    width: 100%; max-height: 80dvh;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding-bottom: var(--safe-bottom);
    animation: sheetIn .2s ease-out;
}
@keyframes sheetIn {
    from { transform: translateY(24px); opacity: .6; }
    to { transform: translateY(0); opacity: 1; }
}
.picker-head {
    display: flex; align-items: center;
    padding: 14px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
}
.picker-close {
    margin-left: auto;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--muted);
    line-height: 1; cursor: pointer;
}
.picker-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.picker-row {
    display: block; width: 100%;
    padding: 13px 16px;
    text-align: left;
    font: inherit; font-size: 14px;
    color: var(--text); background: transparent;
    border: 0; border-bottom: 1px solid rgba(255,255,255,.04);
    cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.on { background: rgba(77, 124, 254, .16); color: #b9cbff; }
.picker-foot { padding: 12px 16px; border-top: 1px solid var(--line); }

/* combo choices: the native <select> popup is a light, browser-drawn box that
   ignores the page, wraps long model paths and cannot be filtered. */
.picker-row.combo {
    display: flex; align-items: center; gap: 10px;
    white-space: normal;
    padding: 12px 16px;
}
.picker-row.combo .row-main { min-width: 0; flex: 1; }
.picker-row.combo .row-name {
    display: block; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.combo .row-dir {
    display: block; margin-top: 2px; font-size: 11px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.combo .tick { flex: none; display: grid; place-items: center; color: var(--accent); }
.picker-row.combo.previewing {
    background: rgba(255, 255, 255, .05);
    box-shadow: inset 0 0 0 1px var(--accent);
}

/* the preview strip: one tap looks, a second tap picks */
.picker-preview {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
}
.picker-preview[hidden] { display: none; }
.picker-preview .thumb {
    flex: none;
    width: 92px; height: 92px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
    display: grid; place-items: center;
}
.picker-preview .thumb img,
.picker-preview .thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
}
.picker-preview .thumb .none {
    font-size: 11px; line-height: 1.3; color: var(--muted);
    text-align: center; padding: 0 6px;
}
.picker-preview .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.picker-preview .pname {
    font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-preview .pdir {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-preview .pdir[hidden] { display: none; }
.picker-preview .phint { font-size: 11px; color: var(--accent); margin-top: 2px; }
.picker-search { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.picker-search input {
    width: 100%; box-sizing: border-box;
    padding: 10px 12px;
    font: inherit; font-size: 15px;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px;
}
.picker-search input:focus { outline: 0; border-color: var(--accent); }
.picker-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* the field that opens it */
.select-field {
    display: flex; align-items: center; gap: 8px;
    width: 100%; box-sizing: border-box;
    padding: 13px 14px;
    font: inherit; font-size: 15px; text-align: left;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
}
.select-field:active { background: var(--surface-2); }
.select-field .value {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 1px;
}
.select-field .vname {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.select-field .vdir {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.select-field .chev { flex: none; display: grid; place-items: center; color: var(--muted); }

/* ---------- fullscreen text editor ---------- */
.editor {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: var(--bg);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    /* Slide in from the bottom so it reads as an in-place expansion. */
    animation: editorIn .18s ease-out;
}
.editor[hidden] { display: none; }
@keyframes editorIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
.editor-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
}
.editor-head h2 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editor-head button {
    flex: none; min-height: 38px; padding: 0 15px;
    font: 600 15px/1 inherit;
    border-radius: 10px; cursor: pointer;
}
.editor-head .done {
    color: #fff; background: var(--accent); border: 0;
}
.editor-head .clear {
    color: var(--muted); background: transparent;
    border: 1px solid var(--line);
}
.editor-body {
    flex: 1; min-height: 0;
    display: flex;
    padding: 12px;
}
.editor-body textarea {
    flex: 1; width: 100%;
    resize: none;
    padding: 14px;
    font: inherit; line-height: 1.6;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    outline: none;
}
.editor-body textarea:focus { border-color: var(--accent); }
.editor-foot {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 12px;
    font-size: 12px; color: var(--muted);
}
.editor-foot .grow { flex: 1; }
/* Long-press affordance on text fields. */
.longpressable { position: relative; -webkit-touch-callout: none; }
.longpressable.pressing { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- fields ---------- */
.field { margin-bottom: 16px; }
.field > label {
    display: block; margin-bottom: 7px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .01em;
}
.field textarea,
.field input[type="text"],
.field input[type="number"],
.field select {
    width: 100%;
    padding: 12px 13px;
    /* 16px, not the inherited 15px: iOS Safari zooms the whole page when a
       focused control is smaller than that, which feels like a broken layout.
       Written as longhands because `font: 16px/1.5 inherit` is invalid CSS and
       would be dropped, leaving the browser default. */
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    outline: none;
    appearance: none;
}
.field textarea { min-height: 120px; resize: none; line-height: 1.55; }
/* Text fields get a tap target for the fullscreen editor, since a long press
   is not something anyone discovers on their own. */
.text-wrap { position: relative; display: flex; }
.text-wrap > textarea,
.text-wrap > input { flex: 1; padding-right: 44px; }
.expand-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
}
.expand-btn:active { color: var(--text); background: var(--line); }
.field textarea:focus,
.field input:focus,
.field select:focus { border-color: var(--accent); }

.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper button {
    flex: none; width: 46px;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 500;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
.stepper button:active { background: var(--surface-2); }
.stepper input { text-align: center; min-width: 0; }
.stepper .dice-btn { color: var(--muted); }
.stepper .dice-btn:active { color: var(--text); }

.group summary .group-where {
    margin-left: 8px;
    font-size: 11px; font-weight: 400;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* While a job runs the button breathes very slightly, so the screen never
   looks stuck between two polls. */
#generate.busy { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(77, 124, 254, 0); }
    50% { box-shadow: 0 0 0 4px rgba(77, 124, 254, .18); }
}

/* Reset the whole form back to the values baked into the workflow. */
.reset-btn {
    display: block;
    margin: 22px auto 0;
    padding: 10px 18px;
    font: 600 13px/1 inherit;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer;
}
.reset-btn:active { color: var(--text); background: var(--surface-2); }

/* ---------- batch count ---------- */
.batch-btn {
    flex: none; min-width: 52px; padding: 0 10px;
    font: 600 13px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
}
.batch-btn:active { background: var(--surface-2); }
.batch-btn.on { color: #fff; background: var(--accent); border-color: transparent; }

/* ---------- recent results ---------- */.history {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 0 0 4px;
    -webkit-overflow-scrolling: touch;
}
.history[hidden] { display: none; }
.history-item {
    flex: none; width: 76px;
    padding: 0; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--surface);
    cursor: pointer;
}
.history-item img { display: block; width: 100%; height: 76px; object-fit: cover; }
.history-item .stamp {
    display: block; padding: 3px 0 4px;
    font-size: 10px; color: var(--muted); text-align: center;
}

/* ---------- fullscreen image viewer ---------- */
.viewer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: #0b0c11;
}
.viewer[hidden] { display: none; }
.viewer-bar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    font-size: 12px; color: var(--muted);
}
.viewer-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-close {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--text); cursor: pointer;
}
.viewer-stage {
    flex: 1; min-height: 0;
    display: grid; place-items: center;
    padding: 4px;
}
.viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer-actions {
    display: flex; gap: 10px;
    padding: 12px 14px calc(14px + var(--safe-bottom));
}
.viewer-actions button,
.viewer-actions a {
    flex: 1;
    display: grid; place-items: center;
    min-height: 46px;
    font: 600 14px/1 inherit;
    border-radius: 12px; text-decoration: none;
    border: 1px solid var(--line);
    color: var(--text); background: var(--surface);
    cursor: pointer;
}
.viewer-actions button {
    color: #fff; background: var(--accent); border-color: transparent;
}
.viewer-actions button:active { background: var(--accent-press); }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { width: 50px; height: 30px; accent-color: var(--accent); }

select { background-image: none; }

/* ---------- collapsible group ---------- */
/* A collapsible section, deliberately quieter than a form field: it groups
 * secondary settings, so it reads as a divider rather than an input box. */
details.group {
    margin: 20px 0 16px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    background: transparent;
}
details.group > summary {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 2px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .02em;
    cursor: pointer; list-style: none;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after {
    content: "▾"; margin-left: auto; color: var(--muted);
    font-size: 12px;
    transition: transform .18s ease;
}
details.group[open] > summary::after { transform: rotate(180deg); }
details.group > summary .count {
    padding: 1px 6px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 500;
}
details.group > .body { padding: 4px 0 6px; }
details.group .field:last-child { margin-bottom: 0; }

/* ---------- results ---------- */
main > .section-label {
    margin: 22px 0 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
}
main > .section-label[hidden] { display: none; }
.results { display: flex; flex-direction: column; gap: 12px; }
.result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
}
.result-card img,
.result-card video {
    display: block; width: 100%; height: auto; background: #0b0c11;
}
.result-card pre {
    margin: 0; padding: 12px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 13px; color: var(--muted);
}
.result-meta {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line);
}
.result-meta a { color: var(--accent); text-decoration: none; margin-left: auto; }

/* ---------- status ---------- */
.status { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; min-height: 20px; }
.status[hidden] { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.done { background: var(--ok); }
.dot.error { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.status-text { font-size: 13px; color: var(--muted); }

.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-bottom: 14px; }
.progress[hidden] { display: none; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
/* No step reported yet: a sweep instead of an empty bar, so a starting job
   never looks like a frozen screen. */
.progress.indeterminate > div {
    width: 34%;
    animation: sweep 1.15s ease-in-out infinite;
}
@keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(295%); }
}

/* ---------- footer ---------- */
footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    /* Column so the status line can live here instead of above the form: a
       row that appears and disappears there would shift the whole page. */
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px 14px calc(12px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(18,19,26,.75), var(--bg) 45%);
    backdrop-filter: blur(12px);
}
footer[hidden] { display: none; }
.footer-row { display: flex; gap: 10px; }
footer .progress { margin: 0; }
footer .status { margin: 0; min-height: 18px; }
footer button.primary {
    flex: 1; min-height: 50px;
    font: 600 16px/1 inherit;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
footer button.primary:active { background: var(--accent-press); }
footer button.primary:disabled { opacity: .55; }
footer button.ghost {
    flex: none; min-width: 92px; padding: 0 16px;
    font: 600 15px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
footer button.ghost:active { background: var(--surface-2); }

/* Chip that jumps back to a finished result. It lives inside the footer so it
   can never cover a form control. */
.result-chip {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 38px;
    font: 600 13px/1 inherit;
    color: var(--accent);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    animation: chipIn .18s ease-out;
}
.result-chip[hidden] { display: none; }
@keyframes chipIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.spinner {
    width: 16px; height: 16px; flex: none;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
    padding: 40px 20px; text-align: center;
    color: var(--muted); font-size: 14px; line-height: 1.7;
}
.empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 15px; }
.toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(84px + var(--safe-bottom));
    z-index: 40; padding: 11px 14px;
    background: #2b2330; border: 1px solid #4a3550;
    border-radius: 12px; font-size: 13px; color: #f3d9ff;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<header>
    <button class="icon-btn" id="back" aria-label="返回 ComfyUI" title="返回 ComfyUI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>
    <h1 id="title">手机界面</h1>
    <button class="icon-btn" id="switch" aria-label="切换流水线" title="切换流水线" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h13"></path>
            <path d="M14 4l3 3-3 3"></path>
            <path d="M20 17H7"></path>
            <path d="M10 14l-3 3 3 3"></path>
        </svg>
    </button>
    <button class="icon-btn" id="reload" aria-label="刷新参数" title="刷新参数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
            <path d="M21 3v6h-6"></path>
        </svg>
    </button>
</header>

<main id="main">
    <form id="form" autocomplete="off"></form>
    <div class="section-label" id="resultsLabel" hidden>结果</div>
    <div class="results" id="results"></div>
    <div class="section-label" id="historyLabel" hidden>最近生成</div>
    <div class="history" id="history"></div>
</main>

<div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
        <span id="viewerMeta"></span>
        <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 6l12 12"></path><path d="M18 6L6 18"></path>
            </svg>
        </button>
    </div>
    <div class="viewer-stage"><img id="viewerImage" alt=""></div>
    <div class="viewer-actions">
        <button id="viewerReuse" type="button">用这组参数再跑</button>
        <a id="viewerOpen" target="_blank" rel="noopener">原图</a>
    </div>
</div>

<footer id="footer">
    <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
    <div class="status" id="status" hidden>
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText"></span>
    </div>
    <button class="result-chip" id="resultChip" type="button" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path>
        </svg>
        <span>查看结果</span>
    </button>
    <div class="footer-row">
        <button class="batch-btn" id="batch" type="button" title="连续生成张数" aria-label="连续生成张数">×1</button>
        <button class="primary" id="generate" type="button"><span>生成</span></button>
        <button class="ghost" id="cancel" type="button" hidden>取消</button>
    </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Fullscreen editor opened by long-pressing a text field. -->
<section class="editor" id="editor" hidden aria-hidden="true">
    <div class="editor-head">
        <h2 id="editorTitle">编辑</h2>
        <button type="button" class="clear" id="editorRevert">还原</button>
        <button type="button" class="done" id="editorDone">完成</button>
    </div>
    <div class="editor-body">
        <textarea id="editorText" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="editor-foot">
        <span class="grow" id="editorCount">0 字</span>
        <span>完成即生效</span>
    </div>
</section>

<script>
"use strict";

const TOAST_MS = 3200;
const POLL_MS = 1200;
const STORAGE_KEY = "qq-mobile-values";

const el = (id) => document.getElementById(id);
const state = {
    workflow: new URLSearchParams(location.search).get("workflow") || "",
    parameters: [],
    values: {},
    promptId: "",
    // Every id of the current run: a batch queues several at once.
    promptIds: [],
    media: [],
    batch: 1,
    polling: false,
    timer: null,
};

function toast(message) {
    const node = el("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove("show"), TOAST_MS);
}

function setStatus(kind, text) {
    const wrap = el("status");
    if (!kind) { wrap.hidden = true; return; }
    wrap.hidden = false;
    el("statusDot").className = `dot ${kind}`;
    el("statusText").textContent = text;
}

/** The footer holds the action button, so it only belongs on a pipeline. */
function setFooterVisible(visible) {
    el("footer").hidden = !visible;
    el("reload").hidden = !visible;
    if (!visible) {
        el("resultChip").hidden = true;
    }
}

/**
 * Progress bar.
 *
 * ``ratio`` undefined hides it. ``null`` shows the indeterminate sweep used
 * while the server has not reported a step yet: the old bar simply vanished,
 * so a queued or starting job looked like a frozen screen.
 */
function setProgress(ratio) {
    const bar = el("progress");
    const fill = el("progressBar");
    if (ratio === undefined) {
        bar.hidden = true;
        bar.classList.remove("indeterminate");
        return;
    }
    bar.hidden = false;
    if (ratio === null) {
        bar.classList.add("indeterminate");
        fill.style.width = "";
        return;
    }
    bar.classList.remove("indeterminate");
    fill.style.width = `${Math.max(0, Math.min(1, ratio)) * 100}%`;
}

/* ---------------- value persistence ---------------- */
function loadStoredValues() {
    try {
        const raw = localStorage.getItem(`${STORAGE_KEY}:${state.workflow}`);
        return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
}
function storeValues() {
    try {
        localStorage.setItem(
            `${STORAGE_KEY}:${state.workflow}`, JSON.stringify(state.values));
    } catch { /* storage full or blocked: not fatal */ }
}

/* ---------------- form rendering ---------------- */
function coerce(parameter, raw) {
    const type = String(parameter.type || "").toUpperCase();
    if (type === "INT") {
        const n = Number.parseInt(raw, 10);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "FLOAT") {
        const n = Number.parseFloat(raw);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "BOOLEAN") return Boolean(raw);
    return raw;
}

function isCombo(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    return Array.isArray(parameter.options) && parameter.options.length > 0
        || type === "COMBO";
}

/**
 * Readable name for a field.
 *
 * Workflows label most inputs in Chinese, but a promoted ComfyUI input often
 * arrives as its raw socket name — "seed", "sampler_name", "clip" sitting next
 * to "随机种" and "采样器" from the same form. Only the well-known internals are
 * translated; a name the user chose themselves is left exactly as written.
 */
const LABEL_ALIASES = {
    seed: "随机种",
    noise_seed: "随机种",
    sampler_name: "采样器",
    sampler: "采样器",
    scheduler: "调度器",
    steps: "步数",
    cfg: "CFG",
    denoise: "重绘幅度",
    batch_size: "批量张数",
    filename_prefix: "保存前缀",
    width: "宽度",
    height: "高度",
    vae: "VAE",
    clip: "CLIP",
    model: "模型",
    image: "图像",
    text: "文本",
    prompt: "提示词",
    negative_prompt: "反向提示词",
    unet_name: "主模型",
    ckpt_name: "检查点",
    lora_name: "LoRA",
};

function prettyLabel(text) {
    const raw = String(text ?? "").trim();
    if (!raw) return raw;
    return LABEL_ALIASES[raw.toLowerCase()] || raw;
}

/** A hint inside an empty field, so a blank row still says what goes in it. */
function placeholderFor(parameter) {
    const text = String(parameter.label || parameter.name || "");
    if (/提示词|prompt|文本|text/i.test(text)) return "输入提示词…";
    if (/前缀|prefix/i.test(text)) return "文件名前缀";
    if (/图像|图片|image/i.test(text)) return "图片文件名…";
    return "";
}

function fieldFor(parameter) {
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = prettyLabel(parameter.label || parameter.name);
    label.setAttribute("for", `f-${parameter.key}`);
    wrap.appendChild(label);

    const type = String(parameter.type || "STRING").toUpperCase();
    const value = state.values[parameter.key] ?? parameter.value;
    const commit = (next) => {
        state.values[parameter.key] = next;
        storeValues();
    };

    // Media inputs (LoadImage, QQ-多媒体加载, ...) get a picker with upload.
    if (parameter.media) {
        wrap.appendChild(mediaField(parameter, value, commit));
        return wrap;
    }

    if (type === "BOOLEAN") {
        wrap.classList.add("switch");
        wrap.removeChild(label);
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.id = `f-${parameter.key}`;
        toggle.checked = Boolean(value);
        toggle.addEventListener("change", () => commit(toggle.checked));
        wrap.append(label, toggle);
        label.style.marginBottom = "0";
        return wrap;
    }

    if (isCombo(parameter) && (parameter.options || []).length) {
        const options = [...parameter.options];
        // A value that is no longer offered (a LoRA that was deleted) stays
        // selectable, so opening the field cannot silently change the value.
        if (value != null && !options.includes(value)) options.unshift(value);

        const field = document.createElement("button");
        field.type = "button";
        field.className = "select-field";
        field.id = `f-${parameter.key}`;

        const valueBox = document.createElement("span");
        valueBox.className = "value";
        const nameEl = document.createElement("span");
        nameEl.className = "vname";
        const dirEl = document.createElement("span");
        dirEl.className = "vdir";
        valueBox.append(nameEl, dirEl);

        const chev = document.createElement("span");
        chev.className = "chev";
        chev.innerHTML = iconSvg("down", 15);

        const paint = (next) => {
            const { dir, name } = splitOptionPath(next);
            nameEl.textContent = name || "（空）";
            dirEl.textContent = dir;
            dirEl.hidden = !dir;
            field.title = String(next ?? "");
        };
        paint(value ?? options[0] ?? "");

        field.append(valueBox, chev);
        field.addEventListener("click", () => {
            chooseOption(parameter.label || parameter.name, options, state.values[parameter.key], (next) => {
                commit(next);
                paint(next);
            });
        });
        wrap.appendChild(field);
        return wrap;
    }

    if (type === "INT" || type === "FLOAT") {
        const stepper = document.createElement("div");
        stepper.className = "stepper";
        const step = parameter.step ?? (type === "INT" ? 1 : 0.01);
        const input = document.createElement("input");
        input.type = "number";
        input.inputMode = type === "INT" ? "numeric" : "decimal";
        input.id = `f-${parameter.key}`;
        input.value = value ?? 0;
        if (parameter.min != null) input.min = parameter.min;
        if (parameter.max != null) input.max = parameter.max;
        input.step = step;

        const clamp = (n) => {
            let next = n;
            if (parameter.min != null) next = Math.max(parameter.min, next);
            if (parameter.max != null) next = Math.min(parameter.max, next);
            return type === "INT" ? Math.round(next) : next;
        };
        const bump = (delta) => {
            const current = Number.parseFloat(input.value);
            const base = Number.isFinite(current) ? current : 0;
            const next = clamp(base + delta * step);
            input.value = next;
            commit(next);
        };

        const minus = document.createElement("button");
        minus.type = "button";
        minus.innerHTML = iconSvg("minus");
        minus.title = "减";
        minus.setAttribute("aria-label", "减");
        minus.addEventListener("click", () => bump(-1));
        const plus = document.createElement("button");
        plus.type = "button";
        plus.innerHTML = iconSvg("plus");
        plus.title = "加";
        plus.setAttribute("aria-label", "加");
        plus.addEventListener("click", () => bump(1));

        input.addEventListener("input", () => {
            const parsed = Number.parseFloat(input.value);
            if (Number.isFinite(parsed)) commit(coerce(parameter, parsed));
        });

        if (isSeedParameter(parameter)) {
            // A seed is a 15 digit number: stepping it by one is meaningless,
            // and the extra buttons squeeze the value out of the field on a
            // narrow phone. One dice button replaces both.
            const dice = document.createElement("button");
            dice.type = "button";
            dice.className = "dice-btn";
            dice.innerHTML = iconSvg("dice");
            dice.title = "随机种子";
            dice.setAttribute("aria-label", "随机种子");
            dice.addEventListener("click", () => {
                const next = randomSeed(parameter);
                input.value = next;
                commit(next);
            });
            stepper.append(input, dice);
        } else {
            stepper.append(minus, input, plus);
        }

        wrap.appendChild(stepper);
        return wrap;
    }

    const multiline = parameter.multiline || String(value ?? "").length > 60;
    const input = document.createElement(multiline ? "textarea" : "input");
    if (multiline) {
        input.rows = 5;
    } else {
        input.type = "text";
    }
    input.id = `f-${parameter.key}`;
    input.value = value ?? "";
    const hint = placeholderFor(parameter);
    if (hint) input.placeholder = hint;
    input.addEventListener("input", () => commit(input.value));
    // Hold for 2s to edit this text full screen; the corner button is the
    // discoverable way to do the same thing.
    attachLongPress(input, parameter);
    wrap.appendChild(textWrapWithExpand(input, parameter));
    return wrap;
}

/** Does this parameter hold a generation seed? */
function isSeedParameter(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    if (type !== "INT") return false;
    const name = String(parameter.name || "");
    const label = String(parameter.label || "");
    return /^(seed|noise_seed)$/i.test(name) || /种子/.test(label);
}

/** A fresh seed, honouring the field's declared range when it has one. */
function randomSeed(parameter) {
    // ComfyUI declares seeds up to 2^64-1, but a JS number only stays exact up
    // to 2^53 and its default range is 2^50. Staying in that band keeps the
    // value exact through JSON.
    const CEILING = 1125899906842624;
    const lo = Number.isFinite(parameter.min) ? Math.ceil(parameter.min) : 0;
    let hi = Number.isFinite(parameter.max) ? Math.floor(parameter.max) : CEILING;
    hi = Math.min(hi, Math.max(lo + 1, CEILING));
    return lo + Math.floor(Math.random() * (hi - lo));
}

/** Wrap a text control so it carries a fullscreen-editor affordance. */
function textWrapWithExpand(input, parameter) {
    const wrap = document.createElement("div");
    wrap.className = "text-wrap";
    const expand = document.createElement("button");
    expand.type = "button";
    expand.className = "expand-btn";
    expand.innerHTML = iconSvg("expand", 17);
    expand.title = "全屏编辑";
    expand.setAttribute("aria-label", "全屏编辑");
    expand.addEventListener("click", () => openEditor(parameter, input));
    wrap.append(input, expand);
    return wrap;
}

/* ---------------- recent results ---------------- */
/**
 * The last few results, kept on the phone.
 *
 * The page is re-opened constantly, and before this the previous image was
 * gone the moment it was closed. Each entry also keeps the parameter values
 * that produced it, so "use these settings again" can bring back the same
 * seed instead of asking the user to remember it.
 */
const HISTORY_KEY = "qq-mobile-history";
const HISTORY_LIMIT = 24;

function loadHistory() {
    try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

function saveHistory(entries) {
    try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(entries.slice(0, HISTORY_LIMIT)));
    } catch {
        /* storage full or blocked: history is a convenience */
    }
}

/** Record the media of a finished run, newest first. */
function pushHistory(media) {
    const seen = new Set();
    const fresh = [];
    for (const item of media) {
        if (!item?.filename) continue;
        if (item.kind === "text" || item.kind === "audio") continue;
        const key = `${item.subfolder || ""}/${item.filename}`;
        if (seen.has(key)) continue;
        seen.add(key);
        fresh.push({
            f: item.filename,
            s: item.subfolder || "",
            t: item.type || "output",
            w: item.metadata?.width || null,
            h: item.metadata?.height || null,
            at: Date.now(),
            title: el("title").textContent,
            values: { ...state.values },
            workflow: state.workflow,
        });
    }
    if (!fresh.length) return;
    // Keep one entry per file: regenerating the same seed must not duplicate.
    const previous = loadHistory().filter((entry) => !seen.has(`${entry.s || ""}/${entry.f}`));
    const entries = [...fresh, ...previous].slice(0, HISTORY_LIMIT);
    saveHistory(entries);
    renderHistory();
}

function renderHistory() {
    const host = el("history");
    const label = el("historyLabel");
    if (!host) return;
    const entries = loadHistory();
    host.replaceChildren();
    host.hidden = !entries.length;
    label.hidden = !entries.length;
    for (const entry of entries) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = entry.f;
        img.src = viewUrl({
            filename: entry.f,
            subfolder: entry.s,
            type: entry.t,
        });
        const stamp = document.createElement("span");
        stamp.className = "stamp";
        stamp.textContent = relativeTime(Math.round((entry.at || 0) / 1000));
        button.append(img, stamp);
        button.addEventListener("click", () => openViewer(entry));
        host.appendChild(button);
    }
}

/** Full-screen view of one past result, with a way back to its settings. */
let viewerEntry = null;

function openViewer(entry) {
    viewerEntry = entry;
    const viewer = el("viewer");
    el("viewerImage").src = viewUrl({ filename: entry.f, subfolder: entry.s, type: entry.t });
    el("viewerOpen").href = el("viewerImage").src;
    const size = entry.w && entry.h ? `${entry.w} × ${entry.h} · ` : "";
    el("viewerMeta").textContent = `${size}${entry.title || ""} · ${relativeTime(Math.round((entry.at || 0) / 1000))}`;
    // Only offer a re-run when the values are still meaningful for this form.
    const sameWorkflow = !entry.workflow || entry.workflow === state.workflow;
    el("viewerReuse").hidden = !sameWorkflow;
    viewer.hidden = false;
}

function closeViewer() {
    el("viewer").hidden = true;
    viewerEntry = null;
}

/** Put a past run's values back into the form and run it again. */
function reuseEntry() {
    if (!viewerEntry) return;
    const values = viewerEntry.values || {};
    let touched = 0;
    for (const [key, value] of Object.entries(values)) {
        if (key in state.values) {
            state.values[key] = value;
            touched += 1;
        }
    }
    if (!touched) {
        toast("这条记录的参数已经不在表单里了");
        return;
    }
    storeValues();
    render(state.parameters);
    closeViewer();
    toast(`已填入 ${touched} 个参数，开始生成`);
    generate();
}

/* ---------------- media picker ---------------- */
/**
 * Picker for a media input: choose from files already in ComfyUI's input
 * directory, or upload a new one from the phone.
 *
 * The value written back is the file name (ComfyUI loaders accept nothing
 * else). For QQ-多媒体加载 the list is sent and the backend encodes it into
 * that node's JSON state.
 */
const MEDIA_LABELS = { image: "图片", video: "视频", audio: "音频" };
const MEDIA_ACCEPT = {
    image: "image/*",
    video: "video/*",
    audio: "audio/*",
};

function mediaField(parameter, value, commit) {
    const kind = parameter.media;
    const multiple = Boolean(parameter.multiple);
    const box = document.createElement("div");
    box.className = "media";

    const current = multiple
        ? (Array.isArray(value) ? value : [])
        : (value ? [value] : []);

    const thumbs = document.createElement("div");
    thumbs.className = "media-thumbs";
    const actions = document.createElement("div");
    actions.className = "media-actions";

    const render = (names) => {
        thumbs.replaceChildren();
        if (!names.length) {
            const empty = document.createElement("div");
            empty.className = "media-empty";
            empty.textContent = `未选择${MEDIA_LABELS[kind] || "媒体"}`;
            thumbs.appendChild(empty);
            return;
        }
        for (const name of names) {
            const item = document.createElement("div");
            item.className = "media-item";
            if (kind === "image") {
                const img = document.createElement("img");
                img.src = mediaSrc(name);
                img.loading = "lazy";
                img.alt = name;
                item.appendChild(img);
            } else if (kind === "video") {
                const video = document.createElement("video");
                video.src = mediaSrc(name);
                video.muted = true;
                video.playsInline = true;
                video.preload = "metadata";
                item.appendChild(video);
            } else {
                const icon = document.createElement("div");
                icon.className = "media-audio";
                icon.textContent = "♪";
                item.appendChild(icon);
            }
            const caption = document.createElement("span");
            caption.textContent = baseName(name);
            item.appendChild(caption);
            if (multiple) {
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "media-remove";
                remove.innerHTML = iconSvg("close", 16);
                remove.setAttribute("aria-label", `移除 ${baseName(name)}`);
                remove.addEventListener("click", () => {
                    const next = current.filter((entry) => entry !== name);
                    current.length = 0;
                    current.push(...next);
                    commit(multiple ? [...current] : (current[0] ?? ""));
                    render(current);
                });
                item.appendChild(remove);
            }
            thumbs.appendChild(item);
        }
    };

    const pickExisting = async () => {
        toast("读取可用媒体…");
        try {
            const data = await fetchJson(`/qq_mobile/media?kind=${encodeURIComponent(kind)}`);
            const files = (data.files || []).map((entry) => entry.name);
            if (!files.length) {
                toast("input 目录里没有可用的" + (MEDIA_LABELS[kind] || "媒体"));
                return;
            }
            chooseFromList(files, multiple, (chosen) => {
                if (multiple) {
                    current.length = 0;
                    current.push(...chosen);
                    commit([...current]);
                } else {
                    current.length = 0;
                    current.push(chosen[0]);
                    commit(chosen[0]);
                }
                render(current);
            });
        } catch (error) {
            toast(`读取失败：${error.message}`);
        }
    };

    const upload = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = MEDIA_ACCEPT[kind] || "*/*";
        input.multiple = multiple;
        input.style.display = "none";
        input.addEventListener("change", async () => {
            const files = [...(input.files || [])];
            if (!files.length) return;
            for (const file of files) {
                try {
                    const name = await uploadMedia(file);
                    if (!name) continue;
                    if (multiple) {
                        if (!current.includes(name)) current.push(name);
                    } else {
                        current.length = 0;
                        current.push(name);
                    }
                } catch (error) {
                    toast(`上传失败 ${file.name}：${error.message}`);
                }
            }
            commit(multiple ? [...current] : (current[0] ?? ""));
            render(current);
        });
        document.body.appendChild(input);
        input.click();
        setTimeout(() => input.remove(), 60000);
    };

    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "media-btn";
    pick.textContent = multiple ? "选择已有" : "选择文件";
    pick.addEventListener("click", pickExisting);

    const up = document.createElement("button");
    up.type = "button";
    up.className = "media-btn primary";
    up.textContent = "上传";
    up.addEventListener("click", upload);

    actions.append(pick, up);
    render(current);
    box.append(thumbs, actions);
    return box;
}

function baseName(name) {
    const text = String(name || "");
    const index = text.lastIndexOf("/");
    return index === -1 ? text : text.slice(index + 1);
}

/** URL that serves one input-directory file for preview. */
function mediaSrc(name) {
    const params = new URLSearchParams({
        filename: name,
        subfolder: "",
        type: "input",
    });
    return `${basePath()}/view?${params.toString()}`;
}

/** Upload one file; resolves to the name ComfyUI stored it under. */
async function uploadMedia(file) {
    const form = new FormData();
    form.append("image", file, file.name);
    form.append("overwrite", "true");
    const data = await fetchJson("/qq_mobile/upload", { method: "POST", body: form });
    if (!data?.name) throw new Error("服务器没有返回文件名");
    return data.subfolder ? `${data.subfolder}/${data.name}` : data.name;
}

/** Simple modal list for choosing from files already on the server. */
function chooseFromList(files, multiple, onPick) {
    const overlay = document.createElement("div");
    overlay.className = "picker";
    const sheet = document.createElement("div");
    sheet.className = "picker-sheet";

    const head = document.createElement("div");
    head.className = "picker-head";
    head.textContent = multiple ? "选择媒体（可多选）" : "选择媒体";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "picker-close";
    close.innerHTML = iconSvg("close", 18);
    close.addEventListener("click", () => overlay.remove());
    head.appendChild(close);

    const list = document.createElement("div");
    list.className = "picker-list";
    const selected = new Set();
    for (const name of files) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "picker-row";
        row.textContent = name;
        row.addEventListener("click", () => {
            if (!multiple) {
                onPick([name]);
                overlay.remove();
                return;
            }
            if (selected.has(name)) {
                selected.delete(name);
                row.classList.remove("on");
            } else {
                selected.add(name);
                row.classList.add("on");
            }
            confirm.disabled = selected.size === 0;
        });
        list.appendChild(row);
    }

    const foot = document.createElement("div");
    foot.className = "picker-foot";
    const confirm = document.createElement("button");
    confirm.type = "button";
    confirm.className = "media-btn primary";
    confirm.textContent = "确定";
    confirm.disabled = true;
    confirm.addEventListener("click", () => {
        onPick([...selected]);
        overlay.remove();
    });
    foot.appendChild(confirm);

    sheet.append(head, list, foot);
    overlay.appendChild(sheet);
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
}

/** Split "Qwen2.1\图生图\a.safetensors" into its folder and file name. */
function splitOptionPath(option) {
    const text = String(option ?? "");
    const cut = Math.max(text.lastIndexOf("\\"), text.lastIndexOf("/"));
    if (cut < 0) return { dir: "", name: text };
    return { dir: text.slice(0, cut), name: text.slice(cut + 1) };
}

/**
 * Choose one value of a dropdown in a sheet that belongs to this page.
 *
 * The browser's own <select> popup is drawn by the browser: light background in
 * a dark UI, long model paths wrapped over several lines, no way to filter, and
 * it covers the whole screen on Android. Model lists run to hundreds of files,
 * so this offers a search box as well.
 *
 * Model files (LoRAs) are picked in two taps: the first shows what the file
 * actually looks like — its preview image — and the second confirms. Thirty
 * LoRAs with near-identical names cannot be told apart otherwise. Plain
 * choices (an aspect ratio, a sampler) are still a single tap.
 */
function chooseOption(title, options, current, onPick) {
    const overlay = document.createElement("div");
    overlay.className = "picker";
    const sheet = document.createElement("div");
    sheet.className = "picker-sheet";

    const head = document.createElement("div");
    head.className = "picker-head";
    const heading = document.createElement("span");
    heading.textContent = title || "选择";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "picker-close";
    close.innerHTML = iconSvg("close", 18);
    close.addEventListener("click", () => overlay.remove());
    head.append(heading, close);

    // Rows that carry a file name can be previewed before they are chosen.
    const previewable = (option) => MODEL_FILE_RE.test(String(option ?? ""));

    const preview = document.createElement("div");
    preview.className = "picker-preview";
    preview.hidden = true;
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const meta = document.createElement("div");
    meta.className = "meta";
    const pname = document.createElement("span");
    pname.className = "pname";
    const pdir = document.createElement("span");
    pdir.className = "pdir";
    const phint = document.createElement("span");
    phint.className = "phint";
    meta.append(pname, pdir, phint);
    preview.append(thumb, meta);

    /** Show one row in the preview strip; the LoRA's picture comes from disk. */
    const showPreview = (option) => {
        preview.hidden = false;
        const { dir, name } = splitOptionPath(option);
        pname.textContent = name;
        pdir.textContent = dir;
        pdir.hidden = !dir;
        // The hint is the whole interaction: one tap looks, two taps pick.
        phint.textContent = "再点一次选择";
        thumb.replaceChildren();
        const placeholder = (text) => {
            const none = document.createElement("span");
            none.className = "none";
            none.textContent = text;
            thumb.replaceChildren(none);
        };
        const url = `/qq_mobile/preview?name=${encodeURIComponent(option)}`;
        const image = new Image();
        image.alt = name;
        // No loading="lazy": the element is not in the document until it has
        // loaded, and a lazy image that is never in the viewport never loads.
        image.addEventListener("load", () => thumb.replaceChildren(image));
        image.addEventListener("error", () => {
            // Video LoRAs ship an mp4 preview instead of an image. The element
            // goes in straight away: waiting for a frame would leave an empty
            // box until the browser decoded it.
            const video = document.createElement("video");
            video.muted = true;
            video.loop = true;
            video.autoplay = true;
            video.playsInline = true;
            video.preload = "auto";
            video.addEventListener("error", () => placeholder("无预览图"));
            video.src = url;
            thumb.replaceChildren(video);
        });
        image.src = url;
    };

    const list = document.createElement("div");
    list.className = "picker-list";

    // Long model lists are unusable without a filter; short ones do not need it.
    const searchable = options.length > 12;
    let query = "";
    // The row seen but not yet chosen (first tap of the two).
    let previewing = null;
    const renderRows = () => {
        list.replaceChildren();
        const needle = query.trim().toLowerCase();
        const matches = needle
            ? options.filter((option) => String(option).toLowerCase().includes(needle))
            : options;
        if (!matches.length) {
            const empty = document.createElement("div");
            empty.className = "picker-empty";
            empty.textContent = "没有匹配项";
            list.appendChild(empty);
            return;
        }
        for (const option of matches) {
            const row = document.createElement("button");
            row.type = "button";
            row.className = "picker-row combo"
                + (option === current ? " on" : "")
                + (option === previewing ? " previewing" : "");
            const main = document.createElement("span");
            main.className = "row-main";
            const { dir, name } = splitOptionPath(option);
            const nameEl = document.createElement("span");
            nameEl.className = "row-name";
            nameEl.textContent = name;
            main.appendChild(nameEl);
            if (dir) {
                const dirEl = document.createElement("span");
                dirEl.className = "row-dir";
                dirEl.textContent = dir;
                main.appendChild(dirEl);
            }
            const tick = document.createElement("span");
            tick.className = "tick";
            tick.innerHTML = option === current ? iconSvg("check", 18, 2.2) : "";
            row.append(main, tick);
            row.addEventListener("click", () => {
                if (previewable(option) && previewing !== option) {
                    previewing = option;
                    showPreview(option);
                    // Only the class list changes; rebuilding would lose the
                    // scroll position of a several-hundred entry list.
                    for (const other of list.querySelectorAll(".picker-row.previewing")) {
                        other.classList.remove("previewing");
                    }
                    row.classList.add("previewing");
                    return;
                }
                onPick(option);
                overlay.remove();
            });
            list.appendChild(row);
        }
    };
    renderRows();

    sheet.append(head, preview);
    if (searchable) {
        const bar = document.createElement("div");
        bar.className = "picker-search";
        const input = document.createElement("input");
        input.type = "search";
        input.placeholder = "搜索…";
        input.addEventListener("input", () => {
            query = input.value;
            renderRows();
        });
        bar.appendChild(input);
        sheet.appendChild(bar);
    }
    sheet.appendChild(list);

    overlay.appendChild(sheet);
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
    // Start at the current choice: a 300 entry list should not open at the top.
    const active = list.querySelector(".picker-row.on");
    if (active) active.scrollIntoView({ block: "center" });
}

/* ---------------- fullscreen text editor ---------------- */
/**
 * Long-press a text field to open it full screen.
 *
 * On a phone the inline box is cramped and the on-screen keyboard covers most
 * of the screen, so editing a long prompt in place is painful. Holding the
 * field for 2s promotes it to a full-screen editor instead of opening yet
 * another page or tab.
 */
const LONG_PRESS_MS = 2000;
/** Movement beyond this cancels the press, so scrolling never triggers it. */
const LONG_PRESS_SLOP = 12;

const editor = {
    key: null,
    original: "",
    openedAt: 0,
    timer: null,
    startX: 0,
    startY: 0,
    target: null,
};

function isEditorOpen() {
    return !el("editor").hidden;
}

function openEditor(parameter, sourceInput) {
    editor.key = parameter.key;
    editor.original = sourceInput.value;
    editor.openedAt = Date.now();
    editor.target = sourceInput;
    el("editorTitle").textContent = parameter.label || parameter.name || "编辑";
    const text = el("editorText");
    text.value = sourceInput.value;
    el("editor").hidden = false;
    el("editor").setAttribute("aria-hidden", "false");
    updateEditorCount();
    // Focus after the panel is visible, otherwise iOS refuses to show the
    // keyboard for a hidden element.
    requestAnimationFrame(() => {
        text.focus();
        text.setSelectionRange(text.value.length, text.value.length);
    });
}

function updateEditorCount() {
    const value = el("editorText").value;
    el("editorCount").textContent = `${value.length} 字`;
}

function closeEditor(commit) {
    if (!isEditorOpen()) return;
    const text = el("editorText");
    if (commit && editor.target) {
        editor.target.value = text.value;
        editor.target.dispatchEvent(new Event("input", { bubbles: true }));
    }
    el("editor").hidden = true;
    el("editor").setAttribute("aria-hidden", "true");
    // The click that closes the panel can otherwise land on a field below it.
    editor.openedAt = Date.now();
    editor.key = null;
    editor.target = null;
    el("editorText").blur();
}

/**
 * Wire long-press handling onto a text control.
 *
 * Pointer events cover mouse and touch alike. `touchstart` is also bound so a
 * long press still works while the page's scroll surface is intercepting
 * pointer events.
 */
function attachLongPress(input, parameter) {
    input.classList.add("longpressable");

    const clear = () => {
        clearTimeout(editor.timer);
        editor.timer = null;
        input.classList.remove("pressing");
    };

    const start = (event) => {
        if (isEditorOpen()) return;
        // Ignore secondary mouse buttons.
        if (event.pointerType === "mouse" && event.button !== 0) return;
        editor.startX = event.clientX ?? 0;
        editor.startY = event.clientY ?? 0;
        clearTimeout(editor.timer);
        editor.timer = setTimeout(() => {
            editor.timer = null;
            input.classList.remove("pressing");
            // Suppress the click/synthetic tap that would otherwise follow.
            editor.openedAt = Date.now();
            openEditor(parameter, input);
        }, LONG_PRESS_MS);
        input.classList.add("pressing");
    };

    const move = (event) => {
        if (!editor.timer) return;
        const dx = Math.abs((event.clientX ?? 0) - editor.startX);
        const dy = Math.abs((event.clientY ?? 0) - editor.startY);
        if (dx > LONG_PRESS_SLOP || dy > LONG_PRESS_SLOP) clear();
    };

    input.addEventListener("pointerdown", start);
    input.addEventListener("pointermove", move);
    input.addEventListener("pointerup", clear);
    input.addEventListener("pointercancel", clear);
    input.addEventListener("pointerleave", clear);
    input.addEventListener("touchstart", start, { passive: true });
    input.addEventListener("touchmove", move, { passive: true });
    input.addEventListener("touchend", clear);
    input.addEventListener("touchcancel", clear);
    input.addEventListener("contextmenu", (event) => {
        // A long press on mobile fires the context menu; the editor replaces it.
        if (Date.now() - editor.openedAt < 800) event.preventDefault();
    });
}

/** Model file pickers and sampler internals are rarely touched from a phone.
 * They go into a collapsed group so the first screen stays focused on the
 * prompt and the numbers that actually change per image.
 *
 * Membership is decided by name and by what the options look like, not by the
 * widget type. A dropdown the user promoted (任务模式 / 宽高比 / 增强方式) is a
 * primary choice and must stay visible, while a model file picker is noise
 * even though both are combos.
 */
const ADVANCED_NAMES = new Set([
    "unet_name", "clip_name", "vae_name", "ckpt_name", "lora_name",
    "sampler_name", "scheduler", "cfg", "denoise", "batch_size",
    "type", "device", "weight_dtype", "filename_prefix",
]);

const ADVANCED_LABELS = /模型|采样器|调度器|精度|设备/;
const MODEL_FILE_RE = /\.(safetensors|ckpt|pt|pth|bin|gguf)$/i;

const isAdvanced = (parameter) => {
    if (ADVANCED_NAMES.has(String(parameter.name || ""))) return true;
    if (ADVANCED_LABELS.test(String(parameter.label || ""))) return true;
    const type = String(parameter.type || "").toUpperCase();
    if (type === "COMBO" && parameter.options?.length) {
        // A combo whose options are file names is a model picker.
        return parameter.options.some(
            (option) => typeof option === "string" && MODEL_FILE_RE.test(option),
        );
    }
    return false;
};

/**
 * Shared prefix of a label such as "LoRA_1_名称" -> "LoRA_1".
 *
 * Multi-value and promoted inputs are labelled by row, so a LoRA's name and
 * weight carry the same prefix and differ only in the last segment.
 */
const labelStem = (label) => {
    const text = String(label || "").trim();
    const cut = Math.max(text.lastIndexOf("_"), text.lastIndexOf(" "));
    return cut > 0 ? text.slice(0, cut).trim() : "";
};

/**
 * Keep a model picker next to the number it belongs to.
 *
 * A LoRA row reads "LoRA_1_名称 / LoRA_1_权重". The name is a combo full of
 * *.safetensors, so on its own it is filed under 模型与采样 — while its weight
 * stays on the main form. The result reads as "0.8" with no clue which LoRA it
 * belongs to, and the LoRA can only be chosen after expanding a block that is
 * collapsed by default. When a sibling shares the prefix, the name is the
 * primary choice, so it moves up and sits right before its weight.
 */
function pairModelPickers(sections) {
    for (const bucket of sections.values()) {
        const primaryStems = new Map();
        for (const parameter of bucket.primary) {
            const stem = labelStem(parameter.label);
            if (stem && !primaryStems.has(stem)) primaryStems.set(stem, parameter);
        }
        if (!primaryStems.size) continue;
        const promoted = [];
        bucket.advanced = bucket.advanced.filter((parameter) => {
            const stem = labelStem(parameter.label);
            const sibling = stem ? primaryStems.get(stem) : null;
            if (!sibling) return true;
            promoted.push({ parameter, sibling });
            return false;
        });
        for (const { parameter, sibling } of promoted) {
            const index = bucket.primary.indexOf(sibling);
            if (index < 0) continue;
            bucket.primary.splice(index, 0, parameter);
        }
    }
}

/**
 * Render the form.
 *
 * A pipeline may hold several subgraph instances (often of the same
 * definition), whose promoted inputs share names. Each instance therefore
 * becomes its own titled section with its own collapsed "模型与采样" block,
 * so two "prompt" fields can never be confused for one another.
 */
function render(parameters) {
    const form = el("form");
    form.replaceChildren();
    const stored = loadStoredValues();
    const seen = new Set();

    // Preserve first-seen order of group names.
    const order = [];
    const sections = new Map();
    for (const parameter of parameters) {
        if (parameter.hidden) continue;
        seen.add(parameter.key);
        if (stored[parameter.key] !== undefined) {
            state.values[parameter.key] = stored[parameter.key];
        } else if (state.values[parameter.key] === undefined) {
            state.values[parameter.key] = parameter.value;
        }
        const name = String(parameter.group ?? "");
        if (!sections.has(name)) {
            sections.set(name, { primary: [], advanced: [] });
            order.push(name);
        }
        const bucket = sections.get(name);
        (isAdvanced(parameter) ? bucket.advanced : bucket.primary).push(parameter);
    }

    // A LoRA's name belongs next to its weight, not in the collapsed block.
    pairModelPickers(sections);

    const named = order.filter((name) => name).length;
    const showHeadings = order.length > 1;

    for (const name of order) {
        const { primary, advanced } = sections.get(name);
        if (showHeadings) form.appendChild(sectionHeading(name, named > 0));
        for (const parameter of primary) form.appendChild(fieldFor(parameter));
        if (advanced.length) {
            // Only worth naming the block when the form has named sections;
            // otherwise the title above it already says what it is.
            form.appendChild(advancedBlock(advanced, showHeadings ? name : ""));
        }
    }

    // Drop remembered values for parameters that no longer exist.
    for (const key of Object.keys(state.values)) {
        if (!seen.has(key)) delete state.values[key];
    }
    storeValues();

    if (!parameters.length) {
        form.innerHTML = `<div class="empty"><strong>这个工作流没有可调参数</strong>
            在 ComfyUI 里把子图的输入提升为参数后，重新点击「手机界面」。</div>`;
        return;
    }

    // Values are remembered per workflow, so offer a way back to the values
    // the workflow itself carries.
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "reset-btn";
    reset.textContent = "恢复默认值";
    reset.addEventListener("click", resetToDefaults);
    form.appendChild(reset);
}

/**
 * Forget every stored override and re-render from the template's values.
 *
 * The template holds the values the workflow had when it was prepared, which
 * is the closest thing to "defaults" the phone can see.
 */
function resetToDefaults() {
    state.values = {};
    try {
        localStorage.removeItem(`${STORAGE_KEY}:${state.workflow}`);
    } catch { /* storage blocked: re-render alone still resets the form */ }
    render(state.parameters);
    toast("已恢复默认值");
}

/** Heading for one subgraph instance's parameter section. */
function sectionHeading(name, subgraphs) {
    const heading = document.createElement("div");
    heading.className = "section-head";
    const title = document.createElement("span");
    title.className = "section-title";
    title.textContent = name || (subgraphs ? "未命名子图" : "参数");
    heading.appendChild(title);
    return heading;
}

/** Collapsed block of rarely-touched model and sampler settings. */
/**
 * The collapsed "model & sampler" block.
 *
 * A pipeline with two subgraph instances gets two of these, and both used to
 * read "模型与采样" — sitting one above the other with no way to tell which
 * belongs to which section. The section name is appended when the form has
 * named sections at all.
 */
function advancedBlock(parameters, sectionName = "") {
    const group = document.createElement("details");
    group.className = "group";
    const summary = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = "模型与采样";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = String(parameters.length);
    summary.append(label, count);
    if (sectionName) {
        const where = document.createElement("span");
        where.className = "group-where";
        where.textContent = sectionName;
        summary.appendChild(where);
    }
    const body = document.createElement("div");
    body.className = "body";
    for (const parameter of parameters) body.appendChild(fieldFor(parameter));
    group.append(summary, body);
    return group;
}

/* ---------------- results ---------------- */
function viewUrl(item) {
    const params = new URLSearchParams({
        filename: item.filename || "",
        subfolder: item.subfolder || "",
        type: item.type || "output",
    });
    if (item.format) params.set("format", item.format);
    // Prefix the mount path: behind a reverse proxy serving ComfyUI under a
    // subpath, a bare "/view" points outside the mount and 404s.
    return `${basePath()}/view?${params.toString()}`;
}

function renderResults(media) {
    const host = el("results");
    const label = el("resultsLabel");
    host.replaceChildren();
    label.hidden = !media.length;
    for (const item of media) {
        const card = document.createElement("div");
        card.className = "result-card";

        if (item.kind === "text") {
            const pre = document.createElement("pre");
            pre.textContent = item.text;
            card.appendChild(pre);
        } else if (item.kind === "audio") {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = viewUrl(item);
            card.appendChild(audio);
        } else if (item.kind === "videos" || /\.(mp4|webm|mov)$/i.test(item.filename || "")) {
            const video = document.createElement("video");
            video.controls = true;
            video.playsInline = true;
            video.src = viewUrl(item);
            card.appendChild(video);
        } else {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = viewUrl(item);
            img.alt = item.filename || "结果";
            card.appendChild(img);
        }

        const meta = document.createElement("div");
        meta.className = "result-meta";
        const size = document.createElement("span");
        const dims = item.metadata || {};
        size.textContent = dims.width && dims.height ? `${dims.width} × ${dims.height}` : "";

        if (item.filename) {
            const name = document.createElement("span");
            name.textContent = item.filename;
            name.style.overflow = "hidden";
            name.style.textOverflow = "ellipsis";
            name.style.whiteSpace = "nowrap";
            name.style.flex = "1";
            name.style.minWidth = "0";
            const link = document.createElement("a");
            link.href = viewUrl(item);
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "查看原图";
            meta.append(size, name, link);
        } else {
            meta.append(size);
        }
        card.appendChild(meta);
        host.appendChild(card);
    }

    if (media.length) {
        // The result is the point of the screen: bring the first card fully
        // into view instead of leaving it below a long parameter list.
        const first = host.firstElementChild;
        const scroll = () => {
            const target = first ?? label;
            const box = target?.getBoundingClientRect?.();
            const mainEl = el("main");
            if (!box || !mainEl) return;
            const footer = document.querySelector("footer");
            // The footer is fixed, so it covers the bottom of the scroll area:
            // treat its top edge as the real bottom of the visible viewport.
            const visibleBottom = footer
                ? footer.getBoundingClientRect().top
                : window.innerHeight;
            if (box.top >= 0 && box.bottom <= visibleBottom) return;
            mainEl.scrollTop += box.top - Math.max(0, (visibleBottom - box.height) / 2);
        };
        requestAnimationFrame(scroll);
        // Images change height once loaded, so re-anchor when that happens.
        host.querySelectorAll("img, video").forEach((node) => {
            if (node.complete) return;
            node.addEventListener("load", scroll, { once: true });
            node.addEventListener("loadedmetadata", scroll, { once: true });
        });
    }
    updateResultChip();
}

/**
 * Offer a way back to the result once it has scrolled out of view.
 *
 * A finished image sits below a long parameter list, so tweaking values and
 * returning to the picture means a lot of scrolling on a phone.
 */
function updateResultChip() {
    const chip = el("resultChip");
    const first = el("results").firstElementChild;
    if (!first || el("footer").hidden) {
        chip.hidden = true;
        return;
    }
    const box = first.getBoundingClientRect();
    const footerTop = el("footer").getBoundingClientRect().top;
    // Hide it once the result is on screen, and while a job is still running.
    chip.hidden = state.polling || (box.bottom > 0 && box.top < footerTop);
}

/* ---------------- network ---------------- */
const basePath = () => {
    const { pathname } = window.location;
    const trimmed = pathname.endsWith("/") ? pathname.slice(0, -1) : pathname;
    return trimmed.endsWith("/qq_mobile") ? trimmed.slice(0, -11) : "";
};

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/**
 * Inline icons.
 *
 * Buttons used to mix text glyphs (⤢, ⚄, −, +, ▾, ×, ›) with the header's
 * stroked SVGs: different weights, different vertical centring, and a few of
 * them render in whatever the platform's fallback font has. One set, one
 * stroke width, drawn at the size each control asks for.
 */
const ICON_PATHS = {
    expand: '<path d="M9 3H3v6"/><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 15v6h-6"/>',
