    dice: '<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>',
    minus: '<path d="M5 12h14"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
    next: '<path d="M9 6l6 6-6 6"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    check: '<path d="M4 12l5 5L20 6"/>',
    download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
};

function iconSvg(name, size = 18, strokeWidth = 1.8) {
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none"
        stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;
}

/** Give a button an icon without losing its text. */
function setIcon(element, name, size = 18) {
    element.innerHTML = iconSvg(name, size);
    element.dataset.icon = "1";
    return element;
}

async function fetchJson(path, options) {
    const response = await fetch(`${basePath()}${path}`, options);
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }
    if (!response.ok) {
        const message = data?.error?.message || data?.error || text.slice(0, 160);
        throw new Error(typeof message === "string" ? message : `HTTP ${response.status}`);
    }
    return data;
}

/**
 * Reload the form when the browser-side state changes.
 *
 * The canvas can change while the phone page is open — most notably a
 * QQ-多值输入 switch that flips a bypass rule and enables a media loader. The
 * extension re-pushes the template when that happens, so the phone only has to
 * notice the new revision and re-render. Values already typed are preserved
 * per field key by the form itself.
 */
const TEMPLATE_POLL_MS = 3000;
let templateRevision = null;
let templateTimer = null;

async function watchTemplate() {
    clearTimeout(templateTimer);
    templateTimer = setTimeout(watchTemplate, TEMPLATE_POLL_MS);
    if (state.polling) return;
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        if (templateRevision === null) {
            templateRevision = data.updated;
            return;
        }
        if (data.updated !== templateRevision) {
            templateRevision = data.updated;
            const kept = { ...state.values };
            state.parameters = data.parameters || [];
            el("title").textContent = data.title || "手机界面";
            document.title = data.title || "手机界面";
            render(state.parameters);
            // Restore what the user had typed for keys that still exist.
            for (const [key, value] of Object.entries(kept)) {
                if (key in state.values) state.values[key] = value;
            }
            toast("参数已同步");
        }
    } catch {
        // A missing template is handled by the initial load; stay quiet here.
    }
}

async function loadTemplate() {
    setStatus(null);
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        state.workflow = data.workflow;
        state.parameters = data.parameters || [];
        templateRevision = data.updated;
        el("title").textContent = data.title || "手机界面";
        // Keep the browser tab in sync with the pipeline name.
        document.title = data.title || "手机界面";
        // Only meaningful once a pipeline is loaded.
        el("switch").hidden = false;
        el("generate").disabled = false;
        setFooterVisible(true);
        render(state.parameters);
        renderHistory();
        watchTemplate();
        return true;
    } catch (error) {
        setFooterVisible(false);
        el("form").innerHTML = `<div class="empty"><strong>还没有模板</strong>
            回到 ComfyUI 打开工作流，点顶部「手机界面」按钮即可生成。<br>
            <span style="opacity:.6">${String(error.message || error)}</span></div>`;
        return false;
    }
}

function setBusy(busy, label) {
    const button = el("generate");
    button.disabled = busy;
    // A slow breathe while a job runs: the screen should not look stuck
    // between two polls.
    button.classList.toggle("busy", Boolean(busy));
    button.innerHTML = busy
        ? '<span class="spinner"></span><span>生成中</span>'
        : `<span>${label || "生成"}</span>`;
    el("cancel").hidden = !busy;
}

/**
 * How many images one press should queue.
 *
 * On a phone the whole point is to walk away: several variants queued at once,
 * each with its own seed, then pick the best from the results.
 */
const BATCH_KEY = "qq-mobile-batch";
const BATCH_MAX = 4;

function loadBatch() {
    try {
        const value = Number(localStorage.getItem(BATCH_KEY));
        return Number.isFinite(value) && value >= 1 && value <= BATCH_MAX
            ? Math.floor(value) : 1;
    } catch {
        return 1;
    }
}

function renderBatch() {
    const button = el("batch");
    button.textContent = `×${state.batch}`;
    button.classList.toggle("on", state.batch > 1);
}

function cycleBatch() {
    state.batch = state.batch >= BATCH_MAX ? 1 : state.batch + 1;
    try {
        localStorage.setItem(BATCH_KEY, String(state.batch));
    } catch {
        /* not important */
    }
    renderBatch();
}

/** Copy of the values with fresh seeds, for the 2nd..nth image. */
function nextSeedValues(values) {
    const copy = { ...values };
    for (const parameter of state.parameters || []) {
        if (!isSeedParameter(parameter)) continue;
        copy[parameter.key] = randomSeed(parameter);
    }
    return copy;
}

async function generate() {
    if (state.polling) return;
    setBusy(true);
    setStatus("running", "已提交，等待开始…");
    // Indeterminate until the server reports a step.
    setProgress(null);
    renderResults([]);
    state.media = [];

    const count = Math.max(1, state.batch || 1);
    const ids = [];
    try {
        for (let index = 0; index < count; index += 1) {
            // The first image keeps the form's seed; the rest get new ones, so a
            // batch is not several copies of the same picture.
            const values = index === 0 ? { ...state.values } : nextSeedValues(state.values);
            const data = await fetchJson("/qq_mobile/prompt", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workflow: state.workflow, values }),
            });
            if (data.prompt_id) ids.push(data.prompt_id);
            if (data.warnings?.length) toast(data.warnings.join("；"));
        }
        if (!ids.length) throw new Error("没有返回任务号");
        state.promptId = ids[ids.length - 1];
        state.promptIds = ids;
        poll();
    } catch (error) {
        setBusy(false, "重试");
        setStatus("error", `提交失败：${error.message}`);
        setProgress(undefined);
    }
}

function stopPolling() {
    state.polling = false;
    clearTimeout(state.timer);
    setBusy(false, "再生成一张");
}

/** Take in one job's result: done, failed or still running. */
function absorb(data) {
    if (data.media?.length) {
        state.media.push(...data.media);
        renderResults(state.media);
        return true;
    }
    if (data.status === "failed") {
        toast(String(data.execution_error || "执行失败").slice(0, 120));
        return true;
    }
    return data.status === "completed"
        || data.status === "cancelled"
        || data.status === "lost";
}

async function poll() {
    state.polling = true;
    const ids = state.promptIds?.length ? [...state.promptIds] : [state.promptId];
    const total = ids.length;
    try {
        const remaining = [];
        for (const [index, id] of ids.entries()) {
            const data = await fetchJson(`/qq_mobile/jobs?prompt_id=${encodeURIComponent(id)}`);
            const label = total > 1 ? `（${index + 1}/${total}）` : "";
            if (data.status === "pending") {
                const position = Number.isFinite(data.position) ? data.position + 1 : null;
                setStatus("running", position
                    ? `排队中，前面还有 ${position} 个任务${label}`
                    : `排队中…${label}`);
                setProgress(null);
                remaining.push(id);
                continue;
            }
            if (data.status === "in_progress") {
                setStatus("running", total > 1
                    ? `正在生成 ${index + 1}/${total}…`
                    : "正在生成…");
                setProgress(null);
                remaining.push(id);
                continue;
            }
            // Finished, failed or cancelled: nothing left to wait for.
            absorb(data);
        }

        state.promptIds = remaining;
        if (!remaining.length) {
            const produced = state.media.length;
            if (produced) {
                setStatus("done", total > 1
                    ? `完成，共 ${produced} 个结果`
                    : "完成");
                pushHistory(state.media);
            } else {
                setStatus("error", "完成，但没有输出媒体");
            }
            setProgress(undefined);
            stopPolling();
            return;
        }
    } catch (error) {
        setStatus("error", `查询失败：${error.message}`);
    }
    state.timer = setTimeout(poll, POLL_MS);
}

async function cancel() {
    try {
        // The prompt id lets the backend drop a job that is still queued;
        // /interrupt alone only stops the one that is executing.
        await fetchJson("/qq_mobile/interrupt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt_id: state.promptId || "" }),
        });
        toast("已取消");
    } catch (error) {
        toast(`取消失败：${error.message}`);
    }
    stopPolling();
    setStatus("error", "已取消");
    setProgress(undefined);
}

/* ---------------- pipeline picker ---------------- */
/** Last few characters of a workflow key, to separate identical titles. */
function shortWorkflowId(workflow) {
    const text = String(workflow || "");
    const tail = text.split(/[\\/]/).pop() || text;
    const id = tail.replace(/^unsaved-/, "");
    return id.slice(-4);
}

/** Which pipelines were opened from this phone, and when. */
const RECENT_KEY = "qq-mobile-recent";

function loadRecent() {
    try {
        const raw = localStorage.getItem(RECENT_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return parsed && typeof parsed === "object" ? parsed : {};
    } catch {
        return {};
    }
}

/** Remember a pipeline as used; keeps the twelve newest entries. */
function markRecent(key) {
    if (!key) return;
    const map = loadRecent();
    map[key] = Date.now();
    const entries = Object.entries(map)
        .sort((a, b) => Number(b[1]) - Number(a[1]))
        .slice(0, 12);
    try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(Object.fromEntries(entries)));
    } catch {
        /* private mode: the ordering is a nicety, not a requirement */
    }
}

/** "刚刚" / "3 分钟前" / "2 天前", for the picker's secondary line. */
function relativeTime(stamp) {
    const seconds = Math.floor(Date.now() / 1000 - Number(stamp || 0));
    if (!Number.isFinite(seconds) || seconds < 0) return "";
    if (seconds < 60) return "刚刚";
    if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
    if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} 天前`;
    return `${Math.floor(seconds / (86400 * 30))} 个月前`;
}

/**
 * List the prepared pipelines so one can be chosen on the phone.
 *
 * Shown when the page was opened without a specific workflow, or when the user
 * asks to switch. Tapping a row loads that pipeline's form. The library runs to
 * dozens of files, so the list is searchable and the pipelines actually used
 * recently are offered first.
 */
async function showPipelinePicker() {
    const host = el("form");
    const results = el("results");
    results.replaceChildren();
    el("resultsLabel").hidden = true;
    el("history").hidden = true;
    el("historyLabel").hidden = true;
    el("generate").disabled = true;
    el("switch").hidden = true;
    // The footer only holds actions for a loaded pipeline, and the refresh
    // button would silently open the newest one from here.
    setFooterVisible(false);
    el("title").textContent = "选择流水线";
    document.title = "选择流水线";
    setStatus(null);

    let templates = [];
    let files = [];
    try {
        // The library listing is what makes every saved pipeline visible; the
        // template list only tells us which of them are ready to run.
        const [stateData, libData] = await Promise.all([
            fetchJson("/qq_mobile/state").catch(() => ({ templates: [] })),
            fetchJson("/qq_mobile/workflows").catch(() => ({ workflows: [] })),
        ]);
        templates = stateData.templates || [];
        files = libData.workflows || [];
    } catch (error) {
        host.innerHTML = `<div class="empty"><strong>读取流水线失败</strong>
            ${String(error.message || error)}</div>`;
        return;
    }

    // Merge: every saved workflow gets a row. Ones with a template are ready;
    // the rest are listed as a reminder that they exist but need a pass
    // through the editor first.
    const byKey = new Map(templates.map((item) => [item.workflow, item]));
    const rows = [];
    for (const file of files) {
        if (!file.id) continue;
        const key = `unsaved-${file.id}`;
        const template = byKey.get(key);
        byKey.delete(key);
        rows.push({
            key,
            title: template?.title || file.name,
            folder: file.folder || template?.folder || "",
            name: file.name,
            path: file.path || "",
            parameters: template?.parameters || 0,
            ready: Boolean(template),
            updated: template?.updated || file.updated || 0,
        });
    }
    // Templates with no file behind them (a canvas that was never saved).
    for (const template of byKey.values()) {
        rows.push({
            key: template.workflow,
            title: template.title || template.workflow,
            folder: template.folder || "",
            name: template.title || template.workflow,
            parameters: template.parameters || 0,
            ready: true,
            updated: template.updated || 0,
        });
    }

    if (!rows.length) {
        host.innerHTML = `<div class="empty"><strong>还没有可用的流水线</strong>
            在 ComfyUI 里打开工作流，点顶部「手机界面」按钮即可生成。</div>`;
        return;
    }

    host.replaceChildren();
    // Duplicate titles (two "Unsaved Workflow") get a short id suffix.
    const titleCounts = new Map();
    for (const row of rows) {
        titleCounts.set(row.title, (titleCounts.get(row.title) || 0) + 1);
    }

    // A search bar, because the folder grouping alone means scrolling past
    // everything in the library to find one pipeline by name.
    const bar = document.createElement("div");
    bar.className = "picker-search pipeline-search";
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = "搜索流水线…";
    input.setAttribute("aria-label", "搜索流水线");
    bar.appendChild(input);

    const body = document.createElement("div");
    body.className = "pipeline-body";

    const paint = (query) => {
        body.replaceChildren();
        const needle = String(query || "").trim().toLowerCase();
        if (needle) {
            const hits = rows.filter((row) => [row.title, row.name, row.folder, row.key]
                .some((value) => String(value || "").toLowerCase().includes(needle)));
            if (!hits.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.innerHTML = "<strong>没有匹配的流水线</strong>";
                body.appendChild(empty);
                return;
            }
            const list = document.createElement("div");
            list.className = "pipeline-list";
            for (const item of hits) list.appendChild(pipelineRow(item, titleCounts));
            body.appendChild(list);
            return;
        }

        // Recently opened pipelines first: the phone is used to repeat the two
        // or three pipelines that are in rotation, not to browse the library.
        const recent = loadRecent();
        const recentRows = rows
            .filter((row) => recent[row.key])
            .sort((a, b) => recent[b.key] - recent[a.key])
            .slice(0, 4);
        const shownAbove = new Set();
        if (recentRows.length) {
            const list = document.createElement("div");
            list.className = "pipeline-list";
            const head = document.createElement("div");
            head.className = "folder-head recent";
            head.textContent = "最近使用";
            list.appendChild(head);
            for (const item of recentRows) {
                list.appendChild(pipelineRow(item, titleCounts));
                shownAbove.add(item.key);
            }
            body.appendChild(list);
        }

        // Group by the folder the workflow lives in, the way the editor sidebar
        // does; root-level files come first. Anything already listed under
        // 最近使用 is not repeated below — on a phone the repeat reads as a bug.
        const groups = new Map();
        for (const row of rows) {
            if (shownAbove.has(row.key)) continue;
            if (!groups.has(row.folder)) groups.set(row.folder, []);
            groups.get(row.folder).push(row);
        }
        const folderOrder = [...groups.keys()].sort((a, b) => {
            if (a === b) return 0;
            if (!a) return -1;
            if (!b) return 1;
            return a.localeCompare(b, "zh");
        });

        for (const folder of folderOrder) {
            const list = document.createElement("div");
            list.className = "pipeline-list";
            if (folderOrder.length > 1) {
                const head = document.createElement("div");
                head.className = "folder-head";
                head.textContent = folder || "未分组";
                list.appendChild(head);
            }
            const items = groups.get(folder).sort((a, b) => {
                if (a.ready !== b.ready) return a.ready ? -1 : 1;
                return (b.updated || 0) - (a.updated || 0);
            });
            for (const item of items) {
                list.appendChild(pipelineRow(item, titleCounts));
            }
            body.appendChild(list);
        }
    };

    input.addEventListener("input", () => paint(input.value));
    host.append(bar, body);
    paint("");
}

/** One row in the pipeline picker. */
function pipelineRow(item, titleCounts) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "pipeline-row" + (item.ready ? "" : " is-pending");

    const main = document.createElement("div");
    main.className = "pipeline-main";
    const name = document.createElement("span");
    name.className = "pipeline-name";
    name.textContent = (titleCounts.get(item.title) || 0) > 1
        ? `${item.title} · ${shortWorkflowId(item.key)}`
        : item.title;
    const meta = document.createElement("span");
    meta.className = "pipeline-meta";
    meta.textContent = item.ready
        ? `${item.parameters} 个参数 · ${relativeTime(item.updated)}`
        : "待准备";
    main.append(name, meta);

    const arrow = document.createElement("span");
    arrow.className = "pipeline-arrow";
    arrow.innerHTML = item.ready ? iconSvg("next", 18) : "";

    row.append(main, arrow);
    row.addEventListener("click", async () => {
        if (row.dataset.busy === "1") return;
        if (!item.ready) {
            // Not prepared yet: ask the editor to expand this one workflow and
            // wait for it. Preparing every workflow up front would cost
            // seconds per file and swap the canvas once per file.
            const ok = await preparePipeline(item, row, meta, arrow);
            if (!ok) return;
        }
        state.workflow = item.key;
        markRecent(item.key);
        const url = new URL(window.location.href);
        url.searchParams.set("workflow", item.key);
        window.history.replaceState({}, "", url);
        loadTemplate();
    });
    return row;
}

/**
 * Ask the editor to prepare one workflow and wait for it.
 *
 * The editor is the only place that can expand a workflow, so the phone
 * leaves a request and watches for the template to appear.
 */
async function preparePipeline(item, row, meta, arrow) {
    if (!item.path) {
        toast(`「${item.name}」还没有准备，请在 ComfyUI 里点一次「手机界面」`);
        return false;
    }
    row.dataset.busy = "1";
    row.classList.add("is-preparing");
    meta.textContent = "准备中…";
    arrow.textContent = "…";
    try {
        await fetchJson("/qq_mobile/prepare", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                workflow: item.key,
                path: item.path,
                title: item.title || item.name,
                folder: item.folder || "",
            }),
        });
        const outcome = await waitForTemplate(item.key);
        if (outcome.state === "ready") return true;
        meta.textContent = "待准备";
        arrow.innerHTML = "";
        if (outcome.state === "failed") {
            toast(prepareFailureText(outcome.error, item));
        } else {
            toast("还没准备好：请在电脑上回到 ComfyUI 页面，打开这条流水线后点一次「手机界面」");
        }
        return false;
    } catch (error) {
        meta.textContent = "待准备";
        arrow.innerHTML = "";
        toast(`准备失败：${String(error.message || error)}`);
        return false;
    } finally {
        row.dataset.busy = "0";
        row.classList.remove("is-preparing");
    }
}

/**
 * Wait for a workflow to be prepared.
 *
 * Returns "ready", "failed" or "timeout". A failure carries the reason.
 */
async function waitForTemplate(key, timeoutMs = 12000) {
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
        await sleep(700);
        const template = await fetchJson(
            `/qq_mobile/template?workflow=${encodeURIComponent(key)}`,
        ).catch(() => null);
        if (template && !template.error) return { state: "ready" };
        const data = await fetchJson("/qq_mobile/prepare").catch(() => null);
        const request = (data?.requests || []).find(
            (entry) => entry.workflow === key,
        );
        if (request?.state === "failed") {
            return { state: "failed", error: request.error || "" };
        }
    }
    return { state: "timeout" };
}

/** Wording for a workflow that could not be prepared. */
function prepareFailureText(error, item) {
    const message = String(error || "");
    if (message.includes("既没有子图")) {
        return `「${item.name}」没有可在手机上调节的参数`;
    }
    return `「${item.name}」准备失败：${message.slice(0, 60) || "未知原因"}`;
}

/* ---------------- swipe between pipelines ---------------- */
/**
 * Swipe left/right on the form to move to the next/previous pipeline.
 *
 * Switching used to be: tap 切换 → find the row → tap. A swipe is the gesture
 * a phone user reaches for. The gesture is only taken when it is clearly
 * horizontal and did not start on something that scrolls sideways itself
 * (media strip, history strip) or on a field being edited.
 */
const SWIPE_MIN = 70;
let swipeStart = null;

function swipeIgnored(target) {
    return Boolean(target?.closest?.(
        "input, textarea, select, .media-thumbs, .history, .picker, .viewer, .editor",
    ));
}

/** Ordered keys of the pipelines the phone can actually open. */
async function pipelineOrder() {
    if (state.order?.length) return state.order;
    try {
        const [stateData, libData] = await Promise.all([
            fetchJson("/qq_mobile/state").catch(() => ({ templates: [] })),
            fetchJson("/qq_mobile/workflows").catch(() => ({ workflows: [] })),
        ]);
        const ready = new Set((stateData.templates || []).map((item) => item.workflow));
        const keys = [];
        for (const file of libData.workflows || []) {
            if (!file.id) continue;
            const key = `unsaved-${file.id}`;
            if (ready.has(key)) keys.push(key);
        }
        state.order = keys;
        return keys;
    } catch {
        return [];
    }
}

async function swipeTo(direction) {
    const order = await pipelineOrder();
    const index = order.indexOf(state.workflow);
    if (index < 0 || order.length < 2) {
        toast("没有其他可切换的流水线");
        return;
    }
    const key = order[(index + direction + order.length) % order.length];
    state.workflow = key;
    markRecent(key);
    const url = new URL(window.location.href);
    url.searchParams.set("workflow", key);
    window.history.replaceState({}, "", url);
    renderResults([]);
    await loadTemplate();
}

function attachSwipe() {
    const surface = el("main");
    surface.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1 || swipeIgnored(event.target)) {
            swipeStart = null;
            return;
        }
        const touch = event.touches[0];
        swipeStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    surface.addEventListener("touchend", (event) => {
        if (!swipeStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - swipeStart.x;
        const dy = touch.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        // Swiping left turns to the next pipeline.
        swipeTo(dx < 0 ? 1 : -1);
    }, { passive: true });
}

/* ---------------- boot ---------------- */
el("generate").addEventListener("click", generate);
el("batch").addEventListener("click", cycleBatch);
el("cancel").addEventListener("click", cancel);
el("reload").addEventListener("click", async () => {
    const ok = await loadTemplate();
    toast(ok ? "参数已刷新" : "刷新失败");
});

/* Back to the ComfyUI graph. The toolbar button navigates here in the same
 * tab, so history.back() returns to the editor; opening the phone page
 * directly has nothing to go back to, so fall back to the root URL. */
el("back").addEventListener("click", () => {
    if (window.history.length > 1 && document.referrer) {
        window.history.back();
        return;
    }
    const base = basePath();
    window.location.assign(`${base}/`);
});

/* Switch pipelines without leaving the page. */
el("switch").addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.delete("workflow");
    window.history.replaceState({}, "", url);
    state.workflow = "";
    clearTimeout(templateTimer);
    showPipelinePicker();
});

/* Fullscreen viewer for past results. */
el("viewerClose").addEventListener("click", closeViewer);
el("viewerReuse").addEventListener("click", reuseEntry);
el("viewer").addEventListener("click", (event) => {
    if (event.target === el("viewer") || event.target.closest(".viewer-stage")) closeViewer();
});

/* Fullscreen editor wiring. */
el("editorText").addEventListener("input", updateEditorCount);
el("editorDone").addEventListener("click", () => closeEditor(true));
el("editorRevert").addEventListener("click", () => {
    el("editorText").value = editor.original;
    updateEditorCount();
});
document.addEventListener("keydown", (event) => {
    if (!isEditorOpen()) return;
    if (event.key === "Escape") {
        event.preventDefault();
        closeEditor(false);
    } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        closeEditor(true);
    }
});

/* Keep the "back to result" chip in step with the scroll position. */
el("main").addEventListener("scroll", updateResultChip, { passive: true });
el("resultChip").addEventListener("click", () => {
    const first = el("results")?.firstElementChild;
    if (!first) return;
    const mainEl = el("main");
    mainEl.scrollTo({ top: mainEl.scrollTop + first.getBoundingClientRect().top - 12,
                      behavior: "smooth" });
    el("resultChip").hidden = true;
});

/* Open the pipeline picker: without a workflow in the URL the page starts
 * there, so a phone can choose which pipeline to run instead of being locked
 * to whichever one the editor happened to have open. */
const initialWorkflow = new URLSearchParams(location.search).get("workflow");
state.batch = loadBatch();
renderBatch();
renderHistory();
attachSwipe();
if (initialWorkflow) {
    state.workflow = initialWorkflow;
    loadTemplate();
} else {
    showPipelinePicker();
}</script>
</body>
