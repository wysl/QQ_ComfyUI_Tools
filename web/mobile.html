<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No maximum-scale: pinch-zoom has to stay available to inspect a generated
     image in detail. iOS instead zooms on its own when a focused field is
     smaller than 16px, which is why form controls get an explicit 16px. -->
<meta name="theme-color" content="#12131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>手机界面</title>
<style>
:root {
    color-scheme: dark;
    --bg: #12131a;
    --surface: #1b1d26;
    --surface-2: #23252f;
    --line: #303342;
    --text: #eceef6;
    --muted: #9aa0b4;
    --accent: #4d7cfe;
    --accent-press: #3f68d8;
    --danger: #e5484d;
    --ok: #30a46c;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overscroll-behavior-y: none;
}
/* Fixed viewport height so the scroll area below is bounded: with
   min-height the form would stretch the page instead of scrolling inside it. */
html { height: 100%; }
body {
    display: flex; flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

/* ---------- header ---------- */
header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + var(--safe-top)) 12px 8px;
    background: rgba(18, 19, 26, .92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
}
header h1 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
    /* 44px is the minimum comfortable touch target; 36px was easy to miss. */
    flex: none; width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); color: var(--text);
    cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- scroll area ---------- */
main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* Leave room for the fixed footer (status line + button) so the last
       field stays reachable. */
    padding: 14px 14px calc(130px + var(--safe-bottom));
}

/* ---------- per-subgraph sections ---------- */
.section-head {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 12px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
}
.section-head + .field { margin-top: 0; }
.section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    letter-spacing: .01em;
}
.section-head::before {
    content: ""; flex: none;
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--accent);
}

/* ---------- pipeline picker ---------- */
/* Folder headings mirror the editor's workflow sidebar. */
.folder-head {
    margin: 18px 0 8px;
    padding-left: 2px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
    color: var(--muted);
    text-transform: none;
}
.pipeline-list:first-child .folder-head { margin-top: 0; }
.pipeline-list { display: flex; flex-direction: column; gap: 10px; }
/* A workflow that exists but has no template yet: listed, but not runnable. */
.pipeline-row.is-pending { opacity: .55; }
.pipeline-row.is-pending .pipeline-arrow { font-size: 22px; }
.pipeline-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 16px 14px;
    text-align: left;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
}
.pipeline-row:active { background: var(--surface-2); }
.pipeline-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pipeline-name {
    font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pipeline-meta { font-size: 12px; color: var(--muted); }
.pipeline-arrow { flex: none; font-size: 20px; color: var(--muted); }

/* ---------- media picker ---------- */
.media { display: flex; flex-direction: column; gap: 10px; }
.media-thumbs {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    min-height: 96px;
    -webkit-overflow-scrolling: touch;
}
.media-empty {
    flex: 1; display: grid; place-items: center;
    color: var(--muted); font-size: 13px;
}
.media-item {
    position: relative; flex: none;
    width: 96px;
    display: flex; flex-direction: column; gap: 4px;
}
.media-item img,
.media-item .media-audio {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
    display: block;
}
.media-item video {
    width: 96px; height: 96px;
    object-fit: cover;
    border-radius: 10px;
    background: #0b0c11;
}
.media-item .media-audio {
    display: grid; place-items: center;
    font-size: 32px; color: var(--muted);
}
.media-item span {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-remove {
    position: absolute; top: -6px; right: -6px;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: var(--danger); color: #fff;
    font-size: 15px; line-height: 1;
    cursor: pointer;
}
.media-actions { display: flex; gap: 10px; }
.media-btn {
    flex: 1; min-height: 44px;
    font: 600 14px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px;
    cursor: pointer;
}
.media-btn:active { background: var(--surface-2); }
.media-btn.primary { color: #fff; background: var(--accent); border-color: transparent; }
.media-btn:disabled { opacity: .5; }

/* modal list */
.picker {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: flex-end;
    background: rgba(0, 0, 0, .55);
}
.picker-sheet {
    width: 100%; max-height: 80dvh;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding-bottom: var(--safe-bottom);
    animation: sheetIn .2s ease-out;
}
@keyframes sheetIn {
    from { transform: translateY(24px); opacity: .6; }
    to { transform: translateY(0); opacity: 1; }
}
.picker-head {
    display: flex; align-items: center;
    padding: 14px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
}
.picker-close {
    margin-left: auto;
    width: 32px; height: 32px;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--muted);
    font-size: 22px; line-height: 1; cursor: pointer;
}
.picker-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.picker-row {
    display: block; width: 100%;
    padding: 13px 16px;
    text-align: left;
    font: inherit; font-size: 14px;
    color: var(--text); background: transparent;
    border: 0; border-bottom: 1px solid rgba(255,255,255,.04);
    cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-row.on { background: rgba(77, 124, 254, .16); color: #b9cbff; }
.picker-foot { padding: 12px 16px; border-top: 1px solid var(--line); }

/* ---------- fullscreen text editor ---------- */
.editor {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: var(--bg);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    /* Slide in from the bottom so it reads as an in-place expansion. */
    animation: editorIn .18s ease-out;
}
.editor[hidden] { display: none; }
@keyframes editorIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
.editor-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
}
.editor-head h2 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editor-head button {
    flex: none; min-height: 38px; padding: 0 15px;
    font: 600 15px/1 inherit;
    border-radius: 10px; cursor: pointer;
}
.editor-head .done {
    color: #fff; background: var(--accent); border: 0;
}
.editor-head .clear {
    color: var(--muted); background: transparent;
    border: 1px solid var(--line);
}
.editor-body {
    flex: 1; min-height: 0;
    display: flex;
    padding: 12px;
}
.editor-body textarea {
    flex: 1; width: 100%;
    resize: none;
    padding: 14px;
    font: inherit; line-height: 1.6;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    outline: none;
}
.editor-body textarea:focus { border-color: var(--accent); }
.editor-foot {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 12px;
    font-size: 12px; color: var(--muted);
}
.editor-foot .grow { flex: 1; }
/* Long-press affordance on text fields. */
.longpressable { position: relative; -webkit-touch-callout: none; }
.longpressable.pressing { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- fields ---------- */
.field { margin-bottom: 16px; }
.field > label {
    display: block; margin-bottom: 7px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .01em;
}
.field textarea,
.field input[type="text"],
.field input[type="number"],
.field select {
    width: 100%;
    padding: 12px 13px;
    /* 16px, not the inherited 15px: iOS Safari zooms the whole page when a
       focused control is smaller than that, which feels like a broken layout.
       Written as longhands because `font: 16px/1.5 inherit` is invalid CSS and
       would be dropped, leaving the browser default. */
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    outline: none;
    appearance: none;
}
.field textarea { min-height: 120px; resize: none; line-height: 1.55; }
/* Text fields get a tap target for the fullscreen editor, since a long press
   is not something anyone discovers on their own. */
.text-wrap { position: relative; display: flex; }
.text-wrap > textarea,
.text-wrap > input { flex: 1; padding-right: 44px; }
.expand-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
}
.expand-btn:active { color: var(--text); background: var(--line); }
.field textarea:focus,
.field input:focus,
.field select:focus { border-color: var(--accent); }

.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper button {
    flex: none; width: 46px;
    font-size: 20px; font-weight: 500;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
.stepper button:active { background: var(--surface-2); }
.stepper input { text-align: center; min-width: 0; }
.stepper .dice-btn { font-size: 18px; color: var(--muted); }
.stepper .dice-btn:active { color: var(--text); }

/* Reset the whole form back to the values baked into the workflow. */
.reset-btn {
    display: block;
    margin: 22px auto 0;
    padding: 10px 18px;
    font: 600 13px/1 inherit;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer;
}
.reset-btn:active { color: var(--text); background: var(--surface-2); }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { width: 50px; height: 30px; accent-color: var(--accent); }

select { background-image: none; }

/* ---------- collapsible group ---------- */
/* A collapsible section, deliberately quieter than a form field: it groups
 * secondary settings, so it reads as a divider rather than an input box. */
details.group {
    margin: 20px 0 16px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    background: transparent;
}
details.group > summary {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 2px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .02em;
    cursor: pointer; list-style: none;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after {
    content: "▾"; margin-left: auto; color: var(--muted);
    font-size: 12px;
    transition: transform .18s ease;
}
details.group[open] > summary::after { transform: rotate(180deg); }
details.group > summary .count {
    padding: 1px 6px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 500;
}
details.group > .body { padding: 4px 0 6px; }
details.group .field:last-child { margin-bottom: 0; }

/* ---------- results ---------- */
main > .section-label {
    margin: 22px 0 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
}
main > .section-label[hidden] { display: none; }
.results { display: flex; flex-direction: column; gap: 12px; }
.result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
}
.result-card img,
.result-card video {
    display: block; width: 100%; height: auto; background: #0b0c11;
}
.result-card pre {
    margin: 0; padding: 12px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 13px; color: var(--muted);
}
.result-meta {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line);
}
.result-meta a { color: var(--accent); text-decoration: none; margin-left: auto; }

/* ---------- status ---------- */
.status { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; min-height: 20px; }
.status[hidden] { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.done { background: var(--ok); }
.dot.error { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.status-text { font-size: 13px; color: var(--muted); }

.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-bottom: 14px; }
.progress[hidden] { display: none; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

/* ---------- footer ---------- */
footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    /* Column so the status line can live here instead of above the form: a
       row that appears and disappears there would shift the whole page. */
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px 14px calc(12px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(18,19,26,.75), var(--bg) 45%);
    backdrop-filter: blur(12px);
}
footer[hidden] { display: none; }
.footer-row { display: flex; gap: 10px; }
footer .progress { margin: 0; }
footer .status { margin: 0; min-height: 18px; }
footer button.primary {
    flex: 1; min-height: 50px;
    font: 600 16px/1 inherit;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
footer button.primary:active { background: var(--accent-press); }
footer button.primary:disabled { opacity: .55; }
footer button.ghost {
    flex: none; min-width: 92px; padding: 0 16px;
    font: 600 15px/1 inherit;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer;
}
footer button.ghost:active { background: var(--surface-2); }

/* Chip that jumps back to a finished result. It lives inside the footer so it
   can never cover a form control. */
.result-chip {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 38px;
    font: 600 13px/1 inherit;
    color: var(--accent);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    animation: chipIn .18s ease-out;
}
.result-chip[hidden] { display: none; }
@keyframes chipIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.spinner {
    width: 16px; height: 16px; flex: none;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
    padding: 40px 20px; text-align: center;
    color: var(--muted); font-size: 14px; line-height: 1.7;
}
.empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 15px; }
.toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(84px + var(--safe-bottom));
    z-index: 40; padding: 11px 14px;
    background: #2b2330; border: 1px solid #4a3550;
    border-radius: 12px; font-size: 13px; color: #f3d9ff;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<header>
    <button class="icon-btn" id="back" aria-label="返回 ComfyUI" title="返回 ComfyUI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>
    <h1 id="title">手机界面</h1>
    <button class="icon-btn" id="switch" aria-label="切换流水线" title="切换流水线" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h13"></path>
            <path d="M14 4l3 3-3 3"></path>
            <path d="M20 17H7"></path>
            <path d="M10 14l-3 3 3 3"></path>
        </svg>
    </button>
    <button class="icon-btn" id="reload" aria-label="刷新参数" title="刷新参数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
            <path d="M21 3v6h-6"></path>
        </svg>
    </button>
</header>

<main id="main">
    <form id="form" autocomplete="off"></form>
    <div class="section-label" id="resultsLabel" hidden>结果</div>
    <div class="results" id="results"></div>
</main>

<footer id="footer">
    <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
    <div class="status" id="status" hidden>
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText"></span>
    </div>
    <button class="result-chip" id="resultChip" type="button" hidden>↓ 查看结果</button>
    <div class="footer-row">
        <button class="primary" id="generate" type="button"><span>生成</span></button>
        <button class="ghost" id="cancel" type="button" hidden>取消</button>
    </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Fullscreen editor opened by long-pressing a text field. -->
<section class="editor" id="editor" hidden aria-hidden="true">
    <div class="editor-head">
        <h2 id="editorTitle">编辑</h2>
        <button type="button" class="clear" id="editorRevert">还原</button>
        <button type="button" class="done" id="editorDone">完成</button>
    </div>
    <div class="editor-body">
        <textarea id="editorText" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="editor-foot">
        <span class="grow" id="editorCount">0 字</span>
        <span>完成即生效</span>
    </div>
</section>

<script>
"use strict";

const TOAST_MS = 3200;
const POLL_MS = 1200;
const STORAGE_KEY = "qq-mobile-values";

const el = (id) => document.getElementById(id);
const state = {
    workflow: new URLSearchParams(location.search).get("workflow") || "",
    parameters: [],
    values: {},
    promptId: "",
    polling: false,
    timer: null,
};

function toast(message) {
    const node = el("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove("show"), TOAST_MS);
}

function setStatus(kind, text) {
    const wrap = el("status");
    if (!kind) { wrap.hidden = true; return; }
    wrap.hidden = false;
    el("statusDot").className = `dot ${kind}`;
    el("statusText").textContent = text;
}

/** The footer holds the action button, so it only belongs on a pipeline. */
function setFooterVisible(visible) {
    el("footer").hidden = !visible;
    el("reload").hidden = !visible;
    if (!visible) {
        el("resultChip").hidden = true;
    }
}

function setProgress(ratio) {
    const bar = el("progress");
    if (ratio == null) { bar.hidden = true; return; }
    bar.hidden = false;
    el("progressBar").style.width = `${Math.max(0, Math.min(1, ratio)) * 100}%`;
}

/* ---------------- value persistence ---------------- */
function loadStoredValues() {
    try {
        const raw = localStorage.getItem(`${STORAGE_KEY}:${state.workflow}`);
        return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
}
function storeValues() {
    try {
        localStorage.setItem(
            `${STORAGE_KEY}:${state.workflow}`, JSON.stringify(state.values));
    } catch { /* storage full or blocked: not fatal */ }
}

/* ---------------- form rendering ---------------- */
function coerce(parameter, raw) {
    const type = String(parameter.type || "").toUpperCase();
    if (type === "INT") {
        const n = Number.parseInt(raw, 10);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "FLOAT") {
        const n = Number.parseFloat(raw);
        return Number.isFinite(n) ? n : 0;
    }
    if (type === "BOOLEAN") return Boolean(raw);
    return raw;
}

function isCombo(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    return Array.isArray(parameter.options) && parameter.options.length > 0
        || type === "COMBO";
}

function fieldFor(parameter) {
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = parameter.label || parameter.name;
    label.setAttribute("for", `f-${parameter.key}`);
    wrap.appendChild(label);

    const type = String(parameter.type || "STRING").toUpperCase();
    const value = state.values[parameter.key] ?? parameter.value;
    const commit = (next) => {
        state.values[parameter.key] = next;
        storeValues();
    };

    // Media inputs (LoadImage, QQ-多媒体加载, ...) get a picker with upload.
    if (parameter.media) {
        wrap.appendChild(mediaField(parameter, value, commit));
        return wrap;
    }

    if (type === "BOOLEAN") {
        wrap.classList.add("switch");
        wrap.removeChild(label);
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.id = `f-${parameter.key}`;
        toggle.checked = Boolean(value);
        toggle.addEventListener("change", () => commit(toggle.checked));
        wrap.append(label, toggle);
        label.style.marginBottom = "0";
        return wrap;
    }

    if (isCombo(parameter)) {
        const select = document.createElement("select");
        select.id = `f-${parameter.key}`;
        const options = parameter.options || [];
        for (const option of options) {
            const node = document.createElement("option");
            node.value = option;
            node.textContent = option;
            select.appendChild(node);
        }
        if (!options.includes(value) && value != null) {
            const node = document.createElement("option");
            node.value = value;
            node.textContent = value;
            select.appendChild(node);
        }
        select.value = value ?? options[0] ?? "";
        select.addEventListener("change", () => commit(select.value));
        wrap.appendChild(select);
        return wrap;
    }

    if (type === "INT" || type === "FLOAT") {
        const stepper = document.createElement("div");
        stepper.className = "stepper";
        const step = parameter.step ?? (type === "INT" ? 1 : 0.01);
        const input = document.createElement("input");
        input.type = "number";
        input.inputMode = type === "INT" ? "numeric" : "decimal";
        input.id = `f-${parameter.key}`;
        input.value = value ?? 0;
        if (parameter.min != null) input.min = parameter.min;
        if (parameter.max != null) input.max = parameter.max;
        input.step = step;

        const clamp = (n) => {
            let next = n;
            if (parameter.min != null) next = Math.max(parameter.min, next);
            if (parameter.max != null) next = Math.min(parameter.max, next);
            return type === "INT" ? Math.round(next) : next;
        };
        const bump = (delta) => {
            const current = Number.parseFloat(input.value);
            const base = Number.isFinite(current) ? current : 0;
            const next = clamp(base + delta * step);
            input.value = next;
            commit(next);
        };

        const minus = document.createElement("button");
        minus.type = "button"; minus.textContent = "−";
        minus.addEventListener("click", () => bump(-1));
        const plus = document.createElement("button");
        plus.type = "button"; plus.textContent = "+";
        plus.addEventListener("click", () => bump(1));

        input.addEventListener("input", () => {
            const parsed = Number.parseFloat(input.value);
            if (Number.isFinite(parsed)) commit(coerce(parameter, parsed));
        });

        if (isSeedParameter(parameter)) {
            // A seed is a 15 digit number: stepping it by one is meaningless,
            // and the extra buttons squeeze the value out of the field on a
            // narrow phone. One dice button replaces both.
            const dice = document.createElement("button");
            dice.type = "button";
            dice.className = "dice-btn";
            dice.textContent = "⚄";
            dice.title = "随机种子";
            dice.setAttribute("aria-label", "随机种子");
            dice.addEventListener("click", () => {
                const next = randomSeed(parameter);
                input.value = next;
                commit(next);
            });
            stepper.append(input, dice);
        } else {
            stepper.append(minus, input, plus);
        }

        wrap.appendChild(stepper);
        return wrap;
    }

    const multiline = parameter.multiline || String(value ?? "").length > 60;
    const input = document.createElement(multiline ? "textarea" : "input");
    if (multiline) {
        input.rows = 5;
    } else {
        input.type = "text";
    }
    input.id = `f-${parameter.key}`;
    input.value = value ?? "";
    input.addEventListener("input", () => commit(input.value));
    // Hold for 2s to edit this text full screen; the corner button is the
    // discoverable way to do the same thing.
    attachLongPress(input, parameter);
    wrap.appendChild(textWrapWithExpand(input, parameter));
    return wrap;
}

/** Does this parameter hold a generation seed? */
function isSeedParameter(parameter) {
    const type = String(parameter.type || "").toUpperCase();
    if (type !== "INT") return false;
    const name = String(parameter.name || "");
    const label = String(parameter.label || "");
    return /^(seed|noise_seed)$/i.test(name) || /种子/.test(label);
}

/** A fresh seed, honouring the field's declared range when it has one. */
function randomSeed(parameter) {
    // ComfyUI declares seeds up to 2^64-1, but a JS number only stays exact up
    // to 2^53 and its default range is 2^50. Staying in that band keeps the
    // value exact through JSON.
    const CEILING = 1125899906842624;
    const lo = Number.isFinite(parameter.min) ? Math.ceil(parameter.min) : 0;
    let hi = Number.isFinite(parameter.max) ? Math.floor(parameter.max) : CEILING;
    hi = Math.min(hi, Math.max(lo + 1, CEILING));
    return lo + Math.floor(Math.random() * (hi - lo));
}

/** Wrap a text control so it carries a fullscreen-editor affordance. */
function textWrapWithExpand(input, parameter) {
    const wrap = document.createElement("div");
    wrap.className = "text-wrap";
    const expand = document.createElement("button");
    expand.type = "button";
    expand.className = "expand-btn";
    expand.textContent = "⤢";
    expand.title = "全屏编辑";
    expand.setAttribute("aria-label", "全屏编辑");
    expand.addEventListener("click", () => openEditor(parameter, input));
    wrap.append(input, expand);
    return wrap;
}

/* ---------------- media picker ---------------- */
/**
 * Picker for a media input: choose from files already in ComfyUI's input
 * directory, or upload a new one from the phone.
 *
 * The value written back is the file name (ComfyUI loaders accept nothing
 * else). For QQ-多媒体加载 the list is sent and the backend encodes it into
 * that node's JSON state.
 */
const MEDIA_LABELS = { image: "图片", video: "视频", audio: "音频" };
const MEDIA_ACCEPT = {
    image: "image/*",
    video: "video/*",
    audio: "audio/*",
};

function mediaField(parameter, value, commit) {
    const kind = parameter.media;
    const multiple = Boolean(parameter.multiple);
    const box = document.createElement("div");
    box.className = "media";

    const current = multiple
        ? (Array.isArray(value) ? value : [])
        : (value ? [value] : []);

    const thumbs = document.createElement("div");
    thumbs.className = "media-thumbs";
    const actions = document.createElement("div");
    actions.className = "media-actions";

    const render = (names) => {
        thumbs.replaceChildren();
        if (!names.length) {
            const empty = document.createElement("div");
            empty.className = "media-empty";
            empty.textContent = `未选择${MEDIA_LABELS[kind] || "媒体"}`;
            thumbs.appendChild(empty);
            return;
        }
        for (const name of names) {
            const item = document.createElement("div");
            item.className = "media-item";
            if (kind === "image") {
                const img = document.createElement("img");
                img.src = mediaSrc(name);
                img.loading = "lazy";
                img.alt = name;
                item.appendChild(img);
            } else if (kind === "video") {
                const video = document.createElement("video");
                video.src = mediaSrc(name);
                video.muted = true;
                video.playsInline = true;
                video.preload = "metadata";
                item.appendChild(video);
            } else {
                const icon = document.createElement("div");
                icon.className = "media-audio";
                icon.textContent = "♪";
                item.appendChild(icon);
            }
            const caption = document.createElement("span");
            caption.textContent = baseName(name);
            item.appendChild(caption);
            if (multiple) {
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "media-remove";
                remove.textContent = "×";
                remove.setAttribute("aria-label", `移除 ${baseName(name)}`);
                remove.addEventListener("click", () => {
                    const next = current.filter((entry) => entry !== name);
                    current.length = 0;
                    current.push(...next);
                    commit(multiple ? [...current] : (current[0] ?? ""));
                    render(current);
                });
                item.appendChild(remove);
            }
            thumbs.appendChild(item);
        }
    };

    const pickExisting = async () => {
        toast("读取可用媒体…");
        try {
            const data = await fetchJson(`/qq_mobile/media?kind=${encodeURIComponent(kind)}`);
            const files = (data.files || []).map((entry) => entry.name);
            if (!files.length) {
                toast("input 目录里没有可用的" + (MEDIA_LABELS[kind] || "媒体"));
                return;
            }
            chooseFromList(files, multiple, (chosen) => {
                if (multiple) {
                    current.length = 0;
                    current.push(...chosen);
                    commit([...current]);
                } else {
                    current.length = 0;
                    current.push(chosen[0]);
                    commit(chosen[0]);
                }
                render(current);
            });
        } catch (error) {
            toast(`读取失败：${error.message}`);
        }
    };

    const upload = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = MEDIA_ACCEPT[kind] || "*/*";
        input.multiple = multiple;
        input.style.display = "none";
        input.addEventListener("change", async () => {
            const files = [...(input.files || [])];
            if (!files.length) return;
            for (const file of files) {
                try {
                    const name = await uploadMedia(file);
                    if (!name) continue;
                    if (multiple) {
                        if (!current.includes(name)) current.push(name);
                    } else {
                        current.length = 0;
                        current.push(name);
                    }
                } catch (error) {
                    toast(`上传失败 ${file.name}：${error.message}`);
                }
            }
            commit(multiple ? [...current] : (current[0] ?? ""));
            render(current);
        });
        document.body.appendChild(input);
        input.click();
        setTimeout(() => input.remove(), 60000);
    };

    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "media-btn";
    pick.textContent = multiple ? "选择已有" : "选择文件";
    pick.addEventListener("click", pickExisting);

    const up = document.createElement("button");
    up.type = "button";
    up.className = "media-btn primary";
    up.textContent = "上传";
    up.addEventListener("click", upload);

    actions.append(pick, up);
    render(current);
    box.append(thumbs, actions);
    return box;
}

function baseName(name) {
    const text = String(name || "");
    const index = text.lastIndexOf("/");
    return index === -1 ? text : text.slice(index + 1);
}

/** URL that serves one input-directory file for preview. */
function mediaSrc(name) {
    const params = new URLSearchParams({
        filename: name,
        subfolder: "",
        type: "input",
    });
    return `${basePath()}/view?${params.toString()}`;
}

/** Upload one file; resolves to the name ComfyUI stored it under. */
async function uploadMedia(file) {
    const form = new FormData();
    form.append("image", file, file.name);
    form.append("overwrite", "true");
    const data = await fetchJson("/qq_mobile/upload", { method: "POST", body: form });
    if (!data?.name) throw new Error("服务器没有返回文件名");
    return data.subfolder ? `${data.subfolder}/${data.name}` : data.name;
}

/** Simple modal list for choosing from files already on the server. */
function chooseFromList(files, multiple, onPick) {
    const overlay = document.createElement("div");
    overlay.className = "picker";
    const sheet = document.createElement("div");
    sheet.className = "picker-sheet";

    const head = document.createElement("div");
    head.className = "picker-head";
    head.textContent = multiple ? "选择媒体（可多选）" : "选择媒体";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "picker-close";
    close.textContent = "×";
    close.addEventListener("click", () => overlay.remove());
    head.appendChild(close);

    const list = document.createElement("div");
    list.className = "picker-list";
    const selected = new Set();
    for (const name of files) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "picker-row";
        row.textContent = name;
        row.addEventListener("click", () => {
            if (!multiple) {
                onPick([name]);
                overlay.remove();
                return;
            }
            if (selected.has(name)) {
                selected.delete(name);
                row.classList.remove("on");
            } else {
                selected.add(name);
                row.classList.add("on");
            }
            confirm.disabled = selected.size === 0;
        });
        list.appendChild(row);
    }

    const foot = document.createElement("div");
    foot.className = "picker-foot";
    const confirm = document.createElement("button");
    confirm.type = "button";
    confirm.className = "media-btn primary";
    confirm.textContent = "确定";
    confirm.disabled = true;
    confirm.addEventListener("click", () => {
        onPick([...selected]);
        overlay.remove();
    });
    foot.appendChild(confirm);

    sheet.append(head, list, foot);
    overlay.appendChild(sheet);
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
}

/* ---------------- fullscreen text editor ---------------- */
/**
 * Long-press a text field to open it full screen.
 *
 * On a phone the inline box is cramped and the on-screen keyboard covers most
 * of the screen, so editing a long prompt in place is painful. Holding the
 * field for 2s promotes it to a full-screen editor instead of opening yet
 * another page or tab.
 */
const LONG_PRESS_MS = 2000;
/** Movement beyond this cancels the press, so scrolling never triggers it. */
const LONG_PRESS_SLOP = 12;

const editor = {
    key: null,
    original: "",
    openedAt: 0,
    timer: null,
    startX: 0,
    startY: 0,
    target: null,
};

function isEditorOpen() {
    return !el("editor").hidden;
}

function openEditor(parameter, sourceInput) {
    editor.key = parameter.key;
    editor.original = sourceInput.value;
    editor.openedAt = Date.now();
    editor.target = sourceInput;
    el("editorTitle").textContent = parameter.label || parameter.name || "编辑";
    const text = el("editorText");
    text.value = sourceInput.value;
    el("editor").hidden = false;
    el("editor").setAttribute("aria-hidden", "false");
    updateEditorCount();
    // Focus after the panel is visible, otherwise iOS refuses to show the
    // keyboard for a hidden element.
    requestAnimationFrame(() => {
        text.focus();
        text.setSelectionRange(text.value.length, text.value.length);
    });
}

function updateEditorCount() {
    const value = el("editorText").value;
    el("editorCount").textContent = `${value.length} 字`;
}

function closeEditor(commit) {
    if (!isEditorOpen()) return;
    const text = el("editorText");
    if (commit && editor.target) {
        editor.target.value = text.value;
        editor.target.dispatchEvent(new Event("input", { bubbles: true }));
    }
    el("editor").hidden = true;
    el("editor").setAttribute("aria-hidden", "true");
    // The click that closes the panel can otherwise land on a field below it.
    editor.openedAt = Date.now();
    editor.key = null;
    editor.target = null;
    el("editorText").blur();
}

/**
 * Wire long-press handling onto a text control.
 *
 * Pointer events cover mouse and touch alike. `touchstart` is also bound so a
 * long press still works while the page's scroll surface is intercepting
 * pointer events.
 */
function attachLongPress(input, parameter) {
    input.classList.add("longpressable");

    const clear = () => {
        clearTimeout(editor.timer);
        editor.timer = null;
        input.classList.remove("pressing");
    };

    const start = (event) => {
        if (isEditorOpen()) return;
        // Ignore secondary mouse buttons.
        if (event.pointerType === "mouse" && event.button !== 0) return;
        editor.startX = event.clientX ?? 0;
        editor.startY = event.clientY ?? 0;
        clearTimeout(editor.timer);
        editor.timer = setTimeout(() => {
            editor.timer = null;
            input.classList.remove("pressing");
            // Suppress the click/synthetic tap that would otherwise follow.
            editor.openedAt = Date.now();
            openEditor(parameter, input);
        }, LONG_PRESS_MS);
        input.classList.add("pressing");
    };

    const move = (event) => {
        if (!editor.timer) return;
        const dx = Math.abs((event.clientX ?? 0) - editor.startX);
        const dy = Math.abs((event.clientY ?? 0) - editor.startY);
        if (dx > LONG_PRESS_SLOP || dy > LONG_PRESS_SLOP) clear();
    };

    input.addEventListener("pointerdown", start);
    input.addEventListener("pointermove", move);
    input.addEventListener("pointerup", clear);
    input.addEventListener("pointercancel", clear);
    input.addEventListener("pointerleave", clear);
    input.addEventListener("touchstart", start, { passive: true });
    input.addEventListener("touchmove", move, { passive: true });
    input.addEventListener("touchend", clear);
    input.addEventListener("touchcancel", clear);
    input.addEventListener("contextmenu", (event) => {
        // A long press on mobile fires the context menu; the editor replaces it.
        if (Date.now() - editor.openedAt < 800) event.preventDefault();
    });
}

/** Model file pickers and sampler internals are rarely touched from a phone.
 * They go into a collapsed group so the first screen stays focused on the
 * prompt and the numbers that actually change per image.
 *
 * Membership is decided by name and by what the options look like, not by the
 * widget type. A dropdown the user promoted (任务模式 / 宽高比 / 增强方式) is a
 * primary choice and must stay visible, while a model file picker is noise
 * even though both are combos.
 */
const ADVANCED_NAMES = new Set([
    "unet_name", "clip_name", "vae_name", "ckpt_name", "lora_name",
    "sampler_name", "scheduler", "cfg", "denoise", "batch_size",
    "type", "device", "weight_dtype", "filename_prefix",
]);

const ADVANCED_LABELS = /模型|采样器|调度器|精度|设备/;
const MODEL_FILE_RE = /\.(safetensors|ckpt|pt|pth|bin|gguf)$/i;

const isAdvanced = (parameter) => {
    if (ADVANCED_NAMES.has(String(parameter.name || ""))) return true;
    if (ADVANCED_LABELS.test(String(parameter.label || ""))) return true;
    const type = String(parameter.type || "").toUpperCase();
    if (type === "COMBO" && parameter.options?.length) {
        // A combo whose options are file names is a model picker.
        return parameter.options.some(
            (option) => typeof option === "string" && MODEL_FILE_RE.test(option),
        );
    }
    return false;
};

/**
 * Render the form.
 *
 * A pipeline may hold several subgraph instances (often of the same
 * definition), whose promoted inputs share names. Each instance therefore
 * becomes its own titled section with its own collapsed "模型与采样" block,
 * so two "prompt" fields can never be confused for one another.
 */
function render(parameters) {
    const form = el("form");
    form.replaceChildren();
    const stored = loadStoredValues();
    const seen = new Set();

    // Preserve first-seen order of group names.
    const order = [];
    const sections = new Map();
    for (const parameter of parameters) {
        if (parameter.hidden) continue;
        seen.add(parameter.key);
        if (stored[parameter.key] !== undefined) {
            state.values[parameter.key] = stored[parameter.key];
        } else if (state.values[parameter.key] === undefined) {
            state.values[parameter.key] = parameter.value;
        }
        const name = String(parameter.group ?? "");
        if (!sections.has(name)) {
            sections.set(name, { primary: [], advanced: [] });
            order.push(name);
        }
        const bucket = sections.get(name);
        (isAdvanced(parameter) ? bucket.advanced : bucket.primary).push(parameter);
    }

    const named = order.filter((name) => name).length;
    const showHeadings = order.length > 1;

    for (const name of order) {
        const { primary, advanced } = sections.get(name);
        if (showHeadings) form.appendChild(sectionHeading(name, named > 0));
        for (const parameter of primary) form.appendChild(fieldFor(parameter));
        if (advanced.length) {
            form.appendChild(advancedBlock(advanced));
        }
    }

    // Drop remembered values for parameters that no longer exist.
    for (const key of Object.keys(state.values)) {
        if (!seen.has(key)) delete state.values[key];
    }
    storeValues();

    if (!parameters.length) {
        form.innerHTML = `<div class="empty"><strong>这个工作流没有可调参数</strong>
            在 ComfyUI 里把子图的输入提升为参数后，重新点击「手机界面」。</div>`;
        return;
    }

    // Values are remembered per workflow, so offer a way back to the values
    // the workflow itself carries.
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "reset-btn";
    reset.textContent = "恢复默认值";
    reset.addEventListener("click", resetToDefaults);
    form.appendChild(reset);
}

/**
 * Forget every stored override and re-render from the template's values.
 *
 * The template holds the values the workflow had when it was prepared, which
 * is the closest thing to "defaults" the phone can see.
 */
function resetToDefaults() {
    state.values = {};
    try {
        localStorage.removeItem(`${STORAGE_KEY}:${state.workflow}`);
    } catch { /* storage blocked: re-render alone still resets the form */ }
    render(state.parameters);
    toast("已恢复默认值");
}

/** Heading for one subgraph instance's parameter section. */
function sectionHeading(name, subgraphs) {
    const heading = document.createElement("div");
    heading.className = "section-head";
    const title = document.createElement("span");
    title.className = "section-title";
    title.textContent = name || (subgraphs ? "未命名子图" : "参数");
    heading.appendChild(title);
    return heading;
}

/** Collapsed block of rarely-touched model and sampler settings. */
function advancedBlock(parameters) {
    const group = document.createElement("details");
    group.className = "group";
    const summary = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = "模型与采样";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = String(parameters.length);
    summary.append(label, count);
    const body = document.createElement("div");
    body.className = "body";
    for (const parameter of parameters) body.appendChild(fieldFor(parameter));
    group.append(summary, body);
    return group;
}

/* ---------------- results ---------------- */
function viewUrl(item) {
    const params = new URLSearchParams({
        filename: item.filename || "",
        subfolder: item.subfolder || "",
        type: item.type || "output",
    });
    if (item.format) params.set("format", item.format);
    // Prefix the mount path: behind a reverse proxy serving ComfyUI under a
    // subpath, a bare "/view" points outside the mount and 404s.
    return `${basePath()}/view?${params.toString()}`;
}

function renderResults(media) {
    const host = el("results");
    const label = el("resultsLabel");
    host.replaceChildren();
    label.hidden = !media.length;
    for (const item of media) {
        const card = document.createElement("div");
        card.className = "result-card";

        if (item.kind === "text") {
            const pre = document.createElement("pre");
            pre.textContent = item.text;
            card.appendChild(pre);
        } else if (item.kind === "audio") {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = viewUrl(item);
            card.appendChild(audio);
        } else if (item.kind === "videos" || /\.(mp4|webm|mov)$/i.test(item.filename || "")) {
            const video = document.createElement("video");
            video.controls = true;
            video.playsInline = true;
            video.src = viewUrl(item);
            card.appendChild(video);
        } else {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = viewUrl(item);
            img.alt = item.filename || "结果";
            card.appendChild(img);
        }

        const meta = document.createElement("div");
        meta.className = "result-meta";
        const size = document.createElement("span");
        const dims = item.metadata || {};
        size.textContent = dims.width && dims.height ? `${dims.width} × ${dims.height}` : "";

        if (item.filename) {
            const name = document.createElement("span");
            name.textContent = item.filename;
            name.style.overflow = "hidden";
            name.style.textOverflow = "ellipsis";
            name.style.whiteSpace = "nowrap";
            name.style.flex = "1";
            name.style.minWidth = "0";
            const link = document.createElement("a");
            link.href = viewUrl(item);
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "查看原图";
            meta.append(size, name, link);
        } else {
            meta.append(size);
        }
        card.appendChild(meta);
        host.appendChild(card);
    }

    if (media.length) {
        // The result is the point of the screen: bring the first card fully
        // into view instead of leaving it below a long parameter list.
        const first = host.firstElementChild;
        const scroll = () => {
            const target = first ?? label;
            const box = target?.getBoundingClientRect?.();
            const mainEl = el("main");
            if (!box || !mainEl) return;
            const footer = document.querySelector("footer");
            // The footer is fixed, so it covers the bottom of the scroll area:
            // treat its top edge as the real bottom of the visible viewport.
            const visibleBottom = footer
                ? footer.getBoundingClientRect().top
                : window.innerHeight;
            if (box.top >= 0 && box.bottom <= visibleBottom) return;
            mainEl.scrollTop += box.top - Math.max(0, (visibleBottom - box.height) / 2);
        };
        requestAnimationFrame(scroll);
        // Images change height once loaded, so re-anchor when that happens.
        host.querySelectorAll("img, video").forEach((node) => {
            if (node.complete) return;
            node.addEventListener("load", scroll, { once: true });
            node.addEventListener("loadedmetadata", scroll, { once: true });
        });
    }
    updateResultChip();
}

/**
 * Offer a way back to the result once it has scrolled out of view.
 *
 * A finished image sits below a long parameter list, so tweaking values and
 * returning to the picture means a lot of scrolling on a phone.
 */
function updateResultChip() {
    const chip = el("resultChip");
    const first = el("results").firstElementChild;
    if (!first || el("footer").hidden) {
        chip.hidden = true;
        return;
    }
    const box = first.getBoundingClientRect();
    const footerTop = el("footer").getBoundingClientRect().top;
    // Hide it once the result is on screen, and while a job is still running.
    chip.hidden = state.polling || (box.bottom > 0 && box.top < footerTop);
}

/* ---------------- network ---------------- */
const basePath = () => {
    const { pathname } = window.location;
    const trimmed = pathname.endsWith("/") ? pathname.slice(0, -1) : pathname;
    return trimmed.endsWith("/qq_mobile") ? trimmed.slice(0, -11) : "";
};

async function fetchJson(path, options) {
    const response = await fetch(`${basePath()}${path}`, options);
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }
    if (!response.ok) {
        const message = data?.error?.message || data?.error || text.slice(0, 160);
        throw new Error(typeof message === "string" ? message : `HTTP ${response.status}`);
    }
    return data;
}

/**
 * Reload the form when the browser-side state changes.
 *
 * The canvas can change while the phone page is open — most notably a
 * QQ-多值输入 switch that flips a bypass rule and enables a media loader. The
 * extension re-pushes the template when that happens, so the phone only has to
 * notice the new revision and re-render. Values already typed are preserved
 * per field key by the form itself.
 */
const TEMPLATE_POLL_MS = 3000;
let templateRevision = null;
let templateTimer = null;

async function watchTemplate() {
    clearTimeout(templateTimer);
    templateTimer = setTimeout(watchTemplate, TEMPLATE_POLL_MS);
    if (state.polling) return;
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        if (templateRevision === null) {
            templateRevision = data.updated;
            return;
        }
        if (data.updated !== templateRevision) {
            templateRevision = data.updated;
            const kept = { ...state.values };
            state.parameters = data.parameters || [];
            el("title").textContent = data.title || "手机界面";
            document.title = data.title || "手机界面";
            render(state.parameters);
            // Restore what the user had typed for keys that still exist.
            for (const [key, value] of Object.entries(kept)) {
                if (key in state.values) state.values[key] = value;
            }
            toast("参数已同步");
        }
    } catch {
        // A missing template is handled by the initial load; stay quiet here.
    }
}

async function loadTemplate() {
    setStatus(null);
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        state.workflow = data.workflow;
        state.parameters = data.parameters || [];
        templateRevision = data.updated;
        el("title").textContent = data.title || "手机界面";
        // Keep the browser tab in sync with the pipeline name.
        document.title = data.title || "手机界面";
        // Only meaningful once a pipeline is loaded.
        el("switch").hidden = false;
        el("generate").disabled = false;
        setFooterVisible(true);
        render(state.parameters);
        watchTemplate();
        return true;
    } catch (error) {
        setFooterVisible(false);
        el("form").innerHTML = `<div class="empty"><strong>还没有模板</strong>
            回到 ComfyUI 打开工作流，点顶部「手机界面」按钮即可生成。<br>
            <span style="opacity:.6">${String(error.message || error)}</span></div>`;
        return false;
    }
}

function setBusy(busy, label) {
    const button = el("generate");
    button.disabled = busy;
    button.innerHTML = busy
        ? '<span class="spinner"></span><span>生成中</span>'
        : `<span>${label || "生成"}</span>`;
    el("cancel").hidden = !busy;
}

async function generate() {
    if (state.polling) return;
    setBusy(true);
    setStatus("running", "已提交，等待开始…");
    setProgress(null);
    renderResults([]);

    try {
        const data = await fetchJson("/qq_mobile/prompt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ workflow: state.workflow, values: state.values }),
        });
        state.promptId = data.prompt_id || "";
        if (data.warnings?.length) toast(data.warnings.join("；"));
        poll();
    } catch (error) {
        setBusy(false, "重试");
        setStatus("error", `提交失败：${error.message}`);
        setProgress(null);
    }
}

function stopPolling() {
    state.polling = false;
    clearTimeout(state.timer);
    setBusy(false, "再生成一张");
}

async function poll() {
    state.polling = true;
    try {
        const query = `?prompt_id=${encodeURIComponent(state.promptId)}`;
        const data = await fetchJson(`/qq_mobile/jobs${query}`);

        if (data.status === "in_progress") {
            setStatus("running", "正在生成…");
            setProgress(null);
        } else if (data.status === "pending") {
            const position = Number.isFinite(data.position) ? data.position + 1 : null;
            setStatus("running", position ? `排队中，前面还有 ${position} 个任务` : "排队中…");
            setProgress(null);
        } else if (data.status === "settling") {
            // Submitted, but ComfyUI has not listed it yet.
            setStatus("running", "已提交，等待开始…");
        } else if (data.media?.length) {
            setStatus("done", "完成");
            // No progress bar once finished: a full blue bar reads as
            // "still loading" next to a completed result.
            setProgress(null);
            renderResults(data.media);
            stopPolling();
            return;
        } else if (data.status === "failed") {
            const detail = String(data.execution_error || "").slice(0, 200);
            setStatus("error", detail ? `执行失败：${detail}` : "执行失败");
            setProgress(null);
            stopPolling();
            return;
        } else if (data.status === "cancelled") {
            setStatus("error", "已取消");
            setProgress(null);
            stopPolling();
            return;
        } else if (data.status === "completed") {
            setStatus("done", "完成，但没有输出媒体");
            setProgress(null);
            stopPolling();
            return;
        } else if (data.status === "lost") {
            setStatus("error", "任务已不在队列中，可能已取消或执行失败");
            setProgress(null);
            stopPolling();
            return;
        } else {
            setStatus("running", "收尾中…");
        }
    } catch (error) {
        setStatus("error", `查询失败：${error.message}`);
    }
    state.timer = setTimeout(poll, POLL_MS);
}

async function cancel() {
    try {
        await fetchJson("/qq_mobile/interrupt", { method: "POST" });
        toast("已请求取消");
    } catch (error) {
        toast(`取消失败：${error.message}`);
    }
    stopPolling();
    setStatus("error", "已取消");
    setProgress(null);
}

/* ---------------- pipeline picker ---------------- */
/** Last few characters of a workflow key, to separate identical titles. */
function shortWorkflowId(workflow) {
    const text = String(workflow || "");
    const tail = text.split(/[\\/]/).pop() || text;
    const id = tail.replace(/^unsaved-/, "");
    return id.slice(-4);
}

/** "刚刚" / "3 分钟前" / "2 天前", for the picker's secondary line. */
function relativeTime(stamp) {
    const seconds = Math.floor(Date.now() / 1000 - Number(stamp || 0));
    if (!Number.isFinite(seconds) || seconds < 0) return "";
    if (seconds < 60) return "刚刚";
    if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
    if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} 天前`;
    return `${Math.floor(seconds / (86400 * 30))} 个月前`;
}

/**
 * List the prepared pipelines so one can be chosen on the phone.
 *
 * Shown when the page was opened without a specific workflow, or when the user
 * asks to switch. Tapping a row loads that pipeline's form.
 */
async function showPipelinePicker() {
    const host = el("form");
    const results = el("results");
    results.replaceChildren();
    el("resultsLabel").hidden = true;
    el("generate").disabled = true;
    el("switch").hidden = true;
    // The footer only holds actions for a loaded pipeline, and the refresh
    // button would silently open the newest one from here.
    setFooterVisible(false);
    el("title").textContent = "选择流水线";
    document.title = "选择流水线";
    setStatus(null);

    let templates = [];
    let files = [];
    try {
        // The library listing is what makes every saved pipeline visible; the
        // template list only tells us which of them are ready to run.
        const [stateData, libData] = await Promise.all([
            fetchJson("/qq_mobile/state").catch(() => ({ templates: [] })),
            fetchJson("/qq_mobile/workflows").catch(() => ({ workflows: [] })),
        ]);
        templates = stateData.templates || [];
        files = libData.workflows || [];
    } catch (error) {
        host.innerHTML = `<div class="empty"><strong>读取流水线失败</strong>
            ${String(error.message || error)}</div>`;
        return;
    }

    // Merge: every saved workflow gets a row. Ones with a template are ready;
    // the rest are listed as a reminder that they exist but need a pass
    // through the editor first.
    const byKey = new Map(templates.map((item) => [item.workflow, item]));
    const rows = [];
    for (const file of files) {
        if (!file.id) continue;
        const key = `unsaved-${file.id}`;
        const template = byKey.get(key);
        byKey.delete(key);
        rows.push({
            key,
            title: template?.title || file.name,
            folder: file.folder || template?.folder || "",
            name: file.name,
            parameters: template?.parameters || 0,
            ready: Boolean(template),
            updated: template?.updated || file.updated || 0,
        });
    }
    // Templates with no file behind them (a canvas that was never saved).
    for (const template of byKey.values()) {
        rows.push({
            key: template.workflow,
            title: template.title || template.workflow,
            folder: template.folder || "",
            name: template.title || template.workflow,
            parameters: template.parameters || 0,
            ready: true,
            updated: template.updated || 0,
        });
    }

    if (!rows.length) {
        host.innerHTML = `<div class="empty"><strong>还没有可用的流水线</strong>
            在 ComfyUI 里打开工作流，点顶部「手机界面」按钮即可生成。</div>`;
        return;
    }

    host.replaceChildren();
    // Group by the folder the workflow lives in, the way the editor sidebar
    // does; root-level files come first.
    const groups = new Map();
    for (const row of rows) {
        if (!groups.has(row.folder)) groups.set(row.folder, []);
        groups.get(row.folder).push(row);
    }
    const folderOrder = [...groups.keys()].sort((a, b) => {
        if (a === b) return 0;
        if (!a) return -1;
        if (!b) return 1;
        return a.localeCompare(b, "zh");
    });

    // Duplicate titles (two "Unsaved Workflow") get a short id suffix.
    const titleCounts = new Map();
    for (const row of rows) {
        titleCounts.set(row.title, (titleCounts.get(row.title) || 0) + 1);
    }

    for (const folder of folderOrder) {
        const list = document.createElement("div");
        list.className = "pipeline-list";
        if (folderOrder.length > 1) {
            const head = document.createElement("div");
            head.className = "folder-head";
            head.textContent = folder || "未分组";
            list.appendChild(head);
        }
        const items = groups.get(folder).sort((a, b) => {
            if (a.ready !== b.ready) return a.ready ? -1 : 1;
            return (b.updated || 0) - (a.updated || 0);
        });
        for (const item of items) {
            list.appendChild(pipelineRow(item, titleCounts));
        }
        host.appendChild(list);
    }
}

/** One row in the pipeline picker. */
function pipelineRow(item, titleCounts) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "pipeline-row" + (item.ready ? "" : " is-pending");

    const main = document.createElement("div");
    main.className = "pipeline-main";
    const name = document.createElement("span");
    name.className = "pipeline-name";
    name.textContent = (titleCounts.get(item.title) || 0) > 1
        ? `${item.title} · ${shortWorkflowId(item.key)}`
        : item.title;
    const meta = document.createElement("span");
    meta.className = "pipeline-meta";
    meta.textContent = item.ready
        ? `${item.parameters} 个参数 · ${relativeTime(item.updated)}`
        : "待准备";
    main.append(name, meta);

    const arrow = document.createElement("span");
    arrow.className = "pipeline-arrow";
    arrow.textContent = item.ready ? "›" : "·";

    row.append(main, arrow);
    row.addEventListener("click", () => {
        if (!item.ready) {
            // Neutral wording: some of these have no phone-usable inputs at
            // all, so promising that opening them will help would be wrong.
            toast(`「${item.name}」还没有准备，请在 ComfyUI 里点一次「手机界面」`);
            return;
        }
        state.workflow = item.key;
        const url = new URL(window.location.href);
        url.searchParams.set("workflow", item.key);
        window.history.replaceState({}, "", url);
        loadTemplate();
    });
    return row;
}

/* ---------------- boot ---------------- */
el("generate").addEventListener("click", generate);
el("cancel").addEventListener("click", cancel);
el("reload").addEventListener("click", async () => {
    const ok = await loadTemplate();
    toast(ok ? "参数已刷新" : "刷新失败");
});

/* Back to the ComfyUI graph. The toolbar button navigates here in the same
 * tab, so history.back() returns to the editor; opening the phone page
 * directly has nothing to go back to, so fall back to the root URL. */
el("back").addEventListener("click", () => {
    if (window.history.length > 1 && document.referrer) {
        window.history.back();
        return;
    }
    const base = basePath();
    window.location.assign(`${base}/`);
});

/* Switch pipelines without leaving the page. */
el("switch").addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.delete("workflow");
    window.history.replaceState({}, "", url);
    state.workflow = "";
    clearTimeout(templateTimer);
    showPipelinePicker();
});

/* Fullscreen editor wiring. */
el("editorText").addEventListener("input", updateEditorCount);
el("editorDone").addEventListener("click", () => closeEditor(true));
el("editorRevert").addEventListener("click", () => {
    el("editorText").value = editor.original;
    updateEditorCount();
});
document.addEventListener("keydown", (event) => {
    if (!isEditorOpen()) return;
    if (event.key === "Escape") {
        event.preventDefault();
        closeEditor(false);
    } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        closeEditor(true);
    }
});

/* Keep the "back to result" chip in step with the scroll position. */
el("main").addEventListener("scroll", updateResultChip, { passive: true });
el("resultChip").addEventListener("click", () => {
    const first = el("results")?.firstElementChild;
    if (!first) return;
    const mainEl = el("main");
    mainEl.scrollTo({ top: mainEl.scrollTop + first.getBoundingClientRect().top - 12,
                      behavior: "smooth" });
    el("resultChip").hidden = true;
});

/* Open the pipeline picker: without a workflow in the URL the page starts
 * there, so a phone can choose which pipeline to run instead of being locked
 * to whichever one the editor happened to have open. */
const initialWorkflow = new URLSearchParams(location.search).get("workflow");
if (initialWorkflow) {
    state.workflow = initialWorkflow;
    loadTemplate();
} else {
    showPipelinePicker();
}</script>
</body>
</html>
