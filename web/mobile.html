    return `${basePath()}/qq_mobile/thumb?${params.toString()}`;
}

/** Upload one file; resolves to the name ComfyUI stored it under. */
async function uploadMedia(file) {
    const form = new FormData();
    form.append("image", file, file.name);
    form.append("overwrite", "true");
    const data = await fetchJson("/qq_mobile/upload", { method: "POST", body: form });
    if (!data?.name) throw new Error("服务器没有返回文件名");
    return data.subfolder ? `${data.subfolder}/${data.name}` : data.name;
}

/**
 * Pick media that already exists on the server.
 *
 * Rows carry a thumbnail, because names like "clip-17c0" say nothing about the
 * picture. The first tap selects and shows the preview, a second tap on the
 * same row drops it, several can be held at once, and nothing is handed back
 * until 确定 — 取消 or the backdrop leaves the field untouched.
 *
 * The list can switch between ComfyUI's input and output folders, sort by time
 * either way, and (for outputs) read the prompt that produced an image with one
 * tap. That prompt button is separate from the selection: tapping it never
 * ticks the row.
 */
function chooseFromList(loadFiles, multiple, onPick, options = {}) {
    const kind = options.kind || "image";
    const overlay = document.createElement("div");
    overlay.className = "picker";
    const sheet = document.createElement("div");
    sheet.className = "picker-sheet media-sheet";

    const state = {
        source: options.source === "output" ? "output" : "input",
        newestFirst: true,
        files: [],
    };

    const head = document.createElement("div");
    head.className = "picker-head";
    const heading = document.createElement("span");
    heading.textContent = multiple ? "选择媒体（可多选）" : "选择媒体";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "picker-close";
    close.innerHTML = iconSvg("close", 18);
    close.addEventListener("click", () => overlay.remove());
    head.append(heading, close);

    const tabs = document.createElement("div");
    tabs.className = "media-tabs";
    const tabButtons = ["input", "output"].map((source) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "media-tab";
        button.dataset.source = source;
        button.textContent = source === "output" ? "输出" : "输入";
        button.addEventListener("click", () => {
            if (state.source === source) return;
            state.source = source;
            selected.clear();
            syncTabs();
            syncStrip();
            reload();
        });
        tabs.appendChild(button);
        return button;
    });
    const sort = document.createElement("button");
    sort.type = "button";
    sort.className = "media-sort";
    sort.addEventListener("click", () => {
        state.newestFirst = !state.newestFirst;
        paint();
    });
    tabs.appendChild(sort);

    const strip = document.createElement("div");
    strip.className = "media-strip";
    strip.hidden = true;

    const list = document.createElement("div");
    list.className = "picker-list media-grid";
    const selected = new Set();
    // Rows survive a re-sort, so their pictures are decoded only once.
    const rowCache = new Map();

    // Rows are built for the whole folder but only the ones near the viewport
    // ever get a src. `loading="lazy"` was not enough: it still fetched ~50
    // full-size originals on open, and every re-render fetched them again.
    const viewer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const node = entry.target;
            viewer.unobserve(node);
            const src = node.dataset.src;
            if (src) {
                node.src = src;
                delete node.dataset.src;
            }
        }
    }, { root: list, rootMargin: "250px 0px" });

    const preview = (name, version = 0) => {
        if (kind === "image") {
            const img = document.createElement("img");
            img.alt = name;
            img.dataset.src = thumbUrl(name, state.source, version);
            img.addEventListener("error", () => {
                // A missing or unreadable file: a neutral tile beats a broken
                // image icon.
                img.classList.add("broken");
                img.removeAttribute("src");
            });
            return img;
        }
        if (kind === "video") {
            const video = document.createElement("video");
            video.dataset.src = mediaSrc(name, state.source);
            video.muted = true;
            video.playsInline = true;
            video.preload = "none";
            return video;
        }
        const audio = document.createElement("div");
        audio.className = "media-audio";
        audio.textContent = "♪";
        return audio;
    };

    /** Put a freshly built preview on screen and let the observer fill it in. */
    const watchPreview = (node) => {
        if (!node.dataset || !node.dataset.src) return node;
        viewer.observe(node);
        return node;
    };

    const syncTabs = () => {
        for (const button of tabButtons) {
            button.classList.toggle("on", button.dataset.source === state.source);
        }
        sort.textContent = state.newestFirst ? "最新" : "最早";
        sort.title = "切换时间排序";
        sort.setAttribute("aria-label", "切换时间排序");
    };

    const syncStrip = () => {
        strip.replaceChildren();
        strip.hidden = selected.size === 0;
        for (const name of selected) {
            const chip = document.createElement("div");
            chip.className = "media-chip";
            // The strip is on screen by definition, so its pictures load at once.
            const node = preview(name);
            if (node.dataset && node.dataset.src) {
                node.src = node.dataset.src;
                delete node.dataset.src;
            }
            chip.appendChild(node);
            const caption = document.createElement("span");
            caption.textContent = baseName(name);
            chip.appendChild(caption);
            strip.appendChild(chip);
        }
        confirm.textContent = selected.size
            ? `确定（已选 ${selected.size}）`
            : "确定";
        confirm.disabled = selected.size === 0;
    };

    const readPrompt = async (name, button) => {
        button.classList.add("busy");
        try {
            const query = new URLSearchParams({ filename: name, source: state.source });
            const data = await fetchJson(`/qq_mobile/media-prompt?${query.toString()}`);
            if (!data || !data.prompt) {
                toast("这张图没有保存提示词");
                return;
            }
            await copyText(data.prompt);
            toast("提示词已复制");
        } catch (error) {
            toast(`读取提示词失败：${error.message}`);
        } finally {
            button.classList.remove("busy");
        }
    };

    const paint = () => {
        syncTabs();
        // The rows are reused, so the list is no longer cleared wholesale:
        // whatever `reload()` put there as a placeholder has to go explicitly,
        // or "读取中…" stays above the results forever.
        for (const node of list.querySelectorAll(".picker-empty")) node.remove();
        const files = [...state.files].sort((a, b) => (state.newestFirst
            ? (b.modified || 0) - (a.modified || 0)
            : (a.modified || 0) - (b.modified || 0)));
        if (!files.length) {
            list.replaceChildren();
            const empty = document.createElement("div");
            empty.className = "picker-empty";
            empty.textContent = state.source === "output"
                ? "输出目录里还没有文件"
                : "输入目录里还没有文件";
            list.appendChild(empty);
            return;
        }
        // Rows are reused and moved instead of rebuilt: recreating them on a
        // sort threw away every decoded thumbnail and fetched them all again.
        const keep = new Set(files.map((entry) => entry.name));
        for (const [name, row] of rowCache) {
            if (keep.has(name)) continue;
            viewer.unobserve(row.querySelector("img, video") || row);
            row.remove();
            rowCache.delete(name);
        }
        for (const entry of files) {
            const name = entry.name;
            let row = rowCache.get(name);
            if (!row) {
                row = buildRow(entry);
                rowCache.set(name, row);
            }
            // appendChild moves an existing node to the end, which is exactly
            // the reorder we want and keeps its loaded picture.
            list.appendChild(row);
        }
    };

    const buildRow = (entry) => {
        const name = entry.name;
        const row = document.createElement("div");
        row.className = "media-row" + (selected.has(name) ? " on" : "");
        row.setAttribute("role", "button");
        row.tabIndex = 0;
        row.dataset.name = name;
        row.appendChild(watchPreview(preview(name, entry.modified)));

        const main = document.createElement("div");
        main.className = "media-row-main";
        const caption = document.createElement("span");
        caption.className = "media-row-name";
        caption.textContent = baseName(name);
        const stamp = document.createElement("span");
        stamp.className = "media-row-time";
        stamp.textContent = relativeTime(entry.modified);
        main.append(caption, stamp);
        row.appendChild(main);

        // Only saved outputs carry a prompt, and reading it is its own
        // action: it must never tick the row.
        if (state.source === "output") {
            const prompt = document.createElement("button");
            prompt.type = "button";
            prompt.className = "media-row-prompt";
            prompt.innerHTML = iconSvg("download", 15);
            prompt.title = "复制这张图的提示词";
            prompt.setAttribute("aria-label", "复制提示词");
            prompt.addEventListener("click", (event) => {
                event.stopPropagation();
                readPrompt(name, prompt);
            });
            row.appendChild(prompt);
        }

        const tick = document.createElement("span");
        tick.className = "tick";
        tick.innerHTML = selected.has(name) ? iconSvg("check", 16, 2.2) : "";
        row.appendChild(tick);

        const toggle = () => {
            if (!multiple) {
                selected.clear();
                selected.add(name);
            } else if (selected.has(name)) {
                selected.delete(name);
            } else {
                selected.add(name);
            }
            for (const element of list.querySelectorAll(".media-row")) {
                const path = element.dataset.name;
                const on = selected.has(path);
                element.classList.toggle("on", on);
                element.querySelector(".tick").innerHTML = on
                    ? iconSvg("check", 16, 2.2)
                    : "";
            }
            syncStrip();
        };
        row.addEventListener("click", toggle);
        row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggle();
            }
        });
        return row;
    };

    const reload = async () => {
        list.replaceChildren();
        rowCache.clear();
        const loading = document.createElement("div");
        loading.className = "picker-empty";
        loading.textContent = "读取中…";
        list.appendChild(loading);
        try {
            const data = await loadFiles(state.source);
            state.files = Array.isArray(data && data.files) ? data.files : [];
            paint();
        } catch (error) {
            list.replaceChildren();
            rowCache.clear();
            const failed = document.createElement("div");
            failed.className = "picker-empty";
            failed.textContent = `读取失败：${error.message}`;
            list.appendChild(failed);
        }
    };

    const foot = document.createElement("div");
    foot.className = "picker-foot";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "media-btn";
    cancel.textContent = "取消";
    cancel.addEventListener("click", () => overlay.remove());
    const confirm = document.createElement("button");
    confirm.type = "button";
    confirm.className = "media-btn primary";
    confirm.textContent = "确定";
    confirm.disabled = true;
    confirm.addEventListener("click", async () => {
        const chosen = [...selected];
        if (!chosen.length) return;
        confirm.disabled = true;
        try {
            const names = state.source === "output"
                ? await importOutputs(chosen)
                : chosen;
            onPick(names);
            overlay.remove();
        } catch (error) {
            toast(`导入失败：${error.message}`);
            confirm.disabled = false;
        }
    });
    foot.append(cancel, confirm);

    sheet.append(head, tabs, strip, list, foot);
    overlay.appendChild(sheet);
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
    syncTabs();
    syncStrip();
    reload();
}

/** Copy text, falling back to a hidden textarea (the async API needs HTTPS). */
async function copyText(text) {
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
        }
    } catch {
        /* fall through to the textarea path */
    }
    const area = document.createElement("textarea");
    area.value = text;
    area.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try {
        ok = document.execCommand("copy");
    } catch {
        ok = false;
    }
    area.remove();
    if (!ok) throw new Error("浏览器不允许复制");
    return true;
}

/** Move chosen output files into the input directory so a loader can use them. */
async function importOutputs(names) {
    const out = [];
    for (const name of names) {
        const data = await fetchJson("/qq_mobile/import-media", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: name }),
        });
        if (data && data.name) out.push(data.name);
    }
    return out;
}

/** Split "Qwen2.1\图生图\a.safetensors" into its folder and file name. */
function splitOptionPath(option) {
    const text = String(option ?? "");
    const cut = Math.max(text.lastIndexOf("\\"), text.lastIndexOf("/"));
    if (cut < 0) return { dir: "", name: text };
    return { dir: text.slice(0, cut), name: text.slice(cut + 1) };
}

/** The folder part of a model path, lowercased for comparison. */
function optionFolders(option) {
    const { dir } = splitOptionPath(option);
    return dir.toLowerCase();
}

/**
 * Put the folders that belong to this pipeline first.
 *
 * A LoRA library is organised in folders, and which folders matter depends on
 * what is being generated: a pipeline called "Krea2_Z_二采" is usually fed by
 * the Krea2 folder. So the picker matches the *first three* characters of the
 * pipeline name against the folder names (case-insensitively) and moves the
 * hits to the top; when nothing matches, it tries the *last three* characters
 * — "图生图h3尾" ends with "h3", which finds the h3 folder. When neither
 * matches, the original order is returned untouched.
 *
 * "Fuzzy" here means either direction: the folder contains the three letters
 * ("krea2" vs "kre"), or the three letters contain the folder ("h3v" vs "h3"),
 * which is how a short folder such as h3 still gets picked up.
 *
 * "None" is the "no LoRA" choice and always stays the first row, whatever the
 * rules say — it is the default and the quickest way out of the list.
 *
 * Only the order changes: every option stays in the list, and the stable
 * partition keeps the server's order inside each group.
 */
const NO_MODEL_VALUES = new Set(["none", "", "null", "无"]);

function isNoModelOption(option) {
    const { name } = splitOptionPath(option);
    return NO_MODEL_VALUES.has(String(name).trim().toLowerCase());
}

function rankModelOptions(options, hint, pipelineName) {
    const list = Array.isArray(options) ? [...options] : [];
    if (list.length < 2) return list;

    // None first, always, whatever happens below.
    const none = list.filter((option) => isNoModelOption(option));
    const rest = list.filter((option) => !isNoModelOption(option));
    const keepNoneFirst = (ordered) => [...none, ...ordered];
    if (rest.length < 2) return keepNoneFirst(rest);

    const title = String(pipelineName || "").trim();
    if (title.length < 3) return keepNoneFirst(rest);

    const folders = rest.map((option) => optionFolders(option));
    // A list with no folders at all (or all in one folder) has nothing to rank.
    const distinct = new Set(folders.filter(Boolean));
    if (!distinct.size) return keepNoneFirst(rest);

    // Both sides lowercased once; the rule itself is case-insensitive.
    const needleFits = (needle) => folders.some((folder) => {
        if (!folder) return false;
        if (folder.includes(needle)) return true;
        // A short folder ("h3") inside the three letters ("h3v") counts too.
        return folder.length >= 2 && needle.includes(folder);
    });

    const first = title.slice(0, 3).toLowerCase();
    const last = title.slice(-3).toLowerCase();
    let needle = "";
    if (needleFits(first)) needle = first;
    else if (needleFits(last)) needle = last;
    if (!needle) return keepNoneFirst(rest);

    const matches = (folder) => Boolean(folder)
        && (folder.includes(needle) || (folder.length >= 2 && needle.includes(folder)));

    // Stable partition: hits first (original order kept), then the rest.
    const hit = [];
    const others = [];
    rest.forEach((option, index) => {
        (matches(folders[index]) ? hit : others).push(option);
    });
    return keepNoneFirst([...hit, ...others]);
}

/**
 * Choose one value of a dropdown in a sheet that belongs to this page.
 *
 * The browser's own <select> popup is drawn by the browser: light background in
 * a dark UI, long model paths wrapped over several lines, no way to filter, and
 * it covers the whole screen on Android. Model lists run to hundreds of files,
 * so this offers a search box as well.
 *
 * Model files (LoRAs) are picked in two taps: the first shows what the file
 * actually looks like — its preview image — and the second confirms. Thirty
 * LoRAs with near-identical names cannot be told apart otherwise. Plain
 * choices (an aspect ratio, a sampler) are still a single tap.
 */
function chooseOption(title, options, current, onPick) {
    const overlay = document.createElement("div");
    overlay.className = "picker";
    const sheet = document.createElement("div");
    sheet.className = "picker-sheet";

    const head = document.createElement("div");
    head.className = "picker-head";
    const heading = document.createElement("span");
    heading.textContent = title || "选择";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "picker-close";
    close.innerHTML = iconSvg("close", 18);
    close.addEventListener("click", () => overlay.remove());
    head.append(heading, close);

    // Rows that carry a file name can be previewed before they are chosen.
    const previewable = (option) => MODEL_FILE_RE.test(String(option ?? ""));

    const preview = document.createElement("div");
    preview.className = "picker-preview";
    preview.hidden = true;
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const meta = document.createElement("div");
    meta.className = "meta";
    const pname = document.createElement("span");
    pname.className = "pname";
    const pdir = document.createElement("span");
    pdir.className = "pdir";
    const phint = document.createElement("span");
    phint.className = "phint";
    meta.append(pname, pdir, phint);
    preview.append(thumb, meta);

    /** Show one row in the preview strip; the LoRA's picture comes from disk. */
    const showPreview = (option) => {
        preview.hidden = false;
        const { dir, name } = splitOptionPath(option);
        pname.textContent = name;
        pdir.textContent = dir;
        pdir.hidden = !dir;
        // The hint is the whole interaction: one tap looks, two taps pick.
        phint.textContent = "再点一次选择";
        thumb.replaceChildren();
        const placeholder = (text) => {
            const none = document.createElement("span");
            none.className = "none";
            none.textContent = text;
            thumb.replaceChildren(none);
        };
        const url = `/qq_mobile/preview?name=${encodeURIComponent(option)}`;
        const image = new Image();
        image.alt = name;
        // No loading="lazy": the element is not in the document until it has
        // loaded, and a lazy image that is never in the viewport never loads.
        image.addEventListener("load", () => thumb.replaceChildren(image));
        image.addEventListener("error", () => {
            // Video LoRAs ship an mp4 preview instead of an image. The element
            // goes in straight away: waiting for a frame would leave an empty
            // box until the browser decoded it.
            const video = document.createElement("video");
            video.muted = true;
            video.loop = true;
            video.autoplay = true;
            video.playsInline = true;
            video.preload = "auto";
            video.addEventListener("error", () => placeholder("无预览图"));
            video.src = url;
            thumb.replaceChildren(video);
        });
        image.src = url;
    };

    const list = document.createElement("div");
    list.className = "picker-list";

    // Long model lists are unusable without a filter; short ones do not need it.
    const searchable = options.length > 12;
    let query = "";
    // The row seen but not yet chosen (first tap of the two).
    let previewing = null;
    const renderRows = () => {
        list.replaceChildren();
        const needle = query.trim().toLowerCase();
        const matches = needle
            ? options.filter((option) => String(option).toLowerCase().includes(needle))
            : options;
        if (!matches.length) {
            const empty = document.createElement("div");
            empty.className = "picker-empty";
            empty.textContent = "没有匹配项";
            list.appendChild(empty);
            return;
        }
        for (const option of matches) {
            const row = document.createElement("button");
            row.type = "button";
            row.className = "picker-row combo"
                + (option === current ? " on" : "")
                + (option === previewing ? " previewing" : "");
            const main = document.createElement("span");
            main.className = "row-main";
            const { dir, name } = splitOptionPath(option);
            const nameEl = document.createElement("span");
            nameEl.className = "row-name";
            nameEl.textContent = name;
            main.appendChild(nameEl);
            if (dir) {
                const dirEl = document.createElement("span");
                dirEl.className = "row-dir";
                dirEl.textContent = dir;
                main.appendChild(dirEl);
            }
            const tick = document.createElement("span");
            tick.className = "tick";
            tick.innerHTML = option === current ? iconSvg("check", 18, 2.2) : "";
            row.append(main, tick);
            row.addEventListener("click", () => {
                if (previewable(option) && previewing !== option) {
                    previewing = option;
                    showPreview(option);
                    // Only the class list changes; rebuilding would lose the
                    // scroll position of a several-hundred entry list.
                    for (const other of list.querySelectorAll(".picker-row.previewing")) {
                        other.classList.remove("previewing");
                    }
                    row.classList.add("previewing");
                    return;
                }
                onPick(option);
                overlay.remove();
            });
            list.appendChild(row);
        }
    };
    renderRows();

    sheet.append(head, preview);
    if (searchable) {
        const bar = document.createElement("div");
        bar.className = "picker-search";
        const input = document.createElement("input");
        input.type = "search";
        input.placeholder = "搜索…";
        input.addEventListener("input", () => {
            query = input.value;
            renderRows();
        });
        bar.appendChild(input);
        sheet.appendChild(bar);
    }
    sheet.appendChild(list);

    overlay.appendChild(sheet);
    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
    // Start at the current choice: a 300 entry list should not open at the top.
    const active = list.querySelector(".picker-row.on");
    if (active) active.scrollIntoView({ block: "center" });
}

/* ---------------- fullscreen text editor ---------------- */
/**
 * Long-press a text field to open it full screen.
 *
 * On a phone the inline box is cramped and the on-screen keyboard covers most
 * of the screen, so editing a long prompt in place is painful. Holding the
 * field for 2s promotes it to a full-screen editor instead of opening yet
 * another page or tab.
 */
const LONG_PRESS_MS = 2000;
/** Movement beyond this cancels the press, so scrolling never triggers it. */
const LONG_PRESS_SLOP = 12;

const editor = {
    key: null,
    original: "",
    openedAt: 0,
    timer: null,
    startX: 0,
    startY: 0,
    target: null,
};

function isEditorOpen() {
    return !el("editor").hidden;
}

function openEditor(parameter, sourceInput) {
    editor.key = parameter.key;
    editor.original = sourceInput.value;
    editor.openedAt = Date.now();
    editor.target = sourceInput;
    el("editorTitle").textContent = parameter.label || parameter.name || "编辑";
    const text = el("editorText");
    text.value = sourceInput.value;
    el("editor").hidden = false;
    el("editor").setAttribute("aria-hidden", "false");
    updateEditorCount();
    // Focus after the panel is visible, otherwise iOS refuses to show the
    // keyboard for a hidden element.
    requestAnimationFrame(() => {
        text.focus();
        text.setSelectionRange(text.value.length, text.value.length);
    });
}

function updateEditorCount() {
    const value = el("editorText").value;
    el("editorCount").textContent = `${value.length} 字`;
}

function closeEditor(commit) {
    if (!isEditorOpen()) return;
    const text = el("editorText");
    if (commit && editor.target) {
        editor.target.value = text.value;
        editor.target.dispatchEvent(new Event("input", { bubbles: true }));
    }
    el("editor").hidden = true;
    el("editor").setAttribute("aria-hidden", "true");
    // The click that closes the panel can otherwise land on a field below it.
    editor.openedAt = Date.now();
    editor.key = null;
    editor.target = null;
    el("editorText").blur();
}

/**
 * Wire long-press handling onto a text control.
 *
 * Pointer events cover mouse and touch alike. `touchstart` is also bound so a
 * long press still works while the page's scroll surface is intercepting
 * pointer events.
 */
function attachLongPress(input, parameter) {
    input.classList.add("longpressable");

    const clear = () => {
        clearTimeout(editor.timer);
        editor.timer = null;
        input.classList.remove("pressing");
    };

    const start = (event) => {
        if (isEditorOpen()) return;
        // Ignore secondary mouse buttons.
        if (event.pointerType === "mouse" && event.button !== 0) return;
        editor.startX = event.clientX ?? 0;
        editor.startY = event.clientY ?? 0;
        clearTimeout(editor.timer);
        editor.timer = setTimeout(() => {
            editor.timer = null;
            input.classList.remove("pressing");
            // Suppress the click/synthetic tap that would otherwise follow.
            editor.openedAt = Date.now();
            openEditor(parameter, input);
        }, LONG_PRESS_MS);
        input.classList.add("pressing");
    };

    const move = (event) => {
        if (!editor.timer) return;
        const dx = Math.abs((event.clientX ?? 0) - editor.startX);
        const dy = Math.abs((event.clientY ?? 0) - editor.startY);
        if (dx > LONG_PRESS_SLOP || dy > LONG_PRESS_SLOP) clear();
    };

    input.addEventListener("pointerdown", start);
    input.addEventListener("pointermove", move);
    input.addEventListener("pointerup", clear);
    input.addEventListener("pointercancel", clear);
    input.addEventListener("pointerleave", clear);
    input.addEventListener("touchstart", start, { passive: true });
    input.addEventListener("touchmove", move, { passive: true });
    input.addEventListener("touchend", clear);
    input.addEventListener("touchcancel", clear);
    input.addEventListener("contextmenu", (event) => {
        // A long press on mobile fires the context menu; the editor replaces it.
        if (Date.now() - editor.openedAt < 800) event.preventDefault();
    });
}

/** Model file pickers and sampler internals are rarely touched from a phone.
 * They go into a collapsed group so the first screen stays focused on the
 * prompt and the numbers that actually change per image.
 *
 * Membership is decided by name and by what the options look like, not by the
 * widget type. A dropdown the user promoted (任务模式 / 宽高比 / 增强方式) is a
 * primary choice and must stay visible, while a model file picker is noise
 * even though both are combos.
 */
const ADVANCED_NAMES = new Set([
    "unet_name", "clip_name", "vae_name", "ckpt_name", "lora_name",
    "sampler_name", "scheduler", "cfg", "denoise", "batch_size",
    "type", "device", "weight_dtype", "filename_prefix",
]);

const ADVANCED_LABELS = /模型|采样器|调度器|精度|设备/;
const MODEL_FILE_RE = /\.(safetensors|ckpt|pt|pth|bin|gguf)$/i;

const isAdvanced = (parameter) => {
    if (ADVANCED_NAMES.has(String(parameter.name || ""))) return true;
    if (ADVANCED_LABELS.test(String(parameter.label || ""))) return true;
    const type = String(parameter.type || "").toUpperCase();
    if (type === "COMBO" && parameter.options?.length) {
        // A combo whose options are file names is a model picker.
        return parameter.options.some(
            (option) => typeof option === "string" && MODEL_FILE_RE.test(option),
        );
    }
    return false;
};

/**
 * Shared prefix of a label such as "LoRA_1_名称" -> "LoRA_1".
 *
 * Multi-value and promoted inputs are labelled by row, so a LoRA's name and
 * weight carry the same prefix and differ only in the last segment.
 */
const labelStem = (label) => {
    const text = String(label || "").trim();
    const cut = Math.max(text.lastIndexOf("_"), text.lastIndexOf(" "));
    return cut > 0 ? text.slice(0, cut).trim() : "";
};

/**
 * Keep a model picker next to the number it belongs to.
 *
 * A LoRA row reads "LoRA_1_名称 / LoRA_1_权重". The name is a combo full of
 * *.safetensors, so on its own it is filed under 模型与采样 — while its weight
 * stays on the main form. The result reads as "0.8" with no clue which LoRA it
 * belongs to, and the LoRA can only be chosen after expanding a block that is
 * collapsed by default. When a sibling shares the prefix, the name is the
 * primary choice, so it moves up and sits right before its weight.
 */
function pairModelPickers(sections) {
    for (const bucket of sections.values()) {
        const primaryStems = new Map();
        for (const parameter of bucket.primary) {
            const stem = labelStem(parameter.label);
            if (stem && !primaryStems.has(stem)) primaryStems.set(stem, parameter);
        }
        if (!primaryStems.size) continue;
        const promoted = [];
        bucket.advanced = bucket.advanced.filter((parameter) => {
            const stem = labelStem(parameter.label);
            const sibling = stem ? primaryStems.get(stem) : null;
            if (!sibling) return true;
            promoted.push({ parameter, sibling });
            return false;
        });
        for (const { parameter, sibling } of promoted) {
            const index = bucket.primary.indexOf(sibling);
            if (index < 0) continue;
            bucket.primary.splice(index, 0, parameter);
        }
    }
}

/**
 * Render the form.
 *
 * A pipeline may hold several subgraph instances (often of the same
 * definition), whose promoted inputs share names. Each instance therefore
 * becomes its own titled section with its own collapsed "模型与采样" block,
 * so two "prompt" fields can never be confused for one another.
 */
function render(parameters) {
    const form = el("form");
    form.replaceChildren();
    const stored = loadStoredValues();
    const seen = new Set();

    // Preserve first-seen order of group names.
    const order = [];
    const sections = new Map();
    for (const parameter of parameters) {
        if (parameter.hidden) continue;
        seen.add(parameter.key);
        if (stored[parameter.key] !== undefined) {
            state.values[parameter.key] = stored[parameter.key];
        } else if (state.values[parameter.key] === undefined) {
            state.values[parameter.key] = parameter.value;
        }
        const name = String(parameter.group ?? "");
        if (!sections.has(name)) {
            sections.set(name, { primary: [], advanced: [] });
            order.push(name);
        }
        const bucket = sections.get(name);
        (isAdvanced(parameter) ? bucket.advanced : bucket.primary).push(parameter);
    }

    // A LoRA's name belongs next to its weight, not in the collapsed block.
    pairModelPickers(sections);

    const named = order.filter((name) => name).length;
    const showHeadings = order.length > 1;

    // Several QQ-多值输入 nodes: each one's heading can be folded. The heading
    // keeps the flat section look (accent bar + rule) but is larger and carries
    // a chevron on the right; only the first is open.
    const multiGroups = new Set(
        parameters.filter((parameter) => parameter.multi).map((parameter) => parameter.group),
    );
    const foldMulti = multiGroups.size > 1;
    let multiOpened = false;

    for (const name of order) {
        const { primary, advanced } = sections.get(name);
        if (foldMulti && multiGroups.has(name)) {
            form.appendChild(multiSection(name, primary, advanced, !multiOpened));
            multiOpened = true;
            continue;
        }
        if (showHeadings) form.appendChild(sectionHeading(name, named > 0));
        for (const parameter of primary) form.appendChild(fieldFor(parameter));
        if (advanced.length) {
            // Only worth naming the block when the form has named sections;
            // otherwise the title above it already says what it is.
            form.appendChild(advancedBlock(advanced, showHeadings ? name : ""));
        }
    }

    // Drop remembered values for parameters that no longer exist.
    for (const key of Object.keys(state.values)) {
        if (!seen.has(key)) delete state.values[key];
    }
    storeValues();

    if (!parameters.length) {
        form.innerHTML = `<div class="empty"><strong>这个工作流没有可调参数</strong>
            在 ComfyUI 里把子图的输入提升为参数后，重新点击「手机界面」。</div>`;
        return;
    }

    // Values are remembered per workflow, so offer a way back to the values
    // the workflow itself carries.
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "reset-btn";
    reset.textContent = "恢复默认值";
    reset.addEventListener("click", resetToDefaults);
    form.appendChild(reset);
}

/**
 * Forget every stored override and re-render from the template's values.
 *
 * The template holds the values the workflow had when it was prepared, which
 * is the closest thing to "defaults" the phone can see.
 */
function resetToDefaults() {
    state.values = {};
    try {
        localStorage.removeItem(`${STORAGE_KEY}:${state.workflow}`);
    } catch { /* storage blocked: re-render alone still resets the form */ }
    render(state.parameters);
    toast("已恢复默认值");
}

/** Heading for one subgraph instance's parameter section. */
function sectionHeading(name, subgraphs) {
    const heading = document.createElement("div");
    heading.className = "section-head";
    const title = document.createElement("span");
    title.className = "section-title";
    title.textContent = name || (subgraphs ? "未命名子图" : "参数");
    heading.appendChild(title);
    return heading;
}

/**
 * One QQ-多值输入 node's settings, foldable.
 *
 * With several nodes the form is a stack of similarly named rows, so each
 * node's heading can be folded. It keeps the flat section look — accent bar,
 * rule underneath, no surrounding box — and adds a larger title, a count and a
 * chevron at the right. Only the first node starts open.
 */
function multiSection(name, primary, advanced, open) {
    const group = document.createElement("details");
    group.className = "multi-fold";
    group.open = Boolean(open);

    const summary = document.createElement("summary");
    summary.className = "multi-head";
    const title = document.createElement("span");
    title.className = "multi-title";
    title.textContent = name || "多值输入";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = String(primary.length + advanced.length);
    const chevron = document.createElement("span");
    chevron.className = "multi-chevron";
    chevron.innerHTML = iconSvg("down", 17);
    summary.append(title, count, chevron);

    const body = document.createElement("div");
    body.className = "multi-body";
    for (const parameter of primary) body.appendChild(fieldFor(parameter));
    if (advanced.length) body.appendChild(advancedBlock(advanced, ""));

    group.append(summary, body);
    return group;
}

/** Collapsed block of rarely-touched model and sampler settings. */
/**
 * The collapsed "model & sampler" block.
 *
 * A pipeline with two subgraph instances gets two of these, and both used to
 * read "模型与采样" — sitting one above the other with no way to tell which
 * belongs to which section. The section name is appended when the form has
 * named sections at all.
 */
function advancedBlock(parameters, sectionName = "") {
    const group = document.createElement("details");
    group.className = "group";
    const summary = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = "模型与采样";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = String(parameters.length);
    summary.append(label, count);
    if (sectionName) {
        const where = document.createElement("span");
        where.className = "group-where";
        where.textContent = sectionName;
        summary.appendChild(where);
    }
    const body = document.createElement("div");
    body.className = "body";
    for (const parameter of parameters) body.appendChild(fieldFor(parameter));
    group.append(summary, body);
    return group;
}

/* ---------------- results ---------------- */
function viewUrl(item) {
    const params = new URLSearchParams({
        filename: item.filename || "",
        subfolder: item.subfolder || "",
        type: item.type || "output",
    });
    if (item.format) params.set("format", item.format);
    // Prefix the mount path: behind a reverse proxy serving ComfyUI under a
    // subpath, a bare "/view" points outside the mount and 404s.
    return `${basePath()}/view?${params.toString()}`;
}

function renderResults(media) {
    const host = el("results");
    const label = el("resultsLabel");
    host.replaceChildren();
    label.hidden = !media.length;
    for (const item of media) {
        const card = document.createElement("div");
        card.className = "result-card";

        if (item.kind === "text") {
            const pre = document.createElement("pre");
            pre.textContent = item.text;
            card.appendChild(pre);
        } else if (item.kind === "audio") {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = viewUrl(item);
            card.appendChild(audio);
        } else if (item.kind === "videos" || /\.(mp4|webm|mov)$/i.test(item.filename || "")) {
            const video = document.createElement("video");
            video.controls = true;
            video.playsInline = true;
            video.src = viewUrl(item);
            card.appendChild(video);
        } else {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = viewUrl(item);
            img.alt = item.filename || "结果";
            card.appendChild(img);
        }

        const meta = document.createElement("div");
        meta.className = "result-meta";
        const size = document.createElement("span");
        const dims = item.metadata || {};
        size.textContent = dims.width && dims.height ? `${dims.width} × ${dims.height}` : "";

        if (item.filename) {
            const name = document.createElement("span");
            name.textContent = item.filename;
            name.style.overflow = "hidden";
            name.style.textOverflow = "ellipsis";
            name.style.whiteSpace = "nowrap";
            name.style.flex = "1";
            name.style.minWidth = "0";
            const link = document.createElement("a");
            link.href = viewUrl(item);
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "查看原图";
            meta.append(size, name, link);
        } else {
            meta.append(size);
        }
        card.appendChild(meta);
        host.appendChild(card);
    }

    if (media.length) {
        // The result is the point of the screen: bring the first card fully
        // into view instead of leaving it below a long parameter list.
        const first = host.firstElementChild;
        const scroll = () => {
            const target = first ?? label;
            const box = target?.getBoundingClientRect?.();
            const mainEl = el("main");
            if (!box || !mainEl) return;
            const footer = document.querySelector("footer");
            // The footer is fixed, so it covers the bottom of the scroll area:
            // treat its top edge as the real bottom of the visible viewport.
            const visibleBottom = footer
                ? footer.getBoundingClientRect().top
                : window.innerHeight;
            if (box.top >= 0 && box.bottom <= visibleBottom) return;
            mainEl.scrollTop += box.top - Math.max(0, (visibleBottom - box.height) / 2);
        };
        requestAnimationFrame(scroll);
        // Images change height once loaded, so re-anchor when that happens.
        host.querySelectorAll("img, video").forEach((node) => {
            if (node.complete) return;
            node.addEventListener("load", scroll, { once: true });
            node.addEventListener("loadedmetadata", scroll, { once: true });
        });
    }
    updateResultChip();
}

/**
 * Offer a way back to the result once it has scrolled out of view.
 *
 * A finished image sits below a long parameter list, so tweaking values and
 * returning to the picture means a lot of scrolling on a phone.
 */
function updateResultChip() {
    const chip = el("resultChip");
    const first = el("results").firstElementChild;
    if (!first || el("footer").hidden) {
        chip.hidden = true;
        return;
    }
    const box = first.getBoundingClientRect();
    const footerTop = el("footer").getBoundingClientRect().top;
    // Hide it once the result is on screen, and while a job is still running.
    chip.hidden = state.polling || (box.bottom > 0 && box.top < footerTop);
}

/* ---------------- network ---------------- */
const basePath = () => {
    const { pathname } = window.location;
    const trimmed = pathname.endsWith("/") ? pathname.slice(0, -1) : pathname;
    return trimmed.endsWith("/qq_mobile") ? trimmed.slice(0, -11) : "";
};

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/**
 * Inline icons.
 *
 * Buttons used to mix text glyphs (⤢, ⚄, −, +, ▾, ×, ›) with the header's
 * stroked SVGs: different weights, different vertical centring, and a few of
 * them render in whatever the platform's fallback font has. One set, one
 * stroke width, drawn at the size each control asks for.
 */
const ICON_PATHS = {
    expand: '<path d="M9 3H3v6"/><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 15v6h-6"/>',
    dice: '<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>',
    minus: '<path d="M5 12h14"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
    next: '<path d="M9 6l6 6-6 6"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    check: '<path d="M4 12l5 5L20 6"/>',
    download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    // A bin, for "remove everything in this field".
    erase: '<path d="M3 6h18"/><path d="M9 6V4h6v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
};

function iconSvg(name, size = 18, strokeWidth = 1.8) {
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none"
        stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;
}

/** Give a button an icon without losing its text. */
function setIcon(element, name, size = 18) {
    element.innerHTML = iconSvg(name, size);
    element.dataset.icon = "1";
    return element;
}

async function fetchJson(path, options) {
    const response = await fetch(`${basePath()}${path}`, options);
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }
    if (!response.ok) {
        const message = data?.error?.message || data?.error || text.slice(0, 160);
        throw new Error(typeof message === "string" ? message : `HTTP ${response.status}`);
    }
    return data;
}

/**
 * Reload the form when the browser-side state changes.
 *
 * The canvas can change while the phone page is open — most notably a
 * QQ-多值输入 switch that flips a bypass rule and enables a media loader. The
 * extension re-pushes the template when that happens, so the phone only has to
 * notice the new revision and re-render. Values already typed are preserved
 * per field key by the form itself.
 */
const TEMPLATE_POLL_MS = 3000;
let templateRevision = null;
let templateTimer = null;

async function watchTemplate() {
    clearTimeout(templateTimer);
    templateTimer = setTimeout(watchTemplate, TEMPLATE_POLL_MS);
    if (state.polling) return;
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        if (templateRevision === null) {
            templateRevision = data.updated;
            return;
        }
        if (data.updated !== templateRevision) {
            templateRevision = data.updated;
            const kept = { ...state.values };
            state.parameters = data.parameters || [];
            el("title").textContent = data.title || "手机界面";
            document.title = data.title || "手机界面";
            render(state.parameters);
            // Restore what the user had typed for keys that still exist.
            for (const [key, value] of Object.entries(kept)) {
                if (key in state.values) state.values[key] = value;
            }
            toast("参数已同步");
        }
    } catch {
        // A missing template is handled by the initial load; stay quiet here.
    }
}

async function loadTemplate() {
    setStatus(null);
    try {
        const query = state.workflow ? `?workflow=${encodeURIComponent(state.workflow)}` : "";
        const data = await fetchJson(`/qq_mobile/template${query}`);
        state.workflow = data.workflow;
        state.parameters = data.parameters || [];
        templateRevision = data.updated;
        el("title").textContent = data.title || "手机界面";
        // Keep the browser tab in sync with the pipeline name.
        document.title = data.title || "手机界面";
        // Only meaningful once a pipeline is loaded.
        el("switch").hidden = false;
        el("generate").disabled = false;
        setFooterVisible(true);
        render(state.parameters);
        renderHistory();
        watchTemplate();
        return true;
    } catch (error) {
        setFooterVisible(false);
        el("form").innerHTML = `<div class="empty"><strong>还没有模板</strong>
            回到 ComfyUI 打开工作流，点顶部「手机界面」按钮即可生成。<br>
            <span style="opacity:.6">${String(error.message || error)}</span></div>`;
        return false;
    }
}

function setBusy(busy, label) {
    const button = el("generate");
    button.disabled = busy;
    // A slow breathe while a job runs: the screen should not look stuck
    // between two polls.
    button.classList.toggle("busy", Boolean(busy));
    button.innerHTML = busy
        ? '<span class="spinner"></span><span>生成中</span>'
        : `<span>${label || "生成"}</span>`;
    el("cancel").hidden = !busy;
}

/**
 * How many images one press should queue.
 *
 * On a phone the whole point is to walk away: several variants queued at once,
 * each with its own seed, then pick the best from the results.
 */
const BATCH_KEY = "qq-mobile-batch";
const BATCH_MAX = 4;

function loadBatch() {
    try {
        const value = Number(localStorage.getItem(BATCH_KEY));
        return Number.isFinite(value) && value >= 1 && value <= BATCH_MAX
            ? Math.floor(value) : 1;
    } catch {
        return 1;
    }
}

function renderBatch() {
    const button = el("batch");
    button.textContent = `×${state.batch}`;
    button.classList.toggle("on", state.batch > 1);
}

function cycleBatch() {
    state.batch = state.batch >= BATCH_MAX ? 1 : state.batch + 1;
    try {
        localStorage.setItem(BATCH_KEY, String(state.batch));
    } catch {
        /* not important */
    }
    renderBatch();
}

/** Copy of the values with fresh seeds, for the 2nd..nth image. */
function nextSeedValues(values) {
    const copy = { ...values };
    for (const parameter of state.parameters || []) {
        if (!isSeedParameter(parameter)) continue;
        copy[parameter.key] = randomSeed(parameter);
    }
    return copy;
}

async function generate() {
    if (state.polling) return;
    setBusy(true);
    setStatus("running", "已提交，等待开始…");
    // Indeterminate until the server reports a step.
    setProgress(null);
    renderResults([]);
    state.media = [];
    state.failedError = "";

    const count = Math.max(1, state.batch || 1);
    const ids = [];
    try {
        for (let index = 0; index < count; index += 1) {
            // The first image keeps the form's seed; the rest get new ones, so a
            // batch is not several copies of the same picture.
            const values = index === 0 ? { ...state.values } : nextSeedValues(state.values);
            const data = await fetchJson("/qq_mobile/prompt", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workflow: state.workflow, values }),
            });
            if (data.prompt_id) ids.push(data.prompt_id);
            if (data.warnings?.length) toast(data.warnings.join("；"));
        }
        if (!ids.length) throw new Error("没有返回任务号");
        state.promptId = ids[ids.length - 1];
        state.promptIds = ids;
        poll();
    } catch (error) {
        setBusy(false, "重试");
        setStatus("error", `提交失败：${error.message}`);
        setProgress(undefined);
    }
}

function stopPolling() {
    state.polling = false;
    clearTimeout(state.timer);
    setBusy(false, "再生成一张");
}

/** Take in one job's result: done, failed or still running. */
function absorb(data) {
    if (data.media?.length) {
        state.media.push(...data.media);
        renderResults(state.media);
        return true;
    }
    if (data.status === "failed") {
        // Remembered rather than toasted straight away: in a batch, a failed
        // job must not read as "finished" while its siblings still run.
        state.failedError = String(data.execution_error || "执行失败");
        return true;
    }
    return data.status === "completed"
        || data.status === "cancelled"
        || data.status === "lost";
}

async function poll() {
    state.polling = true;
    const ids = state.promptIds?.length ? [...state.promptIds] : [state.promptId];
    const total = ids.length;
    try {
        const remaining = [];
        for (const [index, id] of ids.entries()) {
            const data = await fetchJson(`/qq_mobile/jobs?prompt_id=${encodeURIComponent(id)}`);
            const label = total > 1 ? `（${index + 1}/${total}）` : "";
            if (data.status === "pending") {
                const position = Number.isFinite(data.position) ? data.position + 1 : null;
                setStatus("running", position
                    ? `排队中，前面还有 ${position} 个任务${label}`
                    : `排队中…${label}`);
                setProgress(null);
                remaining.push(id);
                continue;
            }
            if (data.status === "in_progress") {
                setStatus("running", total > 1
                    ? `正在生成 ${index + 1}/${total}…`
                    : "正在生成…");
                setProgress(null);
                remaining.push(id);
                continue;
            }
            // Finished, failed or cancelled: nothing left to wait for.
            absorb(data);
        }

        state.promptIds = remaining;
        if (!remaining.length) {
            const produced = state.media.length;
            const failed = state.failedError;
            if (produced) {
                setStatus(failed ? "error" : "done", total > 1
                    ? `完成，共 ${produced} 个结果${failed ? "（部分失败）" : ""}`
                    : "完成");
                if (failed) toast(String(failed).slice(0, 120));
                pushHistory(state.media);
            } else if (failed) {
                setStatus("error", `执行失败：${String(failed).slice(0, 160)}`);
            } else {
                setStatus("error", "完成，但没有输出媒体");
            }
            setProgress(undefined);
            stopPolling();
            return;
        }
    } catch (error) {
        setStatus("error", `查询失败：${error.message}`);
    }
    state.timer = setTimeout(poll, POLL_MS);
}

async function cancel() {
    try {
        // The prompt id lets the backend drop a job that is still queued;
        // /interrupt alone only stops the one that is executing.
        await fetchJson("/qq_mobile/interrupt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt_id: state.promptId || "" }),
        });
        toast("已取消");
    } catch (error) {
        toast(`取消失败：${error.message}`);
    }
    stopPolling();
    setStatus("error", "已取消");
    setProgress(undefined);
}

/* ---------------- pipeline picker ---------------- */
/** Last few characters of a workflow key, to separate identical titles. */
function shortWorkflowId(workflow) {
    const text = String(workflow || "");
    const tail = text.split(/[\\/]/).pop() || text;
    const id = tail.replace(/^unsaved-/, "");
    return id.slice(-4);
}

/** Which pipelines were opened from this phone, and when. */
const RECENT_KEY = "qq-mobile-recent";

function loadRecent() {
    try {
        const raw = localStorage.getItem(RECENT_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return parsed && typeof parsed === "object" ? parsed : {};
    } catch {
        return {};
    }
}

/** Remember a pipeline as used; keeps the twelve newest entries. */
function markRecent(key) {
    if (!key) return;
    const map = loadRecent();
    map[key] = Date.now();
    const entries = Object.entries(map)
        .sort((a, b) => Number(b[1]) - Number(a[1]))
        .slice(0, 12);
    try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(Object.fromEntries(entries)));
    } catch {
        /* private mode: the ordering is a nicety, not a requirement */
    }
}

/** "刚刚" / "3 分钟前" / "2 天前", for the picker's secondary line. */
function relativeTime(stamp) {
    const seconds = Math.floor(Date.now() / 1000 - Number(stamp || 0));
    if (!Number.isFinite(seconds) || seconds < 0) return "";
    if (seconds < 60) return "刚刚";
    if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
    if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} 天前`;
    return `${Math.floor(seconds / (86400 * 30))} 个月前`;
}

/**
 * List the prepared pipelines so one can be chosen on the phone.
 *
 * Shown when the page was opened without a specific workflow, or when the user
 * asks to switch. Tapping a row loads that pipeline's form. The library runs to
 * dozens of files, so the list is searchable and the pipelines actually used
 * recently are offered first.
 */
async function showPipelinePicker() {
    const host = el("form");
    const results = el("results");
    results.replaceChildren();
    el("resultsLabel").hidden = true;
    el("history").hidden = true;
    el("historyLabel").hidden = true;
    el("generate").disabled = true;
    el("switch").hidden = true;
    // The footer only holds actions for a loaded pipeline, and the refresh
    // button would silently open the newest one from here.
    setFooterVisible(false);
    el("title").textContent = "选择流水线";
    document.title = "选择流水线";
    setStatus(null);

    let templates = [];
    let files = [];
    try {
        // The library listing is what makes every saved pipeline visible; the
        // template list only tells us which of them are ready to run.
        const [stateData, libData] = await Promise.all([
            fetchJson("/qq_mobile/state").catch(() => ({ templates: [] })),
            fetchJson("/qq_mobile/workflows").catch(() => ({ workflows: [] })),
        ]);
        templates = stateData.templates || [];
        files = libData.workflows || [];
    } catch (error) {
        host.innerHTML = `<div class="empty"><strong>读取流水线失败</strong>
            ${String(error.message || error)}</div>`;
        return;
    }

    // Merge: every saved workflow gets a row. Ones with a template are ready;
    // the rest are listed as a reminder that they exist but need a pass
    // through the editor first.
    const byKey = new Map(templates.map((item) => [item.workflow, item]));
    const rows = [];
    for (const file of files) {
        if (!file.id) continue;
        const key = `unsaved-${file.id}`;
        const template = byKey.get(key);
        byKey.delete(key);
        rows.push({
            key,
            title: template?.title || file.name,
            folder: file.folder || template?.folder || "",
            name: file.name,
            path: file.path || "",
            parameters: template?.parameters || 0,
            ready: Boolean(template),
            updated: template?.updated || file.updated || 0,
        });
    }
    // Templates with no file behind them (a canvas that was never saved).
    for (const template of byKey.values()) {
        rows.push({
            key: template.workflow,
            title: template.title || template.workflow,
            folder: template.folder || "",
            name: template.title || template.workflow,
            parameters: template.parameters || 0,
            ready: true,
            updated: template.updated || 0,
        });
    }

    if (!rows.length) {
        host.innerHTML = `<div class="empty"><strong>还没有可用的流水线</strong>
            在 ComfyUI 里打开工作流，点顶部「手机界面」按钮即可生成。</div>`;
        return;
    }

    host.replaceChildren();
    // Duplicate titles (two "Unsaved Workflow") get a short id suffix.
    const titleCounts = new Map();
    for (const row of rows) {
        titleCounts.set(row.title, (titleCounts.get(row.title) || 0) + 1);
    }

    // A search bar, because the folder grouping alone means scrolling past
    // everything in the library to find one pipeline by name.
    const bar = document.createElement("div");
    bar.className = "picker-search pipeline-search";
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = "搜索流水线…";
    input.setAttribute("aria-label", "搜索流水线");
    bar.appendChild(input);

    const body = document.createElement("div");
    body.className = "pipeline-body";

    const paint = (query) => {
        body.replaceChildren();
        const needle = String(query || "").trim().toLowerCase();
        if (needle) {
            const hits = rows.filter((row) => [row.title, row.name, row.folder, row.key]
                .some((value) => String(value || "").toLowerCase().includes(needle)));
            if (!hits.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.innerHTML = "<strong>没有匹配的流水线</strong>";
                body.appendChild(empty);
                return;
            }
            const list = document.createElement("div");
            list.className = "pipeline-list";
            for (const item of hits) list.appendChild(pipelineRow(item, titleCounts));
            body.appendChild(list);
            return;
        }

        // Recently opened pipelines first: the phone is used to repeat the two
        // or three pipelines that are in rotation, not to browse the library.
        const recent = loadRecent();
        const recentRows = rows
            .filter((row) => recent[row.key])
            .sort((a, b) => recent[b.key] - recent[a.key])
            .slice(0, 4);
        const shownAbove = new Set();
        if (recentRows.length) {
            const list = document.createElement("div");
            list.className = "pipeline-list";
            const head = document.createElement("div");
            head.className = "folder-head recent";
            head.textContent = "最近使用";
            list.appendChild(head);
            for (const item of recentRows) {
                list.appendChild(pipelineRow(item, titleCounts));
                shownAbove.add(item.key);
            }
            body.appendChild(list);
        }

        // Group by the folder the workflow lives in, the way the editor sidebar
        // does; root-level files come first. Anything already listed under
        // 最近使用 is not repeated below — on a phone the repeat reads as a bug.
        const groups = new Map();
        for (const row of rows) {
            if (shownAbove.has(row.key)) continue;
            if (!groups.has(row.folder)) groups.set(row.folder, []);
            groups.get(row.folder).push(row);
        }
        const folderOrder = [...groups.keys()].sort((a, b) => {
            if (a === b) return 0;
            if (!a) return -1;
            if (!b) return 1;
            return a.localeCompare(b, "zh");
        });

        for (const folder of folderOrder) {
            const list = document.createElement("div");
            list.className = "pipeline-list";
            if (folderOrder.length > 1) {
                const head = document.createElement("div");
                head.className = "folder-head";
                head.textContent = folder || "未分组";
                list.appendChild(head);
            }
            const items = groups.get(folder).sort((a, b) => {
                if (a.ready !== b.ready) return a.ready ? -1 : 1;
                return (b.updated || 0) - (a.updated || 0);
            });
            for (const item of items) {
                list.appendChild(pipelineRow(item, titleCounts));
            }
            body.appendChild(list);
        }
    };

    input.addEventListener("input", () => paint(input.value));
    host.append(bar, body);
    paint("");
}

/** One row in the pipeline picker. */
function pipelineRow(item, titleCounts) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "pipeline-row" + (item.ready ? "" : " is-pending");

    const main = document.createElement("div");
    main.className = "pipeline-main";
    const name = document.createElement("span");
    name.className = "pipeline-name";
    name.textContent = (titleCounts.get(item.title) || 0) > 1
        ? `${item.title} · ${shortWorkflowId(item.key)}`
        : item.title;
    const meta = document.createElement("span");
    meta.className = "pipeline-meta";
    meta.textContent = item.ready
        ? `${item.parameters} 个参数 · ${relativeTime(item.updated)}`
        : "待准备";
    main.append(name, meta);

    const arrow = document.createElement("span");
    arrow.className = "pipeline-arrow";
    arrow.innerHTML = item.ready ? iconSvg("next", 18) : "";

    row.append(main, arrow);
    row.addEventListener("click", async () => {
        if (row.dataset.busy === "1") return;
        if (!item.ready) {
            // Not prepared yet: ask the editor to expand this one workflow and
            // wait for it. Preparing every workflow up front would cost
            // seconds per file and swap the canvas once per file.
            const ok = await preparePipeline(item, row, meta, arrow);
            if (!ok) return;
        }
        state.workflow = item.key;
        markRecent(item.key);
        const url = new URL(window.location.href);
        url.searchParams.set("workflow", item.key);
        window.history.replaceState({}, "", url);
        loadTemplate();
    });
    return row;
}

/**
 * Ask the editor to prepare one workflow and wait for it.
 *
 * The editor is the only place that can expand a workflow, so the phone
 * leaves a request and watches for the template to appear.
 */
async function preparePipeline(item, row, meta, arrow) {
    if (!item.path) {
        toast(`「${item.name}」还没有准备，请在 ComfyUI 里点一次「手机界面」`);
        return false;
    }
    row.dataset.busy = "1";
    row.classList.add("is-preparing");
    meta.textContent = "准备中…";
    arrow.textContent = "…";
    try {
        await fetchJson("/qq_mobile/prepare", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                workflow: item.key,
                path: item.path,
                title: item.title || item.name,
                folder: item.folder || "",
            }),
        });
        const outcome = await waitForTemplate(item.key);
        if (outcome.state === "ready") return true;
        meta.textContent = "待准备";
        arrow.innerHTML = "";
        if (outcome.state === "failed") {
            toast(prepareFailureText(outcome.error, item));
        } else {
            toast("还没准备好：请在电脑上回到 ComfyUI 页面，打开这条流水线后点一次「手机界面」");
        }
        return false;
    } catch (error) {
        meta.textContent = "待准备";
        arrow.innerHTML = "";
        toast(`准备失败：${String(error.message || error)}`);
        return false;
    } finally {
        row.dataset.busy = "0";
        row.classList.remove("is-preparing");
    }
}

/**
 * Wait for a workflow to be prepared.
 *
 * Returns "ready", "failed" or "timeout". A failure carries the reason.
 */
async function waitForTemplate(key, timeoutMs = 12000) {
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
        await sleep(700);
        const template = await fetchJson(
            `/qq_mobile/template?workflow=${encodeURIComponent(key)}`,
        ).catch(() => null);
        if (template && !template.error) return { state: "ready" };
        const data = await fetchJson("/qq_mobile/prepare").catch(() => null);
        const request = (data?.requests || []).find(
            (entry) => entry.workflow === key,
        );
        if (request?.state === "failed") {
            return { state: "failed", error: request.error || "" };
        }
    }
    return { state: "timeout" };
}

/** Wording for a workflow that could not be prepared. */
function prepareFailureText(error, item) {
    const message = String(error || "");
    if (message.includes("既没有子图")) {
        return `「${item.name}」没有可在手机上调节的参数`;
    }
    return `「${item.name}」准备失败：${message.slice(0, 60) || "未知原因"}`;
}

/* ---------------- swipe between pipelines ---------------- */
/**
 * Swipe left/right on the form to move to the next/previous pipeline.
 *
 * Switching used to be: tap 切换 → find the row → tap. A swipe is the gesture
 * a phone user reaches for. The gesture is only taken when it is clearly
 * horizontal and did not start on something that scrolls sideways itself
 * (media strip, history strip) or on a field being edited.
 */
const SWIPE_MIN = 70;
let swipeStart = null;

function swipeIgnored(target) {
    return Boolean(target?.closest?.(
        "input, textarea, select, .media-thumbs, .history, .picker, .viewer, .editor",
    ));
}

/** Ordered keys of the pipelines the phone can actually open. */
async function pipelineOrder() {
    if (state.order?.length) return state.order;
    try {
        const [stateData, libData] = await Promise.all([
            fetchJson("/qq_mobile/state").catch(() => ({ templates: [] })),
            fetchJson("/qq_mobile/workflows").catch(() => ({ workflows: [] })),
        ]);
        const ready = new Set((stateData.templates || []).map((item) => item.workflow));
        const keys = [];
        for (const file of libData.workflows || []) {
            if (!file.id) continue;
            const key = `unsaved-${file.id}`;
            if (ready.has(key)) keys.push(key);
        }
        state.order = keys;
        return keys;
    } catch {
        return [];
    }
}

async function swipeTo(direction) {
    const order = await pipelineOrder();
    const index = order.indexOf(state.workflow);
    if (index < 0 || order.length < 2) {
        toast("没有其他可切换的流水线");
        return;
    }
    const key = order[(index + direction + order.length) % order.length];
    state.workflow = key;
    markRecent(key);
    const url = new URL(window.location.href);
    url.searchParams.set("workflow", key);
    window.history.replaceState({}, "", url);
    renderResults([]);
    await loadTemplate();
}

function attachSwipe() {
    const surface = el("main");
    surface.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1 || swipeIgnored(event.target)) {
            swipeStart = null;
            return;
        }
        const touch = event.touches[0];
        swipeStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    surface.addEventListener("touchend", (event) => {
        if (!swipeStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - swipeStart.x;
        const dy = touch.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        // Swiping left turns to the next pipeline.
        swipeTo(dx < 0 ? 1 : -1);
    }, { passive: true });
}

/* ---------------- boot ---------------- */
el("generate").addEventListener("click", generate);
el("batch").addEventListener("click", cycleBatch);
el("cancel").addEventListener("click", cancel);
el("reload").addEventListener("click", async () => {
    const ok = await loadTemplate();
    toast(ok ? "参数已刷新" : "刷新失败");
});

/* Back to the ComfyUI graph. The toolbar button navigates here in the same
 * tab, so history.back() returns to the editor; opening the phone page
 * directly has nothing to go back to, so fall back to the root URL. */
el("back").addEventListener("click", () => {
    if (window.history.length > 1 && document.referrer) {
        window.history.back();
        return;
    }
    const base = basePath();
    window.location.assign(`${base}/`);
});

/* Switch pipelines without leaving the page. */
el("switch").addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.delete("workflow");
    window.history.replaceState({}, "", url);
    state.workflow = "";
    clearTimeout(templateTimer);
    showPipelinePicker();
});

/* Fullscreen viewer for past results. */
el("viewerClose").addEventListener("click", closeViewer);
el("viewerReuse").addEventListener("click", reuseEntry);
el("viewer").addEventListener("click", (event) => {
    if (event.target === el("viewer") || event.target.closest(".viewer-stage")) closeViewer();
});

/* Fullscreen editor wiring. */
el("editorText").addEventListener("input", updateEditorCount);
el("editorDone").addEventListener("click", () => closeEditor(true));
el("editorWipe").addEventListener("click", () => {
    // Same promise as the field's own button, and the caret stays in the box
    // so a new prompt can be typed straight away.
    const text = el("editorText");
    text.value = "";
    updateEditorCount();
    text.focus();
});
el("editorRevert").addEventListener("click", () => {
    el("editorText").value = editor.original;
    updateEditorCount();
});
document.addEventListener("keydown", (event) => {
    if (!isEditorOpen()) return;
    if (event.key === "Escape") {
        event.preventDefault();
        closeEditor(false);
    } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        closeEditor(true);
    }
});

/* Keep the "back to result" chip in step with the scroll position. */
el("main").addEventListener("scroll", updateResultChip, { passive: true });
el("resultChip").addEventListener("click", () => {
    const first = el("results")?.firstElementChild;
    if (!first) return;
    const mainEl = el("main");
    mainEl.scrollTo({ top: mainEl.scrollTop + first.getBoundingClientRect().top - 12,
                      behavior: "smooth" });
    el("resultChip").hidden = true;
});

/* Open the pipeline picker: without a workflow in the URL the page starts
 * there, so a phone can choose which pipeline to run instead of being locked
 * to whichever one the editor happened to have open. */
const initialWorkflow = new URLSearchParams(location.search).get("workflow");
state.batch = loadBatch();
renderBatch();
renderHistory();
attachSwipe();

/**
 * Keep the scroll area clear of the footer.
 *
 * The footer grows a line when a job reports status and another one when the
 * "查看结果" chip appears; a fixed padding went stale and the last field ended
 * up underneath it.
 */
function trackFooterHeight() {
    const footer = el("footer");
    if (!footer) return;
    const apply = () => {
        const height = Math.round(footer.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--footer-h", `${height}px`);
    };
    if (typeof ResizeObserver === "function") {
        new ResizeObserver(apply).observe(footer);
    }
    apply();
}
trackFooterHeight();
if (initialWorkflow) {
    state.workflow = initialWorkflow;
    loadTemplate();
} else {
    showPipelinePicker();
}</script>
</body>
</html>
